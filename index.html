들에게 전하는 서두에서 주 하나님은 지금도 계시고 전에도 계셨으며 장차 오실 전능한 분이라고 자신을 밝히셔. 알파와 오메가는 그리스어 글자의 처음과 끝이야. 이 선언은 우리의 앞날이 어떻게 펼쳐질지 알려 주는 암호가 아니야. 교회가 마주한 현실의 시작과 끝을 하나님께서 붙드신다는 말이지.\n\n### 두 말씀이 만나는 지점\n시편은 오래 살아도 끝이 있는 사람의 자리에서 하나님을 ‘거처’라 부르고, 계시록은 그 시간 전체를 품으시는 분이 스스로 누구인지 말씀하셔. 하나는 피할 곳을 찾는 기도이고 다른 하나는 들려오는 선언이야. 두 말씀을 함께 두니 영원은 막연히 먼 시간이 아니라, 지금 의지할 수 있는 하나님을 가리킨다는 생각이 들어.\n\n### 오늘 붙잡을 한 줄\n변하는 날들 가운데, 하나님은 우리가 돌아갈 거처이시다.\n\n## 오늘의 적용\n오늘의 계획을 세울 때 모든 시간을 내가 통제해야 한다는 마음이 올라오면 잠시 멈춰 봐. 내 하루는 유한하다는 사실을 인정하고, 그 하루를 영원하신 하나님 앞에서 어떻게 쓸지 한 가지를 정해 보면 좋겠어.\n\n## 짧은 기도\n하나님, 짧고 불확실한 제 시간을 주님께 맡깁니다. 오늘도 주님을 제 거처로 알고, 주어진 하루를 성실하고 평안하게 살게 해 주세요. 아멘.","v":[{"ref":"시편 90:1-2","en":"Psalm 90:1-2","krv":"주여 주는 대대에 우리의 거처가 되셨나이다 산이 생기기 전, 땅과 세계도 주께서 조성하시기 전 곧 영원부터 영원까지 주는 하나님이시니이다","bsb":"Lord, You have been our dwelling place through all generations. Before the mountains were born or You brought forth the earth and the world, from everlasting to everlasting You are God."},{"ref":"요한계시록 1:8","en":"Revelation 1:8","krv":"주 하나님이 가라사대 나는 알파와 오메가라 이제도 있고 전에도 있었고 장차 올 자요 전능한 자라 하시더라","bsb":"“I am the Alpha and the Omega,” says the Lord God, who is and was and is to come—the Almighty."}],"src":[{"name":"Bible 2.0","title":"The Word 2026 · English Standard Version 연도 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"KorRV · Korean Revised Version 모듈","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"}],"sha":"fb4f50bf75d67a6727e55682c8b7b2a534ed995a2c2f550681e759f33265c04a"},{"date":"2026-09-26","title":"구한 것을 넘어, 주님 안에서 기뻐하기","subtitle":"사무엘상 1:20 · 사무엘상 2:1","tagline":"받은 것보다 먼저, 주신 분 안에서 기뻐하자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 사무엘상 1:20\n한나는 오래 기도한 끝에 아들을 얻고, 그 아이에게 사무엘이라는 이름을 붙인다. 이름에는 “여호와께 구하였다”는 고백이 남아 있다. 이 한 절은 한나의 소망이 이루어진 순간이지만, 그의 이야기를 자기 바람의 승리로 끝내지 않는다. 사무엘은 한나가 붙들어 두기보다 하나님께 다시 드릴 아이가 된다.\n\n### 둘째 말씀 — 사무엘상 2:1\n다음 장의 기도는 아이를 얻은 기쁨에서 출발하지만, 곧 하나님 자신을 향한다. 한나는 자기 마음이 즐거운 이유를 아들이 아니라 “여호와 안에서”라고 말한다. 기도의 중심이 선물에서 선물을 주신 분께 옮겨간다.\n\n### 두 말씀이 만나는 지점\n1장 20절의 이름은 구한 것을 기억하게 하고, 2장 1절의 노래는 그 응답이 누구에게서 왔는지를 기억하게 한다. 받은 것을 붙들어 내 삶의 증거로 만들기보다, 그 선물로 하나님을 더 분명히 보게 되는 길이다.\n\n### 오늘 붙잡을 한 줄\n받은 것보다 먼저, 주신 분 안에서 기뻐하자.\n\n## 오늘의 적용\n오늘 고마운 일 하나를 떠올린 뒤 “내가 얻었다”에서 멈추지 말고, 그것을 통해 하나님께 무엇을 고백할 수 있는지 한 문장으로 적어보자.\n\n## 짧은 기도\n주님, 제가 받은 것을 제 손안의 증거로만 삼지 않게 하시고, 그 모든 선물로 주님을 더 기뻐하게 하소서. 아멘.","v":[{"ref":"사무엘상 1:20","en":"1 Samuel 1:20","krv":"한나가 잉태하고 때가 이르매 아들을 낳아 사무엘이라 이름하였으니 이는 내가 여호와께 그를 구하였다 함이더라","bsb":"In the course of time, Hannah conceived and gave birth to a son. She named him Samuel, saying, “Because I have asked for him from the LORD.”"},{"ref":"사무엘상 2:1","en":"1 Samuel 2:1","krv":"한나가 기도하여 가로되 내 마음이 여호와를 인하여 즐거워하며 내 뿔이 여호와를 인하여 높아졌으며 내 입이 내 원수들을 향하여 크게 열렸으니 이는 내가 주의 구원을 인하여 기뻐함이니이다","bsb":"My heart rejoices in the LORD; my horn is exalted in the LORD."}],"src":[{"name":"Bible 2.0","title":"Tageslosung 2026 원본 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"Korean Revised Version (KorRV)","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"}],"sha":"f18e63e720e48239af0a3790e188b90dacb6e6850ba1ea9f9a5d1656d0580e2b"},{"date":"2026-09-27","title":"때를 따라 아름답게, 처음과 마지막의 주님","subtitle":"전도서 3:11 · 이사야 41:4","tagline":"우리는 전체를 알지 못해도, 처음과 마지막을 붙드신 하나님을 신뢰할 수 있다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 전도서 3:11\n전도자는 하나님이 모든 것을 때를 따라 아름답게 하셨다고 말한다. 그런데 바로 이어, 사람에게 영원을 사모하는 마음을 주셨지만 하나님이 처음부터 끝까지 하시는 일을 다 헤아릴 수 없다고 한다. 아름다움은 모든 조각을 손에 쥔 사람이 느끼는 안심이 아니라, 내가 다 알 수 없는 시간 속에도 하나님의 일이 놓여 있다는 고백으로 시작한다.\n\n### 둘째 말씀 — 이사야 41:4\n이사야는 세대들을 처음부터 부르신 분이 누구냐고 묻는다. 대답은 “나 여호와라”이다. 처음에도 계셨고 마지막 세대와 함께 계실 분이라는 선언이다. 역사는 사람들의 손에서 우연히 굴러가는 목록이 아니라, 하나님이 부르시고 행하시는 시간이다.\n\n### 두 말씀이 만나는 지점\n전도서의 우리는 끝을 모르고, 이사야의 하나님은 처음과 마지막을 아신다. 그래서 하나님의 때를 믿는 일은 현재의 빈칸을 억지로 설명하는 일이 아니다. 내 눈앞의 장면을 넘어 그분의 주권을 신뢰하는 일이다.\n\n### 오늘 붙잡을 한 줄\n다 알지 못하는 시간에도, 처음과 마지막의 주님은 나와 함께 계신다.\n\n## 오늘의 적용\n오늘 마음이 조급해지는 일 하나를 적고, 그것의 결말을 내가 쥐어야 한다는 말을 내려놓아 보자. 대신 “주님, 이 시간도 주님의 때 안에 있습니다”라고 한 번 기도하자.\n\n## 짧은 기도\n처음과 마지막이신 주님, 보이는 한 장면만으로 주님의 일을 판단하지 않게 하소서. 제게 맡겨진 오늘을 성실히 살며, 제가 다 알지 못하는 시간도 주님의 손에 있음을 신뢰하게 하소서. 아멘.","v":[{"ref":"전도서 3:11","en":"Ecclesiastes 3:11","krv":"하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨고 또 사람에게 영원을 사모하는 마음을 주셨느니라 그러나 하나님의 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다","bsb":"He has made everything beautiful in its time. He has also set eternity in the hearts of men, yet they cannot fathom the work that God has done from beginning to end."},{"ref":"이사야 41:4","en":"Isaiah 41:4","krv":"이 일을 누가 행하였느냐 누가 이루었느냐 누가 태초부터 만대를 명정하였느냐 나 여호와라 태초에도 나요 나중 있을 자에게도 내가 곧 그니라","bsb":"Who has performed this and carried it out, calling forth the generations from the beginning? I, the LORD—the first and the last— I am He."}],"src":[{"name":"Bible 2.0","title":"Tageslosung 2026 원본 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"Korean Revised Version (KorRV)","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"}],"sha":"1adfb7cff0f1a9407de51017d47cb8947cac66a4e22ad133c5e10590879a6018"},{"date":"2026-09-28","title":"갈망하는 영혼, 이름 부르시는 하나님","subtitle":"시편 63:1 · 이사야 43:1","tagline":"메마른 자리에서 하나님을 찾는 우리에게, 주님은 먼저 “너는 내 것”이라 말씀하신다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 63:1\n시인은 물 없는 마른 땅에서 하나님을 찾습니다. 여기서 갈망은 막연히 마음이 허전하다는 말이 아닙니다. 목마른 몸처럼 하나님 없이는 살 수 없다는 고백입니다. 형편이 먼저 채워져야 하나님을 찾는 것이 아니라, 메마른 자리에서야 내가 무엇을 가장 필요로 하는지 드러납니다.\n\n### 둘째 말씀 — 이사야 43:1\n이사야의 말씀은 창조하신 분, 지으신 분, 구속하신 분이 같은 하나님이심을 차례로 들려줍니다. 그리고 주님은 “너는 내 것이라”고 말씀하십니다. 이름을 불러 아신다는 것은 멀리서 분류하는 일이 아니라, 구원하시는 관계 안으로 부르시는 일입니다.\n\n### 두 말씀이 만나는 지점\n시편의 사람은 하나님을 갈망하고, 이사야의 하나님은 먼저 자기 백성을 이름으로 부르십니다. 우리가 주님을 붙드는 손보다 앞서, 주님이 우리를 자기 것으로 삼으신 은혜가 있습니다. 갈망은 버려진 사람이 내는 외침이 아니라, 이미 부르심을 받은 사람이 돌아가는 길입니다.\n\n### 오늘 붙잡을 한 줄\n내 영혼이 주를 찾을 때에도, 주님은 이미 나를 이름으로 부르시고 붙드신다.\n\n## 오늘의 적용\n오늘 가장 메마르게 느껴지는 자리 하나를 하나님 앞에 그대로 말해 보자. 해결의 순서를 재촉하기보다, “주님, 저는 주께 속한 사람입니다”라고 고백하며 짧게 머물러 보자.\n\n## 짧은 기도\n나의 하나님이신 주님, 제 갈망을 다른 것으로 급히 덮지 않게 하소서. 저를 지으시고 구속하시며 이름으로 부르신 은혜를 기억하게 하시고, 메마른 자리에서도 주께로 돌아가게 하소서. 아멘.","v":[{"ref":"시편 63:1","en":"Psalm 63:1","krv":"하나님이여 주는 나의 하나님이시라 내가 간절히 주를 찾되 물이 없어 마르고 곤핍한 땅에서 내 영혼이 주를 갈망하며 내 육체가 주를 앙모하나이다","bsb":"O God, You are my God. Earnestly I seek You; my soul thirsts for You."},{"ref":"이사야 43:1","en":"Isaiah 43:1","krv":"야곱아 너를 창조하신 여호와께서 이제 말씀하시느니라 이스라엘아 너를 조성하신 자가 이제 말씀하시느니라 너는 두려워 말라 내가 너를 구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라","bsb":"This is what the LORD says— He who created you, O Jacob, and He who formed you, O Israel: “Do not fear, for I have redeemed you; I have called you by your name; you are Mine!”"}],"src":[{"name":"Bible 2.0","title":"Tageslosung 2026 원본 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"Korean Revised Version (KorRV)","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"}],"sha":"1ceac460e09929098afc2aadced5e5b8daf6305a9beefb4337c9179ac48e3098"},{"date":"2026-09-29","title":"부르심의 소망을 알아보는 눈","subtitle":"에베소서 1:18 · 요한계시록 1:6","tagline":"하나님께 속하게 하신 은혜를 알아보는 눈을 구하자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 에베소서 1:18\n바울은 에베소 교인들의 믿음과 사랑을 듣고 감사한 뒤, 하나님께 그들이 주님을 더 깊이 알게 해 달라고 기도해. 이미 믿는 사람들에게 “마음 눈”이 밝아지기를 구한다는 점이 눈에 띄지. 여기서 소망은 막연히 일이 잘 풀리리라는 기대가 아니라, 하나님이 부르신 사람들에게 주신 약속을 알아보는 눈과 연결돼 있어. 바로 뒤에는 그들을 향한 하나님의 능력을, 그리스도를 죽은 자 가운데서 일으키신 능력에 비추어 말해.\n\n### 둘째 말씀 — 요한계시록 1:6\n요한은 일곱 교회에 인사를 건네며, 예수 그리스도를 “우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하신” 분으로 찬양해. 그 다음에 나오는 것이 “나라와 제사장”이라는 말씀이야. 그것은 스스로 높은 지위를 얻었다는 선언이 아니야. 그리스도의 사랑과 구속에 먼저 기대어, 하나님께 속하고 그분을 섬기는 백성으로 부름받았다는 고백이지. 그래서 문장은 자신의 공로가 아니라 그리스도께 영광을 돌리며 끝나.\n\n### 두 말씀이 만나는 지점\n에베소서는 부르심의 소망과 기업을 알게 해 달라고 기도하고, 요한계시록은 그리스도가 우리를 하나님께 속한 백성으로 삼으셨다고 찬양해. 하나는 눈이 열리기를 구하는 기도이고 다른 하나는 이미 받은 은혜를 고백하는 찬양이야. 두 말씀을 함께 읽으면, 내 자리를 내 성취만으로 판단하기 전에 그리스도가 무엇을 하셨는지 다시 바라보게 돼.\n\n### 오늘 붙잡을 한 줄\n하나님께 속하게 하신 은혜를 알아보는 눈을 구하자.\n\n## 오늘의 적용\n오늘 마음을 무겁게 하는 일 하나를 떠올리고, 그것을 해결하겠다는 다짐에 앞서 에베소서의 기도를 짧게 드려 보자. “주님, 제 마음 눈을 밝히셔서 주께서 주신 소망을 알게 해 주세요.” 그 기도가 당장 상황을 바꾸겠다는 약속은 아니지만, 상황 속에서 무엇을 바라볼지 다시 묻게 해.\n\n## 짧은 기도\n하나님, 그리스도 안에서 저를 부르시고 주께 속한 백성으로 삼아 주셔서 감사합니다. 제 마음 눈을 밝혀 주신 소망을 알아보게 하시고, 오늘의 일 가운데서도 주님을 섬기게 하소서. 아멘.","v":[{"ref":"에베소서 1:18","en":"Ephesians 1:18","krv":"너희 마음 눈을 밝히사 그의 부르심의 소망이 무엇이며 성도 안에서 그 기업의 영광의 풍성이 무엇이며","bsb":"I ask that the eyes of your heart may be enlightened, so that you may know the hope of His calling, the riches of His glorious inheritance in the saints,"},{"ref":"요한계시록 1:6","en":"Revelation 1:6","krv":"그 아버지 하나님을 위하여 우리를 나라와 제사장으로 삼으신 그에게 영광과 능력이 세세토록 있기를 원하노라 아멘","bsb":"who has made us to be a kingdom, priests to His God and Father—to Him be the glory and power forever and ever! Amen."}],"src":[{"name":"Bible 2.0","title":"Tageslosung 2026 원본 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"Korean Revised Version (KorRV)","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Crossway ESV","title":"Ephesians 1:15–23","url":"https://www.esv.org/verses/Ephesians%2B1%3A15%E2%80%9323/"},{"name":"Crossway ESV","title":"Revelation 1:4–8","url":"https://www.esv.org/verses/Revelation%2B1%3A4%E2%80%938/"}],"sha":"e46c5f3fe38d2debf91113f32cb8dfe5334ed88bdb0a477ada4ec182974cacd4"},{"date":"2026-09-30","title":"잊지 않으시는 하나님 앞에서","subtitle":"아모스 8:7 · 시편 41:4","tagline":"잊지 않으시는 하나님 앞에서 숨기지 않고 긍휼을 구합니다.","body":"## 로중 묵상\n### 첫째 말씀 — 아모스 8:7\n아모스는 부정한 저울과 가난한 사람을 짓밟는 거래를 고발합니다. 그 뒤에 “내가 저희의 모든 소위를 영영 잊지 아니하리라”는 말씀이 놓입니다. 여기서 잊지 않으심은 따뜻한 추억의 표현이 아니라, 힘없는 이들에게 저지른 일을 하나님이 그냥 지나치지 않으신다는 심판의 선언입니다.\n\n### 둘째 말씀 — 시편 41:4\n시편의 화자는 병과 적대 속에서 하나님께 긍휼을 구하며 자신의 죄를 인정합니다. “내 영혼을 고치소서”라는 기도는 잘못이 없다고 변호하는 말이 아닙니다. 구원이 필요한 사람으로 하나님 앞에 서는 말입니다. 이 시편의 모든 고난이 죄 하나의 직접적인 벌이라는 뜻으로까지 넓힐 필요는 없습니다.\n\n### 두 말씀이 만나는 지점\n하나님은 부당한 일을 잊지 않으시고, 죄를 인정하며 긍휼을 구하는 사람의 기도도 듣습니다. 아모스의 경고를 지우지 않은 채 시편의 간구를 읽으면, 은혜를 구한다는 것은 책임을 피해 가는 길이 아니라 진실하게 하나님 앞으로 나오는 길임을 보게 됩니다.\n\n### 오늘 붙잡을 한 줄\n잊지 않으시는 하나님 앞에서 숨기지 않고 긍휼을 구합니다.\n\n## 오늘의 적용\n오늘 내 말과 선택이 누군가에게 불리하게 작용한 일은 없는지 한 가지 돌아보고, 있다면 변명보다 바로잡을 일을 먼저 정해 봅니다.\n\n## 짧은 기도\n하나님, 제가 저지른 일을 가볍게 여기지 않게 하시고, 숨김없이 주의 긍휼을 구하며 바로잡을 용기를 주소서. 아멘.","v":[{"ref":"아모스 8:7","en":"Amos 8:7","krv":"여호와께서 야곱의 영광을 가리켜 맹세하시되 내가 저희의 모든 소위를 영영 잊지 아니하리라 하셨나니","bsb":"The LORD has sworn by the Pride of Jacob: “I will never forget any of their deeds.”"},{"ref":"시편 41:4","en":"Psalm 41:4","krv":"내가 말하기를 여호와여 나를 긍휼히 여기소서 내가 주께 범죄하였사오니 내 영혼을 고치소서 하였나이다","bsb":"I said, “O LORD, be gracious to me; heal me, for I have sinned against You.”"}],"src":[{"name":"Bible 2.0","title":"Tageslosung 2026 원본 자료","url":"https://bible2.net/en/package/online-retrieval-of-twd-1-1-files"},{"name":"CrossWire","title":"Korean Revised Version (KorRV)","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Crossway ESV","title":"Amos 8","url":"https://www.esv.org/verses/Amos%2B8/"},{"name":"Crossway ESV","title":"Psalm 41","url":"https://www.esv.org/verses/Psalm%2B41/"}],"sha":"4f5ad5de83a97bce4ff98bfcc40efa80db8551f2b0f5a2f9920dbb6c233328e3"},{"date":"2026-10-01","title":"곁에 서서 믿음을 붙드는 사랑","subtitle":"사무엘상 23:16 · 요한복음 13:35","tagline":"사랑은 모든 문제를 해결하지 못하는 자리에서도, 서로가 하나님을 의지하도록 곁에 설 수 있다.","body":"## 로중 묵상\n### 첫째 말씀 — 사무엘상 23:16\n다윗이 숨어 있는 곳으로 요나단이 찾아와. 오늘 말씀은 그 만남이 다윗으로 하여금 하나님을 힘있게 의지하게 했다고 말하지. 함께 읽어 볼 지점은 요나단이 위험을 없애 주지 못하면서도 친구의 믿음을 붙들어 주었다는 거야.\n\n다윗은 그일라를 구했지만 그곳에 계속 머물 수 없었고, 사울은 광야까지 그를 뒤쫓고 있어. 이런 흐름 속에서 사울의 아들이 찾아왔다는 사실이 무겁게 다가와. 요나단은 다윗이 왕이 될 것을 인정하며 두 사람은 하나님 앞에서 언약을 맺어. 왕의 아들이 자기 자리를 앞세우기보다 쫓기는 친구 곁에 서는 장면이야.\n\n방문 뒤에도 다윗은 수풀에 남고 요나단은 돌아가. 상황이 곧바로 풀렸다는 이야기는 없어. 본문이 강조하는 도움은 안전을 보장하는 요나단의 능력이 아니라, 다윗이 다시 하나님을 의지하도록 붙드는 말과 관계에 있어.\n\n### 둘째 말씀 — 요한복음 13:35\n예수님은 제자들의 발을 씻으신 저녁에 서로 사랑하라고 말씀하셔. 유다가 밖으로 나간 뒤이며, 곧이어 베드로의 부인도 예고돼. 평온하고 믿음직한 사람들만 모인 자리에서 나온 명령이 아니라는 점을 기억하며 읽어 보자.\n\n바로 앞 절에는 “내가 너희를 사랑한 것 같이”라는 기준이 있어. 제자들의 사랑은 스스로 훌륭함을 증명하려는 경쟁이 아니라 먼저 받은 사랑에 응답하는 삶이지. 발을 씻어 주신 낮아짐과 다가오는 십자가가 그 사랑을 이해할 자리를 마련해 줘.\n\n오늘 성구는 그 사랑이 사람들 앞에 드러나는 제자의 표지가 된다고 말해. 말로만 공동체를 설명하는 대신 서로를 실제로 대하는 모습이 보이게 되는 거야. 여기서 직접 명령한 것은 제자들 사이의 사랑이므로, 모든 사람에게 사랑을 베풀라는 더 넓은 성경의 가르침과 구별해서 읽을 필요도 있어.\n\n### 두 말씀이 만나는 지점\n요나단의 방문은 한 사람이 다른 사람의 믿음을 어떻게 붙들 수 있는지 보여 줘. 예수님의 말씀은 사랑이 제자 공동체의 눈에 보이는 모습이 되어야 한다고 가르치지. 두 본문은 각자의 역사와 자리를 지니지만, 사랑이 상대를 혼자 견디게 두지 않는 구체적인 관계로 나타난다는 지점에서 만날 수 있어.\n\n누군가의 두려움을 단번에 해결할 수 없을 때도 할 수 있는 일은 남아 있어. 찾아가고, 이야기를 듣고, 상대가 의지할 하나님을 함께 기억하는 일이지. 이것은 요나단의 왕위에 관한 말을 누구에게나 성공을 약속하는 말로 바꾸는 것과는 달라. 위로에도 본문이 허락하는 만큼의 정직함이 필요해.\n\n### 오늘 붙잡을 한 줄\n사랑은 모든 문제를 해결하지 못하는 자리에서도, 서로가 하나님을 의지하도록 곁에 설 수 있다.\n\n## 오늘의 적용\n오늘 연락할 한 사람을 떠올려 보자. 곧 괜찮아질 것이라고 서둘러 말하기 전에 무엇이 가장 힘든지 듣고, 내가 실제로 함께할 수 있는 작은 일을 물어보면 좋겠어. 내게도 버거운 일이 있다면 혼자 견디는 것으로 믿음을 증명하려 하지 말고, 함께 기도하고 이야기할 사람에게 도움을 청해 보자.\n\n## 짧은 기도\n주님, 먼저 우리를 사랑하시고 낮아져 섬겨 주신 은혜를 기억하게 하소서. 다른 사람의 어려움을 가볍게 단정하지 않고, 정직한 말과 작은 행동으로 곁에 서게 하소서. 도움을 받을 때에도 마음을 열어 함께 주님을 의지하게 하소서. 아멘.","v":[{"ref":"사무엘상 23:16","en":"1 Samuel 23:16","krv":"사울의 아들 요나단이 일어나 수풀에 들어가서 다윗에게 이르러 그로 하나님을 힘있게 의지하게 하였는데","bsb":"Saul’s son Jonathan came to David in Horesh and strengthened his hand in God."},{"ref":"요한복음 13:35","en":"John 13:35","krv":"너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라","bsb":"By this everyone will know that you are My disciples, if you love one another."}],"src":[{"name":"Bible Gateway / Crossway","title":"사무엘상 23장 — 요나단의 방문과 언약","url":"https://www.biblegateway.com/passage/?search=1+Samuel+23&version=ESV"},{"name":"Bible Gateway / Crossway","title":"요한복음 13장 — 발 씻김과 새 계명","url":"https://www.biblegateway.com/passage/?search=John+13&version=ESV"}],"sha":"7b824406adf6984486390d7e88aa624bd69dccadc46407e5c9189fecbb770bdc"},{"date":"2026-10-02","title":"흐름을 거절하고 진실을 지키는 일","subtitle":"베드로전서 4:4 · 출애굽기 23:7","tagline":"사람들의 흐름을 거절할 때에도, 다른 사람의 진실을 지켜 주는 정직함을 놓지 말자.","body":"## 로중 묵상\n### 첫째 말씀 — 베드로전서 4:4\n전에는 함께하던 일에 더는 따라가지 않을 때, 주변 사람들은 그 변화를 낯설게 여길 수 있어. 베드로는 신자들이 방탕한 생활에 동참하지 않는다는 이유로 비방을 받는 상황을 말해. 하나님을 따르는 삶이 곧바로 사람들의 호감을 얻는 길은 아니라는 거지.\n\n앞에서는 그리스도의 고난을 기억하며 남은 시간을 하나님의 뜻을 따라 살라고 권해. 비방을 받아도 이전 생활로 돌아가지 말라는 권면은 여기서 나와. 이어지는 말씀은 비방하는 사람들도 하나님 앞에 책임을 질 것이라고 말하지. 독자가 직접 보복하거나 남의 최종 운명을 판정하라는 허락은 아니야.\n\n같은 장은 사랑과 대접, 받은 은사로 서로 섬기는 일도 권해. 다른 흐름을 거절하는 삶에는 사람을 깎아내리는 태도보다 선을 행하는 모습이 함께 있어야 해. 누군가 나를 불편해한다고 해서 내 말과 행동이 모두 옳았다는 증거가 되는 것도 아니지.\n\n### 둘째 말씀 — 출애굽기 23:7\n이 말씀은 재판과 증언을 다루는 자리에서 나와. 거짓 보고를 퍼뜨리지 말고, 다수의 편을 들어 정의를 굽히지 말라는 명령이 앞에 있어. 이어서는 가난한 사람의 권리를 침해하지 말고 뇌물을 받지 말라고 해. 오늘의 짧은 영문 문장도 이 문맥 안에서 읽어야 해.\n\n거짓 일을 멀리하라는 말씀은 내 마음만 깨끗하게 지키는 데서 끝나지 않아. 거짓 고발이 무죄한 사람의 생명을 해칠 수 있다는 경고가 바로 뒤에 붙어 있지. 확인되지 않은 말을 보태거나 힘센 편에 맞춰 증언을 바꾸는 일에는 실제 피해자가 생겨.\n\n하나님은 악인을 의롭다고 하지 않겠다고 말씀하셔. 사람의 판결이 잘못될 수 있어도 하나님이 거짓을 정당하게 여기시는 것은 아니야. 이 말씀 앞에서는 내가 부당한 대우를 받았는지만 아니라, 다른 사람을 부당하게 판단하는 데 참여하지 않았는지도 돌아봐야 해.\n\n### 두 말씀이 만나는 지점\n첫째 말씀에는 비방을 받는 사람이 있고, 둘째 말씀에는 거짓 고발로 해를 입을 수 있는 사람이 있어. 두 본문의 자리는 다르지만, 사람들의 흐름에 따라가는 일이 언제나 옳지는 않다는 점을 함께 보여 줘. 동참하지 않을 용기와 남을 거짓으로 몰아가지 않을 정직함이 만나는 거야.\n\n그리스도를 따르기 때문에 조롱받을 수 있다는 말씀을 내 편을 무조건 옳게 만드는 도구로 쓰지 말자. 하나님께 판단을 맡기는 사람은 자기 말도 그분 앞에 놓아야 하니까. 따라가지 않는 선택에도, 누군가에 관해 말하는 순간에도 진실과 선을 함께 붙드는 것이 오늘의 적용이 될 수 있어.\n\n### 오늘 붙잡을 한 줄\n사람들의 흐름을 거절할 때에도, 다른 사람의 진실을 지켜 주는 정직함을 놓지 말자.\n\n## 오늘의 적용\n오늘 내가 보태려는 말 하나를 살펴보자. 직접 확인한 사실인지, 들은 이야기인지, 내 해석인지 구분해 보면 좋겠어. 해로운 흐름에는 짧고 분명하게 동참하지 않되 사람을 모욕하는 말로 거절하지는 말자. 이미 잘못 전한 이야기가 있다면 같은 자리에서 바로잡는 작은 행동부터 시작해 보자.\n\n## 짧은 기도\n주님, 그리스도를 따르는 삶을 사람의 인정과 바꾸지 않게 하소서. 비방을 받을 때 보복하려는 마음을 붙들어 주시고, 저 또한 거짓으로 누군가를 해치지 않게 하소서. 제 말과 판단을 주님 앞에서 살피며 정직하게 선을 행하게 하소서. 아멘.","v":[{"ref":"베드로전서 4:4","en":"1 Peter 4:4","krv":"이러므로 너희가 저희와 함께 그런 극한 방탕에 달음질하지 아니하는 것을 저희가 이상히 여겨 비방하나","bsb":"They consider it strange of you not to plunge with them into the same flood of reckless indiscretion, and they heap abuse on you."},{"ref":"출애굽기 23:7","en":"Exodus 23:7","krv":"거짓 일을 멀리하며 무죄한 자와 의로운 자를 죽이지 말라 나는 악인을 의롭다 하지 아니하겠노라","bsb":"Stay far away from a false accusation."}],"src":[{"name":"Bible Gateway / Crossway","title":"베드로전서 4장","url":"https://www.biblegateway.com/passage/?search=1+Peter+4&version=ESV"},{"name":"Bible Gateway / Crossway","title":"출애굽기 23장","url":"https://www.biblegateway.com/passage/?search=Exodus+23&version=ESV"}],"sha":"6d89eba46205aa42499be537bb13e745c3f9a845616ad92df049b752c384b70d"},{"date":"2026-10-03","title":"문이 열리기 전에 드리는 노래","subtitle":"시편 104:33 · 사도행전 16:25","tagline":"빛나는 풍경에서도 끝나지 않은 밤에서도, 하나님께 드릴 말과 노래를 찾자.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 104:33\n찬양은 무엇을 보고 시작될까? 시편 104편의 시인은 하늘과 땅을 찬찬히 바라봐. 샘물이 골짜기를 흐르고, 짐승들이 물을 마시고, 새들이 가지 사이에서 노래하지. 오늘의 “나의 평생에”라는 다짐은 그 풍경을 지나서 나와. 생명을 붙들어 주시는 하나님을 보았기에, 자기 삶도 노래로 응답하겠다는 거야.\n\n이 시는 자연이 스스로 넉넉하게 돌아간다고 말하지 않아. 생물들은 먹이를 기다리고, 하나님이 숨을 거두시면 죽으며, 그분이 영을 보내시면 땅이 새로워져. 시인 자신도 그 의존에서 벗어나 있지 않지. “나의 생존한 동안”이라는 말에는 내가 살아 있는 지금이 선물이라는 깨달음이 담겨 있어.\n\n마지막에는 죄인과 악인이 사라지기를 바라는 기도도 나와. 아름다운 풍경만 보고 세상의 악을 잊어버리는 노래가 아닌 셈이지. 창조의 기쁨과 세상의 어그러짐을 함께 바라보면서, 시인은 자기 영혼에게 하나님을 송축하라고 다시 말해.\n\n### 둘째 말씀 — 사도행전 16:25\n바울과 실라는 밝은 낮의 풍경 속에 있지 않아. 빌립보에서 매를 맞고 깊은 감옥에 갇혀, 발까지 차꼬에 묶인 상태야. 그들이 기도하며 찬송한 때는 지진으로 감옥 문이 열리기 전이었어. 자유로워진 뒤 드리는 감사가 아니라, 아직 묶여 있을 때 하나님께 드리는 노래였지.\n\n본문은 두 사람이 통증을 느끼지 않았다거나 두려움이 전혀 없었다고 말하지 않아. 찬송을 고통을 지우는 주문처럼 읽을 필요는 없겠어. 갇힌 자리에서도 하나님께 말을 걸고, 그분을 향해 노래했다는 사실을 먼저 붙들자. 다른 죄수들이 듣고 있었다는 짧은 문장은 그 기도가 감옥 안에 실제로 울렸다는 것을 보여 줘.\n\n곧 지진이 나고 문이 열리지만, 바울은 도망치지 않아. 죄수들이 달아났다고 생각해 목숨을 끊으려는 간수에게 모두 여기 있다고 외치지. 이어지는 이야기는 간수와 그의 집이 말씀을 듣고, 간수가 두 사람의 상처를 씻기는 자리로 옮겨 가. 찬송 이후의 모습은 사람을 버려두지 않는 행동으로 이어져.\n\n### 두 말씀이 만나는 지점\n한 본문은 생명으로 가득한 세계를 바라보고, 다른 본문은 자유를 빼앗긴 밤을 보여 줘. 두 자리를 같은 기분으로 묶을 수는 없어. 그래도 두 본문 모두 하나님께 응답하는 노래가 나온다는 점에서 만나. 찬양의 근거가 눈앞의 형편 하나에만 달려 있지는 않은 거야.\n\n감옥의 찬송을 모든 고통받는 사람에게 당장 밝게 노래하라는 요구로 바꾸지는 말자. 사도행전은 바울과 실라의 행동을 전하고 있어. 오늘 우리가 이 장면에서 배울 수 있는 것은, 해결되기 전에도 하나님께 기도할 수 있다는 가능성이겠지. 시편처럼 받은 생명을 기억하고, 사도들처럼 아직 끝나지 않은 밤을 그분께 맡기는 길이 열려 있어.\n\n### 오늘 붙잡을 한 줄\n빛나는 풍경에서도 끝나지 않은 밤에서도, 하나님께 드릴 말과 노래를 찾자.\n\n## 오늘의 적용\n오늘 받은 작은 선물 하나를 구체적으로 떠올려 보자. 그 일에 감사하는 말과 아직 해결되지 않은 일을 두고 드리는 기도를 나란히 놓아 보면 좋겠어. 노래가 자연스럽게 나오지 않는다면 짧은 찬송 한 절을 천천히 읽어도 괜찮아. 마음을 억지로 밝히기보다 지금의 마음을 하나님 앞에 가져가자.\n\n## 짧은 기도\n생명을 주시는 하나님, 제가 누리는 하루를 당연하게 여기지 않게 하소서. 아직 끝나지 않은 어려움 속에서도 주님께 기도하게 하시고, 곁에 있는 사람의 고통을 외면하지 않게 하소서. 제 감사와 탄식을 받아 주시고, 오늘의 삶으로 주님께 응답하게 하소서. 아멘.","v":[{"ref":"시편 104:33","en":"Psalm 104:33","krv":"나의 평생에 여호와께 노래하며 나의 생존한 동안 내 하나님을 찬양하리로다","bsb":"I will sing to the LORD all my life; I will sing praise to my God while I have my being."},{"ref":"사도행전 16:25","en":"Acts 16:25","krv":"밤중쯤 되어 바울과 실라가 기도하고 하나님을 찬미하매 죄수들이 듣더라","bsb":"About midnight Paul and Silas were praying and singing hymns to God, and the other prisoners were listening to them."}],"src":[{"name":"Crossway · ESV.org","title":"시편 104편의 직접 문맥","url":"https://www.esv.org/Psalm+104/"},{"name":"Crossway · ESV.org","title":"사도행전 16장의 직접 문맥","url":"https://www.esv.org/Acts+16/"}],"sha":"5aa6ef7eb99bdce1d873bd872d7512e8bab9fd8db02c67fdd6585f8594a49f8a"},{"date":"2026-10-04","title":"울음 가운데서 생명을 믿다","subtitle":"시편 30:5 · 요한복음 3:36","tagline":"울음이 남아 있는 자리에서도, 생명을 주시는 아들에게 나를 맡기자.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 30:5\n이 시편에서 아침의 기쁨은 아직 울지 않은 사람의 낙관이 아니야. 화자는 죽음 가까이 내려갔다가 하나님께 건짐받은 일을 노래하고 있어. 앞에서는 하나님이 자신을 살리셨다고 고백하고, 뒤에서는 평안할 때 흔들리지 않을 줄 알았던 자신의 생각을 돌아보지. 오늘의 한 절은 그 굽이 사이에 놓여 있어.\n\n하나님의 진노와 은총, 저녁의 울음과 아침의 기쁨은 같은 길이로 나란히 서 있지 않아. 화자는 자신을 회복시키신 은총이 삶 전체를 붙드는 쪽에 무게를 두고 있어. 그렇다고 모든 슬픔이 하룻밤 만에 끝난다는 시간표로 읽을 수는 없어. 실제로 울었던 사람이, 그 울음이 하나님과의 관계를 끝내는 마지막 말은 아니었다고 증언하는 거야.\n\n### 둘째 말씀 — 요한복음 3:36\n요한복음 3장의 끝은 위로부터 오신 아들과 그분의 증언을 받아들이는 문제를 다뤄. 아버지가 아들을 사랑하시고 모든 것을 그 손에 주셨다는 말 뒤에, 아들을 믿는 사람에게 영생이 있다는 선언이 이어져. 여기서 생명은 먼 훗날에만 받는 보상이 아니라, 아들을 믿는 사람이 이미 가진 것으로 표현돼.\n\n이어지는 “아들을 순종치 아니하는 자”는 앞의 믿음과 맞서는 말이야. 믿음은 예수님에 관한 정보를 인정하는 데 머물지 않고, 그분의 증언을 받아들이며 자신을 맡기는 일이기 때문이지. 이 구절은 작은 실수 하나 때문에 곧바로 영생을 잃는다고 말하지 않아. 아들을 거부한 채 생명을 기대할 수 없다는 엄중한 경계야.\n\n### 두 말씀이 만나는 지점\n두 말씀에는 모두 진노와 생명의 문제가 있어. 시편은 은총으로 다시 살아난 사람의 노래이고, 요한복음은 생명이 아들을 믿는 데 있음을 밝히는 선언이야. 시편의 아침을 요한복음의 영생과 똑같은 사건으로 만들 필요는 없어. 함께 읽으면 은총은 막연히 시간이 지나면 괜찮아진다는 기대보다 분명한 방향을 갖게 돼. 우리를 살리시는 하나님께 돌아가고, 그분이 보내신 아들을 믿는 방향이지.\n\n### 오늘 붙잡을 한 줄\n울음이 남아 있는 자리에서도, 생명을 주시는 아들에게 나를 맡기자.\n\n## 오늘의 적용\n지금 해결되지 않은 일 하나를 하나님께 구체적으로 말해 보자. 곧 나아질 것이라고 스스로를 설득하기보다, 그 일을 안고 예수님의 어떤 말씀을 신뢰하며 오늘 한 걸음을 내디딜지 생각해 봐. 기다리는 동안의 믿음도 실제 선택에서 자리를 얻을 수 있어.\n\n## 짧은 기도\n하나님, 울음 가운데서도 주의 은총을 잊지 않게 하소서. 아들을 믿는 믿음이 말에만 머물지 않게 하시고, 해결을 기다리는 오늘도 주님의 말씀에 나를 맡기게 하소서. 아멘.","v":[{"ref":"시편 30:5","en":"Psalm 30:5","krv":"그 노염은 잠간이요 그 은총은 평생이로다 저녁에는 울음이 기숙할지라도 아침에는 기쁨이 오리로다","bsb":"His anger is fleeting, but His favor lasts a lifetime. Weeping may stay the night, but joy comes in the morning."},{"ref":"요한복음 3:36","en":"John 3:36","krv":"아들을 믿는 자는 영생이 있고 아들을 순종치 아니하는 자는 영생을 보지 못하고 도리어 하나님의 진노가 그 위에 머물러 있느니라","bsb":"Whoever believes in the Son has eternal life. Whoever rejects the Son will not see life. Instead, the wrath of God remains on him."}],"src":[{"name":"Bible Gateway / ESV","title":"시편 30편 문맥","url":"https://www.biblegateway.com/passage/?search=Psalm+30&version=ESV"},{"name":"Bible Gateway / ESV","title":"요한복음 3:31–36","url":"https://www.biblegateway.com/passage/?search=John+3%3A31-36&version=ESV"}],"sha":"75a03eb89dde4eedc43f534da070b930a5f02575404a976409af365f03805f2b"},{"date":"2026-10-05","title":"상한 것을 꺾지 않고, 무너진 것을 다시 세우다","subtitle":"이사야 42:3 · 에스겔 36:36","tagline":"상한 것을 꺾지 않으시는 하나님께, 아직 무너져 있는 자리도 숨기지 말고 맡기자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 이사야 42:3\n상한 갈대와 꺼져 가는 등불부터 눈에 들어와. 조금만 더 힘을 주면 부러지고, 작은 바람에도 꺼질 것 같은 것들이지. 그런데 이 말씀의 주어는 갈대가 아니라 하나님께서 붙드시는 종이야. 42장 첫머리에서 그 종은 하나님의 영을 받아 열방에 공의를 세우는 일을 맡아.\n\n그가 연약한 것을 꺾지 않는다는 말은 바로 뒤의 공의와 함께 읽어야 해. 악을 못 본 척하거나 모든 것을 그대로 두는 친절이 아니야. 무너진 것을 더 짓밟지 않으면서도 바른 질서를 세우는 방식이지. 다음 절에서 종 자신은 쇠하거나 낙담하지 않고 그 일을 이어 간다고 해. 상한 것을 대하는 온유함과 공의를 이루는 끈기가 한 사람 안에 함께 있어.\n\n### 둘째 말씀 — 에스겔 36:36\n에스겔의 시선은 한 줄기 갈대에서 무너진 성읍과 황무한 땅으로 넓어져. 이스라엘의 회복을 약속하는 문맥에서 하나님은 폐허를 다시 세우고 땅에 심겠다고 말씀하셔. 주변 민족이 그 일을 보고 여호와가 누구신지 알게 되리라는 약속이야.\n\n앞부분에는 죄에서 정결하게 하고 새 마음과 새 영을 주신다는 말씀이 놓여 있어. 그러니 여기서 회복은 건물이 다시 올라가고 형편이 좋아지는 일만 가리키지 않아. 하나님께서 백성을 새롭게 하시는 일과 삶의 터전을 회복하시는 일이 연결돼 있어. 이스라엘이 충분히 잘해서 얻는 보상도 아니야. 하나님께서 자신의 거룩한 이름을 드러내시는 은혜가 먼저야.\n\n### 두 말씀이 만나는 지점\n두 본문은 대상과 장면이 달라. 이사야는 공의를 세우는 종의 방식을 보여 주고, 에스겔은 하나님이 백성과 땅을 회복하실 약속을 전해. 그 차이를 남겨 두고 읽으면, 연약하고 무너진 것을 끝으로 취급하지 않으시는 하나님이 보이네.\n\n그렇다고 우리가 원하는 모든 일이 곧 복구된다는 시간표를 얻은 것은 아니야. 오늘 붙들 수 있는 것은 하나님이 어떤 분이신가 하는 믿음이야. 상한 것을 더 꺾지 않는 온유함, 죄를 씻고 새롭게 하시는 거룩함, 말씀하신 일을 이루시는 신실함을 함께 기억하자.\n\n### 오늘 붙잡을 한 줄\n상한 것을 꺾지 않으시는 하나님께, 아직 무너져 있는 자리도 숨기지 말고 맡기자.\n\n## 오늘의 적용\n오늘 내가 연약하다는 이유로 쉽게 포기해 버린 한 가지를 떠올려 보자. 고칠 잘못은 인정하되, 나나 다른 사람을 쓸모없다고 결론내리지는 말자. 누군가의 실수를 바로잡아야 한다면 사람 전체를 꺾는 말 대신 구체적인 행동을 짚고, 다시 시작할 한 걸음을 함께 찾자. 이것은 회복의 약속을 내가 성취하는 방법이라기보다, 오늘 본 하나님의 성품에 응답하는 작은 실천이야.\n\n## 짧은 기도\n하나님, 상한 것을 꺾지 않으시는 주님의 온유함을 믿게 하소서. 저의 죄를 씻고 마음을 새롭게 하시며, 아직 무너진 자리도 주님께 맡기게 하소서. 공의를 말할 때 사람을 짓밟지 않게 하시고, 오늘 할 수 있는 회복의 한 걸음을 걷게 하소서. 아멘.","v":[{"ref":"이사야 42:3","en":"Isaiah 42:3","krv":"상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고 진리로 공의를 베풀 것이며","bsb":"A bruised reed He will not break and a smoldering wick He will not extinguish; He will faithfully bring forth justice."},{"ref":"에스겔 36:36","en":"Ezekiel 36:36","krv":"너희 사면에 남은 이방 사람이 나 여호와가 무너진 곳을 건축하며 황무한 자리에 심은 줄 알리라 나 여호와가 말하였으니 이루리라","bsb":"Then the nations around you that remain will know that I, the LORD, have rebuilt what was destroyed, and I have replanted what was desolate."}],"src":[{"name":"Daily Divine","title":"2026년 10월 5일 로중 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-05.md"},{"name":"Crossway ESV","title":"Isaiah 42","url":"https://www.esv.org/Isaiah+42/"},{"name":"Crossway ESV","title":"Ezekiel 36","url":"https://www.esv.org/Ezekiel+36/"}],"sha":"88b80ad84de0a509bef40ec6db3a34cff9946cfaced0422177e8cef2fce61a09"},{"date":"2026-10-06","title":"도움의 기억을 소망의 자리로","subtitle":"사무엘상 7:12 · 시편 146:5","tagline":"여기까지 도우신 하나님을 기억하며 오늘의 도움과 소망도 그분께 둡니다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 사무엘상 7:12\n\n> 사무엘이 돌을 취하여 미스바와 센 사이에 세워 가로되 여호와께서 여기까지 우리를 도우셨다 하고 그이름을 에벤에셀이라 하니라\n\n‘여기까지’라는 말이 어디에서 나왔는지 함께 보자. 이스라엘은 미스바에서 하나님께 돌아오며 죄를 고백했고, 블레셋의 공격을 앞두고 사무엘에게 기도를 부탁했어. 하나님께서 그들을 도우신 뒤 사무엘은 돌을 세워 그 도움을 기억하게 했지. 에벤에셀은 자기 힘으로 버텨 냈다는 표지가 아니라, 하나님께 도움을 받은 사람들이 세운 기억의 자리야. 이 말씀이 앞으로 모든 일이 쉽게 풀릴 것이라고 약속하는 것은 아니야. 지금 서 있는 자리까지 이르게 하신 분을 잊지 않게 해 주는 말이지.\n\n### 둘째 말씀 — 시편 146:5\n\n> 야곱의 하나님으로 자기 도움을 삼으며 여호와 자기 하나님에게 그 소망을 두는 자는 복이 있도다\n\n시편은 먼저 사람과 권력자를 궁극적으로 의지하지 말라고 해. 사람은 죽고 그의 계획도 끝나기 때문이야. 이어서 도움과 소망의 근거를 야곱의 하나님께 두는 사람을 복되다고 부르지. 그 하나님은 하늘과 땅을 지으시고 신실하심을 지키시며, 억눌린 사람과 주린 사람을 돌보시는 분으로 묘사돼. 소망은 상황을 낙관하는 기분만이 아니라, 어떤 분에게 기대고 있는지를 드러내는 말이야.\n\n### 두 말씀이 만나는 지점\n\n첫 말씀은 받은 도움을 기억하게 하고, 둘째 말씀은 앞으로도 누구에게 소망을 둘지 묻게 해. 기억과 소망의 중심에는 같은 하나님이 계셔. 어제의 도움을 내 능력으로 바꾸어 기억하지 않는 것, 내일의 불확실함 때문에 다른 힘을 절대적인 보장으로 삼지 않는 것이 두 말씀을 함께 붙드는 길이겠지. 감사는 지나간 일을 정리하는 데서 끝나지 않고 오늘의 의지처를 바로잡아 줘.\n\n### 오늘 붙잡을 한 줄\n\n여기까지 도우신 하나님을 기억하며, 오늘의 도움과 소망도 그분께 두자.\n\n## 오늘의 적용\n\n오늘 할 일 하나를 앞에 놓고, 그 일을 준비하는 동안 받은 도움 한 가지를 구체적으로 적어 보자. 누군가의 수고나 조언이 있었다면 그 사람에게 감사도 전하자. 그리고 결과를 내가 완전히 통제해야 한다는 마음을 내려놓으며 하나님께 필요한 도움을 구해 보자. 준비와 책임을 다하는 일과 하나님을 의지하는 일은 함께 갈 수 있어.\n\n## 짧은 기도\n\n하나님, 여기까지 베푸신 도움을 잊지 않게 하소서. 받은 은혜를 제 능력으로 돌리지 않고 감사하게 하시며, 오늘의 도움과 소망을 주님께 두게 하소서. 맡겨진 일에 성실하고 도움이 필요한 이웃의 곁에 서게 하소서. 아멘.","v":[{"ref":"사무엘상 7:12","en":"1 Samuel 7:12","krv":"사무엘이 돌을 취하여 미스바와 센 사이에 세워 가로되 여호와께서 여기까지 우리를 도우셨다 하고 그이름을 에벤에셀이라 하니라","bsb":"Thus far the LORD has helped us."},{"ref":"시편 146:5","en":"Psalm 146:5","krv":"야곱의 하나님으로 자기 도움을 삼으며 여호와 자기 하나님에게 그 소망을 두는 자는 복이 있도다","bsb":"Blessed is he whose help is the God of Jacob, whose hope is in the LORD his God,"}],"src":[{"name":"BibleGateway","title":"사무엘상 7장","url":"https://www.biblegateway.com/passage/?search=1+Samuel+7&version=ESV"},{"name":"BibleGateway","title":"시편 146편","url":"https://search.biblegateway.com/passage/?search=Psalm+146&version=ESV%3BNKJV%3BKJV%3BNIV"}],"sha":"66ca6be758f2a27b02353454883fa86208cacbde187fa5e20415a03ac908bf88"},{"date":"2026-10-07","title":"주신 것을 누리되, 소망은 하나님께","subtitle":"시편 16:6 · 디모데전서 6:17","tagline":"주신 것을 감사히 누리되, 나를 붙드는 소망은 주시는 하나님께 두자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 16:6\n“내게 줄로 재어 준 구역은 아름다운 곳에 있음이여 나의 기업이 실로 아름답도다.”\n\n이 문장만 읽으면 좋은 땅을 얻은 사람의 만족처럼 들려. 바로 앞절로 눈을 옮겨 보면, 시인이 자기 몫이라고 부르는 것은 여호와야. ‘기업’은 물려받아 살아갈 몫을 뜻하고, 줄로 구역을 재는 장면은 그 몫을 나누어 받는 모습을 떠올리게 하지. 땅의 넓이보다 하나님과 맺은 관계가 이 고백의 중심에 있어.\n\n시편은 하나님께 자신을 지켜 달라는 기도로 시작해. 그러니 아름다운 기업이라는 말은 위험을 모르는 사람의 낙관이 아니야. 다른 신을 따르지 않고 하나님을 자기 앞에 모시겠다는 선택 속에서 나오는 기쁨이지. 내 사정이 모두 마음에 든다는 말과, 하나님이 나의 몫이시라는 고백은 구별해서 읽어야 해.\n\n### 둘째 말씀 — 디모데전서 6:17\n“네가 이 세대에 부한 자들을 명하여 마음을 높이지 말고 정함이 없는 재물에 소망을 두지 말고 오직 우리에게 모든 것을 후히 주사 누리게 하시는 하나님께 두며.”\n\n바울은 부유한 사람들에게 재산을 이유로 자신을 높이지 말고, 불확실한 재물에 소망을 걸지 말라고 해. 그런데 이 경고 안에는 하나님이 주신 것을 누린다는 말도 들어 있어. 감사하며 누리는 기쁨과 재물에 삶을 맡기는 태도는 같은 것이 아니야.\n\n이어지는 두 절에서는 선한 일을 하고 기꺼이 나누라고 권해. 하나님께 소망을 둔다는 고백은 손에 쥔 것을 어떻게 쓰는지로 이어지는 셈이지. 주신 것을 즐기면서도 그것을 내 가치나 안전의 최종 근거로 만들지 않고, 다른 사람에게 열어 놓는 삶이야.\n\n### 두 말씀이 만나는 지점\n시편은 하나님을 자기 몫으로 고백하고, 디모데전서는 재물 대신 하나님께 소망을 두라고 권해. 두 말씀을 함께 읽으면 받은 것의 좋음을 알아보는 마음과, 그것을 붙들어 주시는 분을 신뢰하는 마음이 만나.\n\n만족은 부족한 것을 못 본 척하는 연습만은 아니야. 필요한 것을 구하면서도 내 삶의 마지막 버팀목을 소유의 양으로 정하지 않는 것이지. 하나님을 나의 몫으로 부르는 고백은 감사할 자유와 나눌 자유를 함께 열어 줘.\n\n### 오늘 붙잡을 한 줄\n주신 것을 감사히 누리되, 나를 붙드는 소망은 주시는 하나님께 두자.\n\n## 오늘의 적용\n오늘 누린 것 하나를 구체적으로 감사해 보자. 이어 내가 그것을 잃을까 두려워 다른 사람에게 닫아 둔 마음이 있는지 살펴봐. 돈이든 시간이든 오늘 나눌 수 있는 작은 몫 하나를 정해 보자. 불안을 전부 없앤 뒤에만 나눌 수 있는 것은 아니니까.\n\n## 짧은 기도\n하나님, 주신 것을 감사히 누리게 하소서. 가진 것으로 제 가치를 세우거나 내일을 붙들려 하지 않게 하시고, 주님께 소망을 두게 하소서. 제게 맡기신 것을 이웃과 기꺼이 나누도록 마음을 열어 주소서. 아멘.","v":[{"ref":"시편 16:6","en":"Psalm 16:6","krv":"내게 줄로 재어 준 구역은 아름다운 곳에 있음이여 나의 기업이 실로 아름답도다","bsb":"The lines of my boundary have fallen in pleasant places; surely my inheritance is delightful."},{"ref":"디모데전서 6:17","en":"1 Timothy 6:17","krv":"네가 이 세대에 부한 자들을 명하여 마음을 높이지 말고 정함이 없는 재물에 소망을 두지 말고 오직 우리에게 모든 것을 후히 주사 누리게 하시는 하나님께 두며","bsb":"Instruct those who are rich in the present age not to be conceited and not to put their hope in the uncertainty of wealth, but in God, who richly provides all things for us to enjoy."}],"src":[{"name":"Crossway / ESV","title":"시편 16편 — 기업과 피난처의 문맥","url":"https://www.esv.org/Ps16.5/"},{"name":"Crossway / ESV","title":"디모데전서 6:17–19 — 누림과 나눔","url":"https://www.esv.org/verses/1%2BTimothy%2B6:17%E2%80%9319/"}],"sha":"ddadc6685281b557801437876ce53ab0c60ba3a4e6588b2ccba21ac31f7de3b7"},{"date":"2026-10-08","title":"사랑을 묻는 자리에서","subtitle":"말라기 1:2 · 요한복음 3:16","tagline":"하나님의 사랑을 묻는 자리에서, 하나님이 주신 아들을 먼저 바라보자.","body":"## 로중 묵상\n### 첫째 말씀 — 말라기 1:2\n“내가 너희를 사랑하였노라”라는 선언 뒤에 곧바로 질문이 붙어 있어. “주께서 어떻게 우리를 사랑하셨나이까.” 같은 문장 안에서 하나님의 사랑과 그것을 알아보지 못하는 백성의 말이 마주하는 거야. 이어지는 야곱과 에서의 대조는 개인의 성격을 비교하는 설명이 아니라, 이스라엘과 에돔의 역사 속에서 하나님의 선택과 심판을 돌아보게 해. 사랑을 모든 일이 잘 풀린다는 약속으로 바꾸면 이 본문의 날카로운 질문이 사라져. 하나님은 백성에게 자신이 맺고 지켜 온 관계를 다시 보라고 하셔.\n\n### 둘째 말씀 — 요한복음 3:16\n요한복음에서는 그 사랑이 아들을 주시는 행동으로 나타나. 바로 앞에는 광야에서 들린 뱀처럼 인자도 들려야 한다는 말이 있어. 아들을 주셨다는 선언은 십자가를 향하는 흐름 속에 놓여 있는 거지. 이어지는 구절들은 구원과 심판, 빛과 어둠을 함께 말해. 세상을 사랑하셨다는 말은 악을 아무렇지 않게 보신다는 뜻이 아니야. 멸망 가운데 있는 사람에게 생명을 주시려는 사랑이고, 본문은 그 아들을 믿는 응답으로 우리를 초대해.\n\n### 두 말씀이 만나는 지점\n두 본문은 사랑을 지금의 기분이나 형편만으로 재지 않게 해. 말라기는 하나님이 지켜 오신 언약의 역사를, 요한복음은 하나님이 주신 아들을 바라보게 하지. 에돔을 향한 심판과 세상을 향한 구원의 초대를 같은 이야기로 평평하게 만들 필요는 없어. 서로 다른 자리에서 들려오는 두 말씀은 하나님의 사랑을 우리가 만들어 낸 기준보다 먼저 놓아 보게 해. 사랑을 느끼지 못하는 질문도 숨길 필요가 없지만, 그 질문의 답을 내 상황 안에서만 찾지는 않는 거야.\n\n### 오늘 붙잡을 한 줄\n하나님의 사랑을 묻는 자리에서, 하나님이 주신 아들을 먼저 바라보자.\n\n## 오늘의 적용\n오늘 마음에 남는 질문 하나를 하나님께 솔직히 말해 보자. 서둘러 감사의 말로 덮지 않아도 돼. 그다음 요한복음 3:16을 천천히 읽으며, 내가 원하는 일이 이루어졌는지와 하나님이 아들을 주셨다는 사실을 구별해 보자. 믿음은 질문이 사라진 뒤에만 시작되는 것이 아니야. 답을 다 알지 못하는 자리에서도 그분이 주신 생명을 의지할 수 있어.\n\n## 짧은 기도\n하나님, 사랑을 제 형편으로만 판단할 때가 많습니다. 숨겨 둔 질문을 주님께 말씀드리며, 우리를 위해 주신 아들을 바라보게 해 주십시오. 주님의 사랑을 믿고 빛 가운데 한 걸음 걷게 해 주십시오. 아멘.","v":[{"ref":"말라기 1:2","en":"Malachi 1:2","krv":"여호와께서 가라사대 내가 너희를 사랑하였노라 하나 너희는 이르기를 주께서 어떻게 우리를 사랑하셨나이까 하는도다 나 여호와가 말하노라 에서는 야곱의 형이 아니냐 그러나 내가 야곱을 사랑하였고","bsb":"“I have loved you,” says the LORD."},{"ref":"요한복음 3:16","en":"John 3:16","krv":"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라","bsb":"God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life."}],"src":[{"name":"Daily Divine","title":"2026년 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/"},{"name":"Bible Gateway / Crossway","title":"말라기 1장 · 요한복음 3장","url":"https://www.biblegateway.com/passage/?search=Malachi+1%3BJohn+3&version=ESV"}],"sha":"f619789fbeeb8eab2673ae6f4acf1835e5172a3083a2675a00909df413e6e1e0"},{"date":"2026-10-09","title":"경외함이 너의 보배","subtitle":"신명기 6:13 · 이사야 33:6","tagline":"넉넉할 때에도 흔들릴 때에도, 하나님을 가장 크게 여기는 마음을 지키자.","body":"## 로중 묵상\n### 첫째 말씀 — 신명기 6:13\n하나님을 경외한다는 말은 무엇을 가장 크게 여기는지 돌아보게 해. 신명기 6장에서 모세는 곧 좋은 땅에 들어갈 백성에게 이 말을 들려줘. 직접 짓지 않은 집과 심지 않은 포도원을 누리고 배불리 먹을 때, 자신들을 종살이에서 이끌어 내신 하나님을 잊지 말라는 당부가 먼저 나와.\n\n그래서 경외와 섬김은 막연히 겁을 먹으라는 주문이 아니야. 받은 것을 자기 힘만으로 얻었다고 여기지 않고, 삶의 중심을 하나님께 두라는 부름이지. 그 이름으로 맹세하라는 말도 하나님의 이름을 가볍게 동원하라는 뜻으로 읽을 수 없어. 누구를 최종적인 증인과 주님으로 인정할지를 묻는 말이야. 바로 뒤의 다른 신들을 따르지 말라는 경고가 그 무게를 분명히 해.\n\n### 둘째 말씀 — 이사야 33:6\n이사야 33장은 파괴하는 자를 향한 경고와 도움을 구하는 기도로 시작해. 백성은 아침마다 힘이 되어 주시고 환난 때 구원해 달라고 하나님께 부르짖어. 오늘의 평안과 풍성함은 어려움이 처음부터 없었던 사람의 느긋한 말이 아니야. 흔들리는 자리에서 하나님이 시온을 정의와 공의로 채우신다는 소망과 함께 들려와.\n\n그 흐름에서 여호와를 경외하는 것이 보배라고 하지. 위기를 견딜 지혜와 구원을 말하면서, 그 선물을 주시는 하나님과의 관계를 가운데 놓는 거야. 경외를 잘하면 모든 불안이 즉시 사라진다는 거래로 바꿀 수는 없어. 본문은 우리가 쌓아 둔 자원보다 하나님이 그 시대를 붙드시는 분이라는 사실을 의지하게 해.\n\n### 두 말씀이 만나는 지점\n신명기는 넉넉해질 때의 망각을, 이사야는 위기 속에서 붙들 소망을 보여 줘. 형편은 서로 다르지만 하나님을 삶의 중심에 둔다는 방향에서 만나는 거지. 경외는 좋은 날에는 받은 은혜를 기억하게 하고, 흔들리는 날에는 도움을 구할 분을 바라보게 해. 자신을 작게 만들며 벌을 기다리는 태도보다, 하나님의 크심을 인정하고 그분의 말씀을 무겁게 받는 태도로 읽어 보자.\n\n### 오늘 붙잡을 한 줄\n넉넉할 때에도 흔들릴 때에도, 하나님을 가장 크게 여기는 마음을 지키자.\n\n## 오늘의 적용\n오늘 내 마음을 가장 크게 차지하는 것 하나를 적어 보자. 얻은 것을 잃을까 두려운지, 내가 해낸 일을 과도하게 붙드는지 차분히 살펴봐도 좋아. 그다음 당연하게 여겼던 선물 하나를 감사로 돌려드리고, 혼자 붙들고 있던 염려 하나를 도움을 구하는 기도로 바꾸어 보자. 이 작은 응답은 형편을 통제하는 방법이 아니라 하나님을 주님으로 인정하는 연습이야.\n\n## 짧은 기도\n하나님, 받은 것을 잊지 않고 주님을 경외하게 해 주십시오. 넉넉할 때 교만하지 않게 하시고, 흔들릴 때 주님께 도움을 구하게 하소서. 우리의 지혜와 구원이 되시는 주님을 가장 귀하게 여기게 해 주십시오. 아멘.","v":[{"ref":"신명기 6:13","en":"Deuteronomy 6:13","krv":"네 하나님 여호와를 경외하며 섬기며 그 이름으로 맹세할 것이니라","bsb":"Fear the LORD your God, serve Him only, and take your oaths in His name."},{"ref":"이사야 33:6","en":"Isaiah 33:6","krv":"너의 시대에 평안함이 있으며 구원과 지혜와 지식이 풍성할 것이니 여호와를 경외함이 너의 보배니라","bsb":"The fear of the LORD is Zion’s treasure."}],"src":[{"name":"ESV.org","title":"Deuteronomy 6","url":"https://www.esv.org/Deuteronomy+6/"},{"name":"ESV.org","title":"Isaiah 33","url":"https://www.esv.org/Isaiah+33/"}],"sha":"f77e2becf727779decccd23be2341da9bccbba89a82c2dac032ecad0c4082b6f"},{"date":"2026-10-10","title":"헤아릴 수 없는 지혜, 가까이 오는 손길","subtitle":"시편 147:5 · 로마서 16:27","tagline":"다 헤아리지 못해도, 상한 마음을 고치시고 복음으로 세우시는 하나님께 영광을 돌릴 수 있다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 147:5\n하나님의 지혜가 무궁하다는 말 앞에는 흩어진 사람들을 모으고 마음이 상한 이들을 고치신다는 노래가 있어. 이어 시인은 하늘의 별을 세시고 각각 이름을 부르시는 하나님을 바라보지. 사람의 상처와 셀 수 없는 별들이 같은 찬양 안에 놓여 있는 거야. “우리 주는 광대하시며”라는 고백은 큰 힘을 추상적으로 칭송하는 데서 끝나지 않아. 그 힘이 무너진 사람을 일으키는 손길로 나타난다는 것이 이 시편의 흐름이야.\n\n바로 다음 절에서는 겸손한 이들을 붙드시고 악인을 낮추신다고 노래해. 하나님의 지혜를 믿는다는 것은 모든 일이 내가 바라는 대로 풀릴 거라고 장담하는 일이 아니야. 내 눈에 보이는 힘과 성공이 세상의 마지막 기준은 아니라는 고백이지. 시편은 말의 힘이나 사람의 다리보다, 하나님을 경외하며 그 인자하심을 기다리는 이들을 주께서 기뻐하신다고 이어 말해.\n\n### 둘째 말씀 — 로마서 16:27\n로마서의 마지막 문장은 하나님께 영광을 돌리는 찬양이야. 그 앞에서 바울은 복음으로 성도들을 굳게 세우시는 하나님을 말해. 오래 감추어졌던 비밀이 이제 드러났고, 모든 민족이 믿음의 순종에 이르도록 알려졌다는 거지. 여기서 지혜는 몇몇 사람이 차지한 비밀 지식이 아니야. 예수 그리스도를 통해 드러나고 여러 민족에게 전해지는 구원의 일과 연결되어 있어.\n\n“예수 그리스도로 말미암아”라는 구절을 천천히 읽어보자. 바울은 하나님께 이르는 길을 인간의 이해력이나 성취에 맡기지 않아. 그리스도를 통해 하나님께 영광을 돌리지. 긴 논증과 수많은 인사를 마친 편지가 찬양으로 끝나는 것은, 복음의 주인이 바울 자신이 아니라는 사실도 보여줘.\n\n### 두 말씀이 만나는 지점\n시편은 상처 입은 사람과 별들을 함께 바라보며 하나님의 지혜를 노래하고, 로마서는 여러 민족을 세우는 복음 앞에서 그 지혜를 찬양해. 두 본문을 내 앞날의 해답으로 곧장 바꿀 필요는 없어. 내가 다 헤아리지 못하는 가운데서도 하나님이 누구신지는 붙잡을 수 있어. 그분의 크심은 작은 사람을 잊는 크심이 아니고, 그분의 지혜는 그리스도 안에서 우리에게 가까이 온 지혜야.\n\n### 오늘 붙잡을 한 줄\n다 헤아리지 못해도, 상한 마음을 고치시고 복음으로 세우시는 하나님께 영광을 돌릴 수 있다.\n\n## 오늘의 적용\n해결되지 않은 일 하나를 떠올리고, 내가 아는 사실과 아직 모르는 것을 나누어 적어보자. 모르는 자리를 성급한 낙관이나 두려운 예측으로 채우기보다 하나님께 맡겨보는 거야. 그다음 오늘 할 수 있는 정직한 행동 하나를 정하자. 본문이 말하는 겸손한 기다림과 믿음의 순종을, 지금 손에 닿는 작은 일로 옮겨보면 좋겠어.\n\n## 짧은 기도\n지혜로우신 하나님, 제가 다 이해해야만 안심하려는 마음을 내려놓게 하소서. 상한 마음을 돌보시고 복음으로 저희를 세우시는 주님을 신뢰하게 하시며, 오늘 제게 맡겨진 일에 정직하게 응답하게 하소서. 예수 그리스도로 말미암아 주님께 영광을 돌립니다. 아멘.","v":[{"ref":"시편 147:5","en":"Psalm 147:5","krv":"우리 주는 광대하시며 능력이 많으시며 그 지혜가 무궁하시도다","bsb":"Great is our Lord, and mighty in power; His understanding has no limit."},{"ref":"로마서 16:27","en":"Romans 16:27","krv":"지혜로우신 하나님께 예수 그리스도로 말미암아 영광이 세세무궁토록 있을지어다 아멘","bsb":"to the only wise God be glory forever through Jesus Christ! Amen."}],"src":[{"name":"Bible Gateway","title":"시편 147 · 문맥","url":"https://classic.biblegateway.com/passage/?search=Psalm+147&version=ESV"},{"name":"Bible Gateway","title":"로마서 16 · 마지막 찬양","url":"https://www.biblegateway.com/passage/?search=Romans+16&version=ESV%3BNET%3BNIV"}],"sha":"fe9c30cd9826bf9d1a68288a5d5269bbe8f04cda3b2640af5a258571b43d460c"},{"date":"2026-10-11","title":"안고 오신 길, 흙임을 아시는 마음","subtitle":"신명기 1:31 · 시편 103:13","tagline":"우리가 흙임을 아시는 하나님은, 안고 오신 길도 잊지 않으신다.","body":"## 로중 묵상\n### 첫째 말씀 — 신명기 1:31\n아버지가 아이를 안고 길을 걷는 장면이 오늘 말씀에 나와. 그런데 이 말은 평온한 여행을 회상하는 자리에서 나온 것이 아니야. 모세는 약속의 땅 앞에서 두려워하며 물러섰던 백성의 일을 돌아보고 있어. 그들은 하나님이 자신들을 미워해서 이곳으로 데려오셨다고까지 말했지. 모세는 그 판단 앞에, 광야에서 하나님이 그들을 안고 여기까지 오셨다는 기억을 놓아.\n\n곧이어 나오는 말은 더 아파. 그렇게 돌보심을 받고도 백성은 하나님을 믿지 않았어. 그러니 ‘안으셨다’는 말씀을 앞으로의 길에는 위험도 책임도 없다는 약속으로 읽을 수는 없어. 본문은 두려움 때문에 하나님의 마음을 미움으로 바꾸어 읽는 우리에게, 이미 받은 돌봄을 다시 살피라고 해. 그 기억은 눈앞의 어려움을 지우지 않지만, 누구를 의지하며 걸을지 돌아보게 하지.\n\n### 둘째 말씀 — 시편 103:13\n시편은 아버지의 마음을 다른 방향에서 보여 줘. 하나님은 자기를 경외하는 사람을 불쌍히 여기셔. 여기서 불쌍히 여긴다는 말은 멀리서 안타까워하기만 한다는 뜻이 아니야. 앞에서는 죄를 그대로 갚지 않으시는 자비를 노래하고, 바로 뒤에서는 하나님이 우리의 지으심을 아시며 우리가 흙임을 기억하신다고 말해. 용서와 돌봄이 연약한 사람을 향하고 있어.\n\n하나님을 경외하는 일과 그분의 자비를 받는 일은 서로 반대가 아니야. 경외는 하나님 앞에서 강한 사람인 척하는 태도와도 달라. 시편은 우리의 짧은 생애를 풀과 꽃에 견주면서, 하나님의 인자하심은 오래 이어진다고 노래해. 우리를 잘 아시는 분 앞에 자신의 한계를 숨기지 않고 서 있을 수 있는 거야.\n\n### 두 말씀이 만나는 지점\n신명기는 안고 오신 하나님을 기억하게 하고, 시편은 우리가 어떤 존재인지 아시는 하나님의 마음을 들려줘. 두 말씀의 아버지 모습은 하나님을 내 소원을 들어주는 분으로 줄이지 않아. 오히려 돌봄을 받아 온 사람이 두려움과 연약함을 어떻게 그분께 가져갈지 묻게 해. 두려움을 솔직히 말하는 것과 하나님이 나를 미워하신다고 결론 내리는 것은 다른 일이야. 자비를 의지하면서도 그분의 말씀에 응답할 수 있어.\n\n### 오늘 붙잡을 한 줄\n우리가 흙임을 아시는 하나님은, 안고 오신 길도 잊지 않으신다.\n\n## 오늘의 적용\n마음에 걸리는 일 하나를 골라, 실제로 확인한 어려움과 그 어려움에서 내린 결론을 나누어 보자. ‘이 일이 어렵다’에서 ‘하나님이 나를 버리셨다’로 건너뛰고 있지는 않은지 살펴보는 거야. 그다음 지금까지 받은 도움 하나를 기억하고, 오늘 감당할 작은 응답을 정해 보자. 도움을 청하거나, 미뤄 둔 일을 시작하거나, 충분히 쉬는 일이 될 수도 있어.\n\n## 짧은 기도\n하나님, 두려움으로 주님의 마음을 잘못 읽지 않게 하소서. 저희가 흙임을 아시는 자비를 의지하며, 여기까지 안고 오신 돌봄을 기억하게 하소서. 연약함을 숨기지 않고 주님께 말씀드리며 오늘의 길에 응답하게 하소서. 아멘.","v":[{"ref":"신명기 1:31","en":"Deuteronomy 1:31","krv":"광야에서도 너희가 당하였거니와 사람이 자기 아들을 안음 같이 너희 하나님 여호와께서 너희의 행로 중에 너희를 안으사 이곳까지 이르게 하셨느니라 하나","bsb":"In the wilderness, where the LORD your God carried you, as a man carries his son."},{"ref":"시편 103:13","en":"Psalm 103:13","krv":"아비가 자식을 불쌍히 여김 같이 여호와께서 자기를 경외하는 자를 불쌍히 여기시나니","bsb":"As a father has compassion on his children, so the LORD has compassion on those who fear Him."}],"src":[{"name":"Daily Divine","title":"10월 11일 로중 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-11.md"},{"name":"Bible Gateway / Crossway","title":"신명기 1장 문맥","url":"https://www.biblegateway.com/passage/?search=Deuteronomy1&version=ESV"},{"name":"Bible Gateway / Crossway","title":"시편 103편 문맥","url":"https://www.biblegateway.com/passage/?search=Psalm%20103&version=ESV"}],"sha":"39f2e7ccbb32db20f53fd61be8ea1aa4712dc8bf0a8a80256c7bb27afdb967f2"},{"date":"2026-10-12","title":"구원하신 사랑이 다음 길에도","subtitle":"출애굽기 15:13 · 시편 73:24","tagline":"구원하신 사랑과 오늘의 가르침을 의지해, 아직 보이지 않는 길에 한 걸음 응답하자.","body":"## 로중 묵상\n### 첫째 말씀 — 출애굽기 15:13\n이스라엘은 바다를 건넌 뒤에 이 노래를 부른다. 뒤쫓던 군대로부터 구원받았지만, 앞으로 살 땅에 이른 것은 아직 아니야. 그런데 노래는 구원하신 하나님이 자기 백성을 거룩한 처소로 이끄시는 분이라고 고백한다. 건져 내신 사랑과 앞으로 인도하실 힘을 따로 떼어 놓지 않는 거지. 여기서 은혜는 잠깐 위험을 피하게 한 도움보다 깊다. 하나님이 구속하신 백성과 맺으신 관계가 다음 길에도 이어진다는 믿음이야.\n\n### 둘째 말씀 — 시편 73:24\n이 고백 바로 앞에는 마음이 무너질 뻔한 사람이 있어. 아삽은 악한 사람들의 형통을 보며 자신이 깨끗하게 산 일이 헛된 것은 아닌지 괴로워했다. 성소에서 그들의 끝을 깨닫고, 자신이 거칠고 무지했을 때에도 하나님이 오른손을 붙들고 계셨음을 고백하지. 그 흐름에서 “주의 교훈으로 나를 인도하시고”라는 말이 나온다. 모든 의문이 없어졌다는 뜻보다, 흔들리는 판단을 하나님의 가르침 아래 다시 놓겠다는 신뢰에 가까워. 영광으로 영접하실 소망도 지금의 형통만으로 삶을 재단하지 않게 한다.\n\n### 두 말씀이 만나는 지점\n한쪽은 구원받은 공동체의 노래이고, 다른 쪽은 비교와 혼란을 통과한 개인의 고백이야. 두 본문 모두 인도하시는 하나님을 바라본다. 바다를 건넜다고 길이 끝난 것도 아니고, 믿음이 흔들렸다고 붙드시는 손이 사라진 것도 아니다. 우리에게는 다음 장면이 잘 보이지 않아도, 받은 구원과 하나님의 가르침을 의지해 걸을 자리가 남아 있어.\n\n### 오늘 붙잡을 한 줄\n길 전체를 알아야만 걸을 수 있는 것은 아니다. 구원하신 사랑과 오늘의 가르침을 의지해 한 걸음 응답하자.\n\n## 오늘의 적용\n오늘 판단을 서두르게 하는 비교 하나를 적어 보자. 다른 사람의 결과를 기준으로 삼고 있지는 않은지, 내가 지킬 정직과 책임은 무엇인지 구분해 보는 거야. 앞날을 확정하려 하기보다 확인할 사실 하나를 확인하고, 맡은 일 하나를 성실하게 마치자. 이해되지 않는 마음도 감추지 말고 하나님께 말씀드리자.\n\n## 짧은 기도\n하나님, 구원하신 사랑이 오늘의 길에도 이어짐을 믿게 하소서. 다른 사람의 형통에 마음을 빼앗길 때 주님의 가르침으로 저희를 인도해 주십시오. 앞날을 다 알지 못해도 붙드시는 손을 의지하며, 오늘 맡은 일에 정직하게 응답하게 하소서. 아멘.","v":[{"ref":"출애굽기 15:13","en":"Exodus 15:13","krv":"주께서 그 구속하신 백성을 은혜로 인도하시되 주의 힘으로 그들을 주의 성결한 처소에 들어가게 하시나이다","bsb":"With loving devotion You will lead the people You have redeemed."},{"ref":"시편 73:24","en":"Psalm 73:24","krv":"주의 교훈으로 나를 인도하시고 후에는 영광으로 나를 영접하시리니","bsb":"You guide me with Your counsel, and later receive me in glory."}],"src":[{"name":"Daily Divine","title":"2026년 10월 12일 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-12.md"},{"name":"Crossway / ESV","title":"Exodus 15","url":"https://www.esv.org/Exodus+15/"},{"name":"Crossway / ESV","title":"Psalm 73","url":"https://www.esv.org/Psalm+73/"}],"sha":"fa25ce09bfa60d7a7f8535d99594f58556eca24a7ac5c233af8aaa80fb5ee306"},{"date":"2026-10-13","title":"돌아오는 마음이 걷는 길이 되도록","subtitle":"호세아 12:6 · 미가 6:8","tagline":"하나님을 바라보며, 오늘의 관계 안에서 공의와 인애를 함께 지키자.","body":"## 로중 묵상\n### 첫째 말씀 — 호세아 12:6\n호세아는 야곱이 하나님을 만나 간구했던 일을 떠올린 뒤, 지금의 백성에게 돌아오라고 말해. 조상의 이야기를 자랑하는 데서 멈추지 말고 그 하나님 앞에 다시 서라는 거지. 돌아옴의 모습도 구체적이야. 인애와 공의를 지키고, 하나님을 계속 바라보는 것. 바로 뒤에는 속이는 저울을 쓰는 장사꾼과 부를 믿는 태도가 등장해. 그러니 이 말씀의 기다림은 손을 놓는 일이 아니야. 하나님을 의지하면서 지금의 거래와 관계를 정직하게 바꾸는 응답이지.\n\n### 둘째 말씀 — 미가 6:8\n미가 6장에서는 하나님이 자기 백성을 어떻게 구원하고 이끄셨는지 먼저 기억하게 해. 그다음 사람은 무엇을 가지고 하나님 앞에 나아가야 할지 묻는다. 제물의 크기를 끝없이 늘리려는 질문에, 오늘의 말씀이 방향을 돌려 주지. 하나님은 이미 선한 것이 무엇인지 알려 주셨어. 공의를 행하고 인자를 사랑하며, 겸손히 하나님과 함께 걷는 것. 이것은 선행으로 구원을 사라는 공식이 아니야. 구원하신 하나님과 맺은 관계가 우리의 삶에서 어떤 모습이어야 하는지를 묻는 말씀이야.\n\n### 두 말씀이 만나는 지점\n두 본문에는 인애와 공의가 함께 있어. 친절하다는 이유로 부당함을 덮을 수 없고, 옳다는 이유로 사람을 함부로 대할 수도 없지. 호세아는 돌아와 하나님을 바라보라고 하고, 미가는 겸손히 하나님과 걸으라고 해. 신앙의 방향과 사람을 대하는 방식이 같은 길 위에 놓이는 거야. 우리가 하나님께 가까이 가는 일은 오늘 누군가에게 건네는 말, 지켜야 할 약속과도 연결돼 있어.\n\n### 오늘 붙잡을 한 줄\n하나님을 바라보며, 오늘의 관계 안에서 공의와 인애를 함께 지키자.\n\n## 오늘의 적용\n오늘 내가 옳다고 생각하는 일 하나를 떠올려 보자. 확인된 사실과 내 감정을 나누어 적고, 상대에게 요구하는 기준을 나에게도 적용해 보는 거야. 해야 할 말은 분명히 하되, 사람을 깎아내리는 표현은 덜어 내자. 결과를 다 붙들려 하지 말고, 오늘 지킬 정직 하나와 건넬 친절 하나를 선택하자.\n\n## 짧은 기도\n하나님, 주님께 돌아오는 마음이 오늘의 말과 행동으로 이어지게 하소서. 공의를 말하며 사랑을 잃지 않고, 친절을 내세워 진실을 피하지 않게 하소서. 저희의 한계를 인정하며 주님과 함께 걷고, 맡겨야 할 결과는 주님을 바라보며 기다리게 하소서. 아멘.","v":[{"ref":"호세아 12:6","en":"Hosea 12:6","krv":"그런즉 너의 하나님께로 돌아와서 인애와 공의를 지키며 항상 너의 하나님을 바라볼지니라","bsb":"You must return to your God; maintain love and justice, and always wait on your God."},{"ref":"미가 6:8","en":"Micah 6:8","krv":"사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 여호와께서 네게 구하시는 것이 오직 공의를 행하며 인자를 사랑하며 겸손히 네 하나님과 함께 행하는 것이 아니냐","bsb":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?"}],"src":[{"name":"Daily Divine","title":"2026년 연도 자료 · 10월 13일 로중","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-13.md"}],"sha":"9c97a18a4558b64f943c99aa9c32c871f09caebc5c362bb3764d155046887aec"},{"date":"2026-10-14","title":"흩어진 마음을 모아, 날마다 따르는 길","subtitle":"누가복음 9:23 · 시편 86:11","tagline":"예수님을 따라 오늘의 길을 걸으며, 흩어진 마음을 모아 주시기를 구하자.","body":"## 로중 묵상\n### 첫째 말씀 — 누가복음 9:23\n‘날마다 제 십자가를 지라’는 말 앞에서, 예수님이 먼저 어떤 길을 말씀하셨는지 읽어 보자. 베드로가 예수님을 하나님의 그리스도라고 고백한 뒤, 예수님은 자신이 버림받고 죽임을 당하며 다시 살아날 일을 알려 주셔. 제자에게 따르라고 하신 길은 바로 그 예수님의 길과 이어져 있어. 십자가는 당시 처형의 도구였으니, 단순히 불편한 일을 참고 견디라는 말보다 훨씬 무거운 부름이야.\n\n자기를 부인한다는 것은 자기 존재를 미워하거나, 누군가의 부당한 요구를 모두 받아들이라는 뜻으로 읽을 수 없어. 바로 다음 말씀은 ‘나를 위하여’ 생명을 잃는 사람을 말해. 중심은 고생 자체가 아니라 예수님께 대한 충성이야. 나를 지키는 일이 언제나 마지막 기준이 될 수는 없다는 거지. ‘날마다’라는 말은 그 방향이 한 번의 결심으로 끝나지 않고, 하루하루의 선택에서 다시 드러나야 함을 보여 줘.\n\n### 둘째 말씀 — 시편 86:11\n시편의 기도자는 환난 가운데 하나님께 도움을 구하고 있어. 그런데 위험에서 건져 달라는 기도 사이에, 주님의 길을 가르쳐 달라는 간구가 놓여 있지. 상황이 나아지는 것만 바라지 않고, 그 안에서 하나님의 진리를 따라 걷기를 원해. 가르침은 머릿속에 쌓아 둘 지식이 아니라 발걸음의 방향이 되는 거야.\n\n‘일심으로’라는 말도 의지력만 세게 붙들라는 명령으로 나오지 않아. ESV는 하나님께 마음을 하나로 모아 달라고 구하는 뜻을 드러내. 도움을 원하면서 다른 것을 더 의지하고, 진리를 알면서도 눈앞의 유익에 끌리는 마음을 하나님께 가져가는 기도이지. 이어지는 감사와, 자비롭고 은혜로우신 하나님에 대한 고백이 그 간구를 받쳐 주고 있어.\n\n### 두 말씀이 만나는 지점\n누가복음은 누구를 따라 걸을지 묻고, 시편은 그렇게 걸을 마음과 가르침을 하나님께 구해. 두 말씀을 함께 읽으면 순종의 무게와 기도의 자리가 나란히 보여. 따름을 가볍게 만들 수도 없고, 모든 힘을 스스로 마련한 뒤에야 출발한다고 생각할 필요도 없어. 예수님을 따르겠다는 응답 안에서, 나뉜 마음을 모아 주시기를 구할 수 있어.\n\n### 오늘 붙잡을 한 줄\n예수님을 따라 오늘의 길을 걸으며, 흩어진 마음을 모아 주시기를 구하자.\n\n## 오늘의 적용\n오늘 해야 할 선택 하나를 떠올려 보자. 내 편안함이나 인정받고 싶은 마음이 판단을 전부 차지하고 있지는 않은지 살펴보는 거야. 그 자리에서 예수님의 말씀을 따라 지킬 정직이나 사랑을 하나 정하자. 모든 불편을 십자가라고 부르기보다, 누구를 위해 무엇에 응답하는 선택인지 분명히 하고, 그 응답에 필요한 마음을 하나님께 구하자.\n\n## 짧은 기도\n하나님, 주님의 길을 가르쳐 주시고 흩어진 저희 마음을 모아 주소서. 저희를 미워하는 방식이 아니라 예수님을 사랑하여 따르게 하소서. 오늘의 선택에서 편안함과 인정만 좇지 않게 하시고, 주님의 진리 안에서 정직과 사랑에 응답하게 하소서. 아멘.","v":[{"ref":"누가복음 9:23","en":"Luke 9:23","krv":"또 무리에게 이르시되 아무든지 나를 따라 오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 좇을 것이니라","bsb":"If anyone wants to come after Me, he must deny himself and take up his cross daily and follow Me."},{"ref":"시편 86:11","en":"Psalm 86:11","krv":"여호와여 주의 도로 내게 가르치소서 내가 주의 진리에 행하오리니 일심으로 주의 이름을 경외하게 하소서","bsb":"Teach me Your way, O LORD, that I may walk in Your truth. Give me an undivided heart, that I may fear Your name."}],"src":[{"name":"Daily Divine","title":"2026년 10월 14일 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-14.md"},{"name":"Crossway / ESV.org","title":"누가복음 9:18–27 · 시편 86","url":"https://www.esv.org/Luke+9:18-27/"},{"name":"Crossway / ESV.org","title":"시편 86","url":"https://www.esv.org/Psalm+86/"}],"sha":"1445fd1c5f70388d7956d676d90c724a2369a048f3656ffa3a0012cb4f0d04ed"},{"date":"2026-10-15","title":"평안을 전하며, 깨어 믿음을 지키는 길","subtitle":"누가복음 10:3 · 베드로전서 5:8","tagline":"하나님께 염려를 맡기며, 평안을 전할 마음과 믿음을 지킬 분별을 함께 구하자.","body":"## 로중 묵상\n### 첫째 말씀 — 누가복음 10:3\n예수님이 제자들을 둘씩 보내시는 장면부터 읽어 보자. 이들은 주님이 가실 마을에 앞서 들어가, 병든 이들을 돌보고 하나님 나라가 가까이 왔음을 전하도록 보냄을 받아. 그 길을 예수님은 어린 양이 이리들 사이로 들어가는 모습에 비유하셔. 보냄을 받았다는 사실이 곧 안전한 환경을 보장하지는 않는 거야.\n\n그런데 뒤이어 주시는 첫 인사는 평안이야. 위험을 말씀하시면서도 제자들에게 상대를 위협하라고 하시지는 않아. 받아들이지 않는 마을에서 떠나는 지침도 있어. 이 말씀을 모든 부당한 대우를 무조건 견디라는 명령으로 옮길 수는 없지. 예수님의 사명을 따른다는 것이 적대적인 세상의 방식을 그대로 닮는 일과 같지는 않음을, 이 파송의 장면에서 생각해 볼 수 있어.\n\n### 둘째 말씀 — 베드로전서 5:8\n깨어 있으라는 권면 바로 앞에는 염려를 하나님께 맡기라는 말이 놓여 있어. 하나님이 돌보신다는 믿음과 위험을 살피는 태도가 함께 있는 거지. 베드로는 대적 마귀를 먹잇감을 찾아다니는 사자에 비유해. 이 경고를 주변 사람을 마귀로 지목하는 근거로 삼아서는 안 돼. 이어지는 권면은 믿음에 굳게 서서 대적하고, 다른 신자들도 고난을 겪고 있음을 기억하라는 것이야.\n\n편지는 경계하라는 말로 끝나지 않아. 고난 뒤에 하나님이 친히 회복시키고 굳게 세우신다는 약속이 뒤따라. 깨어 있음은 모든 결과를 혼자 통제하려는 불안과 다르지. 돌보시는 하나님께 염려를 가져가면서, 믿음을 흔드는 것을 분별하고 함께 견디는 태도라고 읽을 수 있어.\n\n### 두 말씀이 만나는 지점\n어린 양과 사자는 위험의 크기를 숨기지 않아. 누가복음은 평안을 전하는 파송의 길을, 베드로전서는 고난 속에서 믿음을 지키는 공동체의 자세를 보여 줘. 두 본문의 상황을 같게 만들 필요는 없지만, 하나님을 믿는 것과 현실의 위험을 살피는 것이 함께 갈 수 있다는 만남은 분명해. 온유함이 무분별함이 될 필요도, 경계가 적대감으로 굳어질 필요도 없는 거야.\n\n### 오늘 붙잡을 한 줄\n하나님께 염려를 맡기며, 평안을 전할 마음과 믿음을 지킬 분별을 함께 구하자.\n\n## 오늘의 적용\n오늘 마음을 흔드는 상황 하나를 구체적으로 적어 보자. 확인된 위험과 아직 일어나지 않은 상상을 구분하고, 맡겨야 할 염려를 기도로 가져가는 거야. 그 자리에서 지킬 정직한 말 한마디, 도움을 구할 사람 한 명, 필요한 경계 하나를 정해 보자. 상대를 적으로 단정하지 않으면서도 믿음과 선을 지키는 응답을 찾아가는 거지.\n\n## 짧은 기도\n하나님, 저희 염려를 받아 주시고 믿음에 굳게 서게 하소서. 두려움 때문에 사람을 적으로 단정하지 않게 하시며, 위험을 외면하지도 않게 하소서. 평안을 전할 온유함과 필요한 경계를 세울 분별을 주시고, 고난 가운데 서로를 기억하며 주님의 돌보심을 의지하게 하소서. 아멘.","v":[{"ref":"누가복음 10:3","en":"Luke 10:3","krv":"갈지어다 내가 너희를 보냄이 어린 양을 이리 가운데로 보냄과 같도다","bsb":"Go! I am sending you out like lambs among wolves."},{"ref":"베드로전서 5:8","en":"1 Peter 5:8","krv":"근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니","bsb":"Be sober-minded and alert. Your adversary the devil prowls around like a roaring lion, seeking someone to devour."}],"src":[{"name":"Daily Divine","title":"로중 연도 원본 · 2026-10-15","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-15.md"},{"name":"Crossway ESV","title":"Luke 10 — 파송의 문맥","url":"https://www.esv.org/Luke+10/"},{"name":"Crossway ESV","title":"1 Peter 5 — 염려와 깨어 있음","url":"https://www.esv.org/1+Peter+5/"}],"sha":"1cdb7c7797cc3a8f15c3ac47b23b0f610b88394663dc8a974b323b73778330ca"},{"date":"2026-10-16","title":"말씀하신 자리, 나를 보아 주신 하나님","subtitle":"창세기 35:15 · 창세기 16:13","tagline":"나를 아시고 말씀하시는 하나님을 기억하며, 그 말씀에 오늘의 응답을 드리자.","body":"## 로중 묵상\n### 첫째 말씀 — 창세기 35:15\n야곱은 하나님이 자기에게 말씀하신 곳을 ‘벧엘’, 곧 하나님의 집이라 불렀어. 오늘 두 말씀에는 만남 뒤에 이름을 부르는 사람이 등장해. 야곱은 장소를, 하갈은 자신에게 말씀하신 하나님을 부르지. 그 이름을 따라가면 하나님이 어떤 자리에서 사람을 만나셨는지 보이기 시작해.\n\n창세기 35장에서 야곱은 하나님의 명령을 따라 벧엘로 올라가. 집안의 이방 신상을 버리고 자신들을 정결하게 하는 준비가 먼저 나오고, 하나님은 야곱에게 새 이름 이스라엘과 후손·땅의 약속을 다시 확인해 주셔. 야곱이 돌기둥을 세우고 기름을 붓는 행동은 그 말씀에 대한 응답이야. 벧엘이라는 이름은 이미 28장에도 등장하므로, 이번에 처음 생긴 이름이라고 읽을 필요는 없어. 돌아온 자리에서 약속을 다시 듣고 그 만남을 기념하는 흐름으로 볼 수 있어.\n\n이 장 뒤에는 라헬의 죽음도 이어져. 하나님을 만난 장소를 기억한다고 이후의 길이 고통 없이 펼쳐지는 것은 아니야. 기억의 중심에는 순조로운 결과보다, 자신에게 말씀하셨던 하나님이 계셔.\n\n### 둘째 말씀 — 창세기 16:13\n하갈은 광야의 샘 곁에 있어. 바로 앞에서 사래가 하갈을 학대했고, 하갈은 그를 피해 도망했어. 그곳에서 여호와의 사자가 하갈을 찾아 이름을 부르고, 어디서 와서 어디로 가는지 물어. 또 하갈의 고통을 들으셨다는 뜻을 담아 태어날 아기의 이름을 이스마엘이라 알려 주지.\n\n하갈이 ‘감찰하시는 하나님’이라 부르는 말은 이 장면 안에서 읽어야 해. 여기서 하나님의 보심은 잘못을 찾아내는 감시에 머물지 않아. 집에서 밀려나 광야로 나온 한 사람의 처지를 알고 말씀하시는 보심이야. 하갈의 응답에는 자신이 여기서 하나님을 뵈었다는 놀라움도 담겨 있어.\n\n본문에 하갈에게 돌아가라는 명령이 나온다고 해서, 오늘 학대받는 모든 사람에게 위험한 자리로 돌아가라고 일반화해서는 안 돼. 그것은 이 이야기 속 하갈에게 주어진 말씀이야. 우리가 적용할 때도 학대의 현실을 지우거나, 도움을 구하고 보호받는 일을 믿음 부족으로 몰아서는 안 되겠지.\n\n### 두 말씀이 만나는 지점\n야곱의 돌기둥과 하갈의 샘은 서로 다른 삶의 자리에 놓여 있어. 한 사람은 약속을 다시 듣고, 다른 사람은 도망하던 길에서 고통을 들으시는 하나님을 만나. 두 사람 모두 자기 말로 그 만남에 응답한다는 점에서 이어져.\n\n하나님을 기억하는 일은 내 삶의 모든 일을 좋은 이야기로 정리하는 일이 아니야. 어떤 말씀을 들었고, 그 말씀 앞에서 무엇에 응답해야 하는지를 구체적으로 남기는 일에 가까워. 오늘은 장소를 거룩하게 만드는 우리의 능력보다, 그곳에서 먼저 말씀하시고 보아 주신 하나님께 시선을 두자.\n\n### 오늘 붙잡을 한 줄\n나를 아시고 말씀하시는 하나님을 기억하며, 그 말씀에 오늘의 응답을 드리자.\n\n## 오늘의 적용\n기억에 남는 성경 말씀 한 구절을 적고, 그 말씀이 원래 어떤 문맥에서 나왔는지 함께 읽어 보자. 그때 받았던 위로와 지금 해야 할 응답을 구분해 한 문장씩 남겨도 좋아. 주변 사람의 고통을 듣게 된다면 서둘러 의미를 붙이기보다, 그 사람이 안전하게 도움을 받을 길부터 함께 살펴보자.\n\n## 짧은 기도\n하나님, 저희에게 말씀하시고 외로운 자리도 보아 주심을 감사합니다. 주님의 약속을 형편의 순조로움과 혼동하지 않게 하소서. 고통받는 사람의 사정을 쉽게 판단하지 않게 하시고, 말씀을 기억하는 마음이 정직한 응답과 실제적인 돌봄으로 이어지게 하소서. 아멘.","v":[{"ref":"창세기 35:15","en":"Genesis 35:15","krv":"하나님이 자기와 말씀하시던 곳의 이름을 벧엘이라 불렀더라","bsb":"Jacob called the place where God had spoken with him Bethel."},{"ref":"창세기 16:13","en":"Genesis 16:13","krv":"하갈이 자기에게 이르신 여호와의 이름을 감찰하시는 하나님이라 하였으니 이는 내가 어떻게 여기서 나를 감찰하시는 하나님을 뵈었는고 함이라","bsb":"So Hagar gave this name to the LORD who had spoken to her: “You are the God who sees me.”"}],"src":[{"name":"Daily Divine","title":"2026년 로중 성구 원본","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-16.md"}],"sha":"1d674662301ca4da6ca25ce4591ecc48507c3dcd8b6f701bdebd50272128d442"},{"date":"2026-10-17","title":"받아 주시는 하나님, 돌아올 자리","subtitle":"시편 27:10 · 잠언 14:26","tagline":"나를 받아 주시는 하나님을 의지하며, 곁의 사람에게도 돌아올 자리를 내어 주자.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 27:10\n시편 27편의 시인은 부모마저 자신을 버리는 상황을 말하면서도, 여호와께서 자신을 받아 주신다는 신뢰를 놓지 않아. 오늘 두 말씀에는 ‘영접’과 ‘피난처’가 나와. 의지할 곳이 흔들릴 때 우리가 어디에 몸을 맡길 수 있는지 함께 읽어 보자.\n\n이 시는 처음부터 끝까지 한결같이 씩씩한 목소리로만 흐르지 않아. 앞부분에서는 하나님을 빛과 구원이라 고백하지만, 7절부터는 자신의 소리를 들어 달라고 간청해. 바로 앞 9절에도 얼굴을 숨기지 말고 버리지 말아 달라는 기도가 있어. 믿는다는 말과 버림받을까 두려워하는 마음이 같은 기도 안에 놓여 있는 거야.\n\n10절을 시인의 부모가 실제로 어떤 일을 했다는 전기적 기록으로 확정할 필요는 없어. 가장 가까운 관계마저 무너지는 극한의 상황을 떠올리는 표현으로 읽을 수 있어. 분명한 것은 그때에도 여호와께서 자신을 받아 주신다는 고백이야. 이어지는 기도도 원수 앞에서 길을 가르쳐 달라는 요청이지, 이제 아무 위험도 남지 않았다는 선언은 아니야.\n\n### 둘째 말씀 — 잠언 14:26\n잠언은 여호와를 경외하는 사람에게 견고한 의뢰가 있고, 그 자녀에게도 피난처가 있다고 말해. 경외는 하나님을 무서워하며 숨는 태도만을 뜻하지 않아. 하나님을 하나님으로 인정하고, 그분의 지혜 앞에서 자기 판단과 행동을 바로잡는 삶을 가리켜.\n\n이 구절 바로 뒤에서는 여호와 경외가 생명의 샘이며 죽음의 올무에서 벗어나게 한다고 이어져. 피난처라는 말은 신앙을 가정의 무사고 보증서로 만드는 약속이 아니야. 잠언의 지혜는 하나님을 존중하며 사는 길이 사람과 그 주변의 삶을 어떻게 세우는지 가르쳐. 믿는 부모의 자녀에게도 상처와 위험은 생길 수 있다는 현실을 지워서는 안 되겠지.\n\n그래서 이 말씀을 읽을 때는 내가 가족을 완벽히 보호할 수 있는가보다, 가족이 내 곁에서 어떤 자리를 경험하는지를 물을 수 있어. 잘못을 인정하는 정직함, 약한 사람을 함부로 대하지 않는 태도, 두려울 때 도움을 구할 수 있는 관계가 경외의 삶과 어울려. 이것은 본문을 오늘의 관계에 옮겨 보는 적용이지, 구절이 특정한 양육 방법을 직접 명령한다는 뜻은 아니야.\n\n### 두 말씀이 만나는 지점\n시편은 가장 가까운 보호가 사라져도 하나님께 받아들여질 수 있다는 신뢰를 들려줘. 잠언은 하나님을 경외하는 삶이 자녀에게까지 피난처가 되는 방향을 보여 줘. 하나는 보호받아야 할 사람의 자리에서, 다른 하나는 주변 사람의 삶에 영향을 주는 자리에서 읽을 수 있어.\n\n우리는 도움을 받아야 하는 사람이면서 누군가를 맞아들이는 사람이기도 해. 하나님을 의지한다는 고백이 다른 사람에게는 차가운 문턱으로 전달되고 있지 않은지 돌아보자. 하나님의 영접을 믿는 마음은, 곁의 사람이 약한 모습으로도 찾아올 수 있는 자리를 만드는 데로 이어질 수 있어.\n\n### 오늘 붙잡을 한 줄\n나를 받아 주시는 하나님을 의지하며, 곁의 사람에게도 돌아올 자리를 내어 주자.\n\n## 오늘의 적용\n오늘 누군가의 말을 들을 때 바로 해결책이나 평가부터 건네지 말고, 무엇이 가장 두려운지 먼저 들어 보자. 내가 도움이 필요한 쪽이라면 믿을 만한 사람 한 명에게 지금 필요한 도움을 구체적으로 말해 보자. 하나님께 의지하는 기도와 사람에게 도움을 청하는 행동을 함께 놓아도 좋아.\n\n## 짧은 기도\n하나님, 가까운 의지마저 흔들릴 때 저희를 받아 주시는 주님을 바라보게 하소서. 경외를 차가운 엄격함으로 바꾸지 않게 하시고, 저희 곁의 사람이 약한 모습으로도 찾아올 수 있게 하소서. 저희에게 필요한 도움도 정직하게 구하게 하소서. 아멘.","v":[{"ref":"시편 27:10","en":"Psalm 27:10","krv":"내 부모는 나를 버렸으나 여호와는 나를 영접하시리이다","bsb":"Though my father and mother forsake me, the LORD will receive me."},{"ref":"잠언 14:26","en":"Proverbs 14:26","krv":"여호와를 경외하는 자에게는 견고한 의뢰가 있나니 그 자녀들에게 피난처가 있으리라","bsb":"He who fears the LORD is secure in confidence, and his children shall have a place of refuge."}],"src":[{"name":"Daily Divine","title":"2026년 로중 성구 원본","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-17.md"}],"sha":"e24c660850496b6943b094c0a335cfd6fe2969ae70723bbda5630fc813984375"},{"date":"2026-10-18","title":"받은 말씀에 충실한 말","subtitle":"요한복음 12:49 · 사도행전 4:20","tagline":"예수님의 말씀을 먼저 듣고, 내가 아는 복음을 정직하게 말하자.","body":"## 로중 묵상\n### 첫째 말씀 — 요한복음 12:49\n예수님은 자신의 말씀이 어디에서 오는지 밝히셔. 요한복음 12장 끝부분은 사람들 앞에서 하신 예수님의 사역을 정리하는 자리야. 예수님을 믿는 것은 그분을 보내신 아버지를 믿는 것이며, 예수님은 세상을 구원하려고 오셨다고 말씀하시지. 그러면서 그 말씀을 받아들이는 일의 무게도 함께 짚으셔.\n\n‘내 자의로 말한 것이 아니요’는 예수님께 생각이나 뜻이 없다는 말이 아니야. 아버지와 떨어진 독자적인 권위를 내세워 말씀하지 않으신다는 뜻으로 읽어야 해. 이어지는 50절에서는 아버지의 명령이 영생임을 아신다고 하셔. 예수님의 말씀은 사람을 지배하려는 자기 과시가 아니라, 아버지를 드러내고 생명으로 부르는 말씀이야.\n\n이 말씀을 곧바로 ‘내가 확신하는 말은 하나님이 시키신 말’이라는 근거로 가져오면 위험해. 본문은 먼저 아버지께서 보내신 예수님이 누구신지를 말하고 있어. 우리의 말은 그분의 말씀 앞에서 검토받아야 하지, 그분의 권위를 손쉽게 빌려서는 안 되겠지.\n\n### 둘째 말씀 — 사도행전 4:20\n베드로와 요한은 예수님의 이름으로 말하거나 가르치지 말라는 명령을 받은 자리에서 대답해. 바로 앞에는 고침받은 사람이 함께 서 있어. 공회도 그 사건 자체를 부정하지는 못하지만, 예수님의 이름이 더 퍼지지 않도록 두 사도를 위협하지.\n\n‘보고 들은 것’은 단순히 강렬했던 개인적 느낌을 가리키지 않아. 예수님과 함께했던 사도들의 증언이며, 그분의 이름으로 일어난 사건을 말하는 문맥이야. 두 사람은 자기 의견을 끝까지 관철하겠다고 선언하기보다, 하나님 앞에서 누구의 말을 따라야 하는지 묻고 있어.\n\n오늘의 모든 논쟁을 이 장면과 같다고 볼 수는 없어. 반대를 받는다는 이유만으로 내 주장이 복음이 되는 것도 아니야. 사도들의 담대함은 그들이 증언하는 예수님께 묶여 있어. 우리도 말의 세기보다 무엇을 증언하고 있는지부터 돌아볼 필요가 있어.\n\n### 두 말씀이 만나는 지점\n첫 말씀은 예수님의 말씀이 아버지께로부터 왔음을, 둘째 말씀은 사도들이 그 예수님에 관해 침묵할 수 없음을 보여 줘. 아버지에게서 아들에게로, 그리고 예수님을 보고 들은 증인들의 말로 이어지는 흐름이 있어. 예수님과 사도들의 자리는 같지 않지만, 자기 권위를 세우는 대신 받은 말씀과 사건에 충실하다는 방향에서 만날 수 있어.\n\n신앙의 말에는 담대함과 절제가 함께 필요하겠지. 예수님에 관한 소망을 숨기지 않되, 내 판단까지 하나님의 뜻처럼 높이지 않는 거야. 말을 시작하기 전에 말씀을 듣는 시간이 필요한 까닭도 여기에 있어.\n\n### 오늘 붙잡을 한 줄\n예수님의 말씀을 먼저 듣고, 내가 아는 복음을 정직하게 말하자.\n\n## 오늘의 적용\n오늘 누군가에게 신앙 이야기를 할 기회가 생기면, 성경이 말하는 내용과 내 해석·경험을 구분해 보자. 모르는 것은 모른다고 말하고, 예수님에 관한 소망은 과장 없이 전해 보자. 반박하고 싶은 말이 떠오를 때에는 내가 지키려는 것이 복음인지 내 체면인지 잠시 살펴보아도 좋겠어.\n\n## 짧은 기도\n아버지 하나님, 예수님을 통해 생명의 말씀을 들려주셔서 감사합니다. 저희 생각을 주님의 뜻처럼 앞세우지 않게 하시고, 먼저 듣는 마음을 주옵소서. 두려움 때문에 복음을 숨기지 않으며, 사람을 이기려는 말 대신 예수님을 정직하게 증언하게 하소서. 아멘.","v":[{"ref":"요한복음 12:49","en":"John 12:49","krv":"내가 내 자의로 말한 것이 아니요 나를 보내신 아버지께서 나의 말할 것과 이를 것을 친히 명령하여 주셨으니","bsb":"I have not spoken on My own, but the Father who sent Me has commanded Me what to say and how to say it."},{"ref":"사도행전 4:20","en":"Acts 4:20","krv":"우리는 보고 들은 것을 말하지 아니할 수 없다 하니","bsb":"We cannot stop speaking about what we have seen and heard."}],"src":[{"name":"Bible Gateway / ESV","title":"요한복음 12:44–50 — 직접 문맥","url":"https://www.biblegateway.com/passage/?search=John+12:44-50&version=ESV"},{"name":"Bible Gateway / ESV","title":"사도행전 4:13–22 — 직접 문맥","url":"https://www.biblegateway.com/passage/?search=Acts+4:13-22&version=ESV"}],"sha":"8b616f087f8289e27c9e7f37e60f67529d40dfe29f4d57b393502e17b1560d41"},{"date":"2026-10-19","title":"복을 구하는 백성, 증인으로 보냄받은 사람들","subtitle":"시편 144:15 · 사도행전 1:8","tagline":"하나님께 일상의 평안을 구하며, 받은 소망을 이웃에게 건네는 증인으로 살자.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 144:15\n시편의 마지막 문장은 ‘복이 있는 백성’을 두 번 말해. 바로 앞에는 잘 자란 자녀들, 가득한 곡식 창고, 늘어나는 가축, 침입과 울부짖음이 없는 거리가 나와. 먹고사는 일과 안전, 다음 세대의 삶까지 품은 기도야. 신앙이 이런 일상의 바람과 무관하다고 말하지 않는다는 점부터 눈에 들어와.\n\n그런데 시는 풍족한 풍경에서 멈추지 않아. 여호와를 자기 하나님으로 삼는 백성이 복되다고 마쳐. 앞의 좋은 것들을 하찮게 만들기보다, 그 모든 바람을 누구께 두는지 밝히는 결말로 읽을 수 있어. 넉넉함 자체가 하나님을 대신할 수 없다는 방향이지.\n\n이 시 앞부분에서 시인은 인간이 잠깐 지나가는 그림자 같다고 고백하며 구원을 청해. 마지막의 평안한 풍경도 이미 확보한 성적표처럼 읽기보다, 연약한 사람이 하나님께 구하는 삶의 모습으로 보아야 해. 형편이 어려운 사람을 하나님 없는 사람으로 판정하는 근거가 될 수는 없어.\n\n### 둘째 말씀 — 사도행전 1:8\n제자들은 부활하신 예수님께 이스라엘 나라를 회복하실 때인지 물어. 예수님은 때와 시기를 아버지의 권한에 두시고, 제자들에게 성령과 증인의 사명을 약속하셔. 그들이 알고 싶어 한 시간표에서, 그들에게 맡겨질 증언으로 시선이 옮겨 가.\n\n여기서 권능은 내가 원하는 결과를 만들어 낼 능력과 같지 않아. 문장의 목적지는 ‘내 증인이 되리라’야. 예수님의 죽음과 부활을 증언하는 일을 성령께서 가능하게 하신다는 약속이지. 이어지는 사도행전에서 증언은 담대함과 공동체의 나눔으로 드러나지만, 반대와 고난도 사라지지 않아.\n\n예루살렘에서 온 유대와 사마리아를 지나 땅 끝까지 이어지는 말에는 익숙한 경계를 넘어가는 방향이 있어. 그렇다고 첫 제자들에게 주어진 약속을 오늘 우리의 모든 계획에 그대로 붙일 수는 없겠지. 먼저 복음의 증언이 무엇인지 듣고, 그 증언을 섬기는 삶으로 응답하는 것이 오늘의 적용이야.\n\n### 두 말씀이 만나는 지점\n시편은 하나님께 속한 백성의 복을 노래하고, 사도행전은 예수님의 증인들이 세상으로 나아갈 길을 열어 줘. 두 구절이 같은 상황을 말하는 것은 아니야. 평안한 삶을 구하는 기도와 경계를 넘어 증언하도록 보내는 약속은 서로 다른 자리에 있어.\n\n함께 읽으면 하나님을 믿는 삶을 내 울타리의 안전에만 가두지 않게 돼. 일상의 평안을 구하는 마음을 숨길 필요는 없어. 동시에 하나님께 속한 복을 누린다는 고백은, 그분에 관한 소망을 이웃과 나누는 자리로 이어질 수 있어. 받은 복을 지키는 일과 증인으로 살아가는 일을 경쟁시키지 말고 함께 놓아 보자.\n\n### 오늘 붙잡을 한 줄\n하나님께 일상의 평안을 구하며, 받은 소망을 이웃에게 건네는 증인으로 살자.\n\n## 오늘의 적용\n오늘 꼭 지켜졌으면 하는 일상의 바람 하나를 구체적으로 기도해 보자. 그리고 내 평안만 바라보다 놓친 사람은 없는지 살펴보자. 도움이 필요한 사람의 말을 듣거나 작은 수고를 나누는 일에서 시작해도 좋아. 그런 행동이 복음의 설명 전부는 아니지만, 예수님을 말하는 우리의 태도와 어울리는지 돌아볼 수 있어.\n\n## 짧은 기도\n하나님, 저희의 먹고사는 일과 가족과 거리를 주님께 맡깁니다. 넉넉함만을 복의 기준으로 삼지 않게 하시고, 주님께 속한 기쁨을 알게 하소서. 성령께서 저희를 도우셔서, 말과 삶으로 예수님을 정직하게 증언하게 하소서. 아멘.","v":[{"ref":"시편 144:15","en":"Psalm 144:15","krv":"이러한 백성은 복이 있나니 여호와를 자기 하나님으로 삼는 백성은 복이 있도다","bsb":"Blessed are the people whose God is the LORD."},{"ref":"사도행전 1:8","en":"Acts 1:8","krv":"오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아 땅 끝까지 이르러 내 증인이 되리라 하시니라","bsb":"You will receive power when the Holy Spirit comes upon you, and you will be My witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth."}],"src":[{"name":"Daily Divine","title":"2026년 로중 연도 원본","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-19.md"}],"sha":"d75202053ea7554924b7745a1094a55251f336b254c90745ae99c3302fc1a33a"},{"date":"2026-10-20","title":"흙임을 기억하시는 하나님께","subtitle":"시편 103:14 · 욥기 10:9","tagline":"나를 지으신 하나님께, 약함과 아직 풀리지 않은 질문을 함께 맡기자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 103:14\n\n> 이는 저가 우리의 체질을 아시며 우리가 진토임을 기억하심이로다\n\n이 말씀 바로 앞에는 아버지가 자녀를 불쌍히 여기듯 하나님이 자신을 경외하는 사람을 긍휼히 여기신다는 고백이 있어. 우리가 흙이라는 사실은 그 사랑의 까닭으로 이어져. 우리의 한계를 모르고 큰 기대만 거시는 분이 아니라, 무엇으로 지어진 존재인지 아시는 분이라는 거야. 뒤이어 사람의 날은 풀과 같지만 하나님의 인자하심은 영원하다는 대비도 나와. 오늘의 힘이 오래가지 못한다는 사실을 인정해도, 그분의 사랑까지 짧아지는 것은 아니지.\n\n### 둘째 말씀 — 욥기 10:9\n\n> 기억하옵소서 주께서 내 몸 지으시기를 흙을 뭉치듯 하셨거늘 다시 나를 티끌로 돌려 보내려 하시나이까\n\n욥의 목소리는 훨씬 아파. 자신을 손수 지으신 하나님이 왜 이제는 무너뜨리시는 것 같은지 묻고 있어. 여기서 흙은 편안한 위로의 비유만은 아니야. 지으신 손과 지금 겪는 고통 사이의 거리가 너무 커서, 그 손을 향해 다시 묻는 말이지. 이 구절을 곧 고통이 사라진다는 약속으로 바꾸면 욥의 질문을 놓치게 돼. 욥은 설명을 얻지 못한 채로도 자신을 만드신 분께 말을 건네고 있어.\n\n### 두 말씀이 만나는 지점\n\n시편은 하나님이 기억하신다고 고백하고, 욥은 하나님께 기억해 달라고 간구해. 같은 흙의 자리에서 확신과 탄식이 함께 들리는 셈이야. 시편의 고백으로 욥의 말을 서둘러 덮을 필요는 없어. 우리를 아시는 하나님 앞에서는 이해되지 않는 아픔도 기도의 말이 될 수 있으니까. 믿음이 늘 차분한 문장으로만 나오는 것은 아니야. 내가 흙임을 아시는 분께, 흙처럼 부서질 것 같은 마음을 숨기지 않고 드려 보자.\n\n### 오늘 붙잡을 한 줄\n\n나를 지으신 하나님께, 나의 약함과 아직 풀리지 않은 질문을 함께 맡기자.\n\n## 오늘의 적용\n\n오늘 해야 할 일 가운데 내 힘의 한계를 인정해야 할 한 가지를 골라 보자. 감당할 수 있는 분량을 정하거나, 도움이 필요한 부분을 구체적으로 말해 보자. 곁에서 힘들다고 말하는 사람이 있다면 이유를 빨리 설명해 주기보다 그 말을 끝까지 들어 주는 것도 좋겠어. 하나님이 우리의 연약함을 기억하신다는 고백이, 서로에게 요구하는 속도와 무게에도 닿도록 말이야.\n\n## 짧은 기도\n\n저희를 지으시고 흙임을 기억하시는 하나님, 약함을 감추느라 주님께 드릴 말까지 잃지 않게 하소서. 이해할 수 없는 일 앞에서도 정직하게 기도하게 하시고, 다른 사람의 아픔을 성급한 설명으로 덮지 않게 하소서. 오늘 감당할 걸음과 필요한 도움을 구할 용기를 주소서. 아멘.","v":[{"ref":"시편 103:14","en":"Psalm 103:14","krv":"이는 저가 우리의 체질을 아시며 우리가 진토임을 기억하심이로다","bsb":"He knows our frame; He is mindful that we are dust."},{"ref":"욥기 10:9","en":"Job 10:9","krv":"기억하옵소서 주께서 내 몸 지으시기를 흙을 뭉치듯 하셨거늘 다시 나를 티끌로 돌려 보내려 하시나이까","bsb":"Please remember that You molded me like clay. Would You now return me to dust?"}],"src":[{"name":"Crossway · ESV.org","title":"Psalm 103 — 문맥 읽기","url":"https://www.esv.org/Psalm+103/"},{"name":"Crossway · ESV.org","title":"Job 10 — 문맥 읽기","url":"https://www.esv.org/Job+10/"}],"sha":"54e56ebf731d2b231e3545b1e515bd04b15f8467e2eeb42f2b6bfeb7b1347dcf"},{"date":"2026-10-21","title":"낮은 마음으로, 주님을 따르는 자리에서","subtitle":"잠언 16:18 · 요한복음 15:20","tagline":"내 판단을 고칠 줄 알고, 주님을 따르는 자리에서는 흔들림 없이 걷자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 잠언 16:18\n\n> 교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라\n\n이 말씀은 넘어지고 난 뒤 남을 평가하라고 주어진 문장이 아니야. 바로 다음 절은 교만한 사람들과 전리품을 나누는 것보다 겸손한 사람들과 낮은 자리에 있는 편이 낫다고 말해. 눈에 보이는 성과가 커도, 그 성과를 얻고 지키는 마음이 어떤지는 따로 물어야 한다는 거지. 교만은 내 판단을 더는 고칠 필요가 없다고 여기는 태도로도 나타나. 이 잠언을 다른 사람의 실패 원인을 알아맞히는 공식으로 쓰기보다, 지금 내게 들리는 충고를 어떻게 받고 있는지 살펴보면 좋겠어.\n\n### 둘째 말씀 — 요한복음 15:20\n\n> 내가 너희더러 종이 주인보다 더 크지 못하다 한 말을 기억하라 사람들이 나를 핍박하였은즉 너희도 핍박할 터이요 내 말을 지켰은즉 너희 말도 지킬 터이라\n\n예수님은 제자들에게 세상의 미움을 말씀하시면서, 자신이 먼저 그 미움을 받았다는 사실을 기억하게 하셔. 종이 주인보다 크지 않다는 말은 여기서 제자도 주님이 걸으신 길과 무관하게 살 수 없다는 뜻으로 들려. 주님을 따른다고 해서 언제나 환영받는 것은 아니라는 거야. 그러나 모든 반대를 신앙 때문이라고 이름 붙여도 된다는 말은 아니지. 이 문맥에서 미움의 까닭은 예수님께 속했다는 데 있어. 내 무례함으로 생긴 갈등까지 주님의 고난과 같다고 여길 수는 없어.\n\n### 두 말씀이 만나는 지점\n\n잠언은 스스로 높아진 마음을 경계하고, 예수님은 제자가 주님보다 높은 자리를 기대하지 않도록 하셔. 두 말씀을 함께 들으면 겸손은 성공을 얻는 요령보다, 내가 누구의 말을 듣고 누구를 따르는지 아는 태도에 가까워져. 낮아지면 반드시 일이 잘 풀린다는 약속도 아니야. 바로잡을 말 앞에서는 배우고, 주님을 따르다 겪는 어려움 앞에서는 쉽게 길을 버리지 않는 것. 이 둘은 서로 다른 상황에 필요한 같은 낮은 마음일 수 있어.\n\n### 오늘 붙잡을 한 줄\n\n내 판단을 고칠 줄 알고, 주님을 따르는 자리에서는 흔들림 없이 걷자.\n\n## 오늘의 적용\n\n최근 마음에 걸렸던 지적 하나를 떠올려 보자. 말투가 불편했다는 이유로 내용까지 밀어내지는 않았는지 살펴보고, 고칠 점이 있다면 한 가지를 구체적으로 바꾸어 보자. 반대로 사람들의 호응을 얻으려고 정직함이나 사랑을 포기하려는 일이 있다면, 오늘 할 수 있는 작은 순종을 정해 보자. 충고를 듣는 일과 눈치를 따르는 일은 같지 않으니까.\n\n## 짧은 기도\n\n주 예수님, 저희가 주님보다 앞서거나 높아지려 하지 않게 하소서. 교만 때문에 듣지 못한 말을 듣게 하시고, 잘못을 인정할 용기를 주소서. 환영받지 못할 때에도 주님의 사랑과 진실을 버리지 않게 하시며, 저희의 허물을 신앙의 이름으로 감추지 않게 하소서. 아멘.","v":[{"ref":"잠언 16:18","en":"Proverbs 16:18","krv":"교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라","bsb":"Pride goes before destruction, and a haughty spirit before a fall."},{"ref":"요한복음 15:20","en":"John 15:20","krv":"내가 너희더러 종이 주인보다 더 크지 못하다 한 말을 기억하라 사람들이 나를 핍박하였은즉 너희도 핍박할 터이요 내 말을 지켰은즉 너희 말도 지킬 터이라","bsb":"Remember the word that I spoke to you: ‘No servant is greater than his master.’"}],"src":[{"name":"Crossway · ESV.org","title":"Proverbs 16 — 문맥 읽기","url":"https://www.esv.org/Proverbs+16/"},{"name":"Crossway · ESV.org","title":"John 15 — 문맥 읽기","url":"https://www.esv.org/John+15/"}],"sha":"4f4ac8d1ce03dc3f953bda8074da16948a2092c22ba7b7376510b6eea9698a47"},{"date":"2026-10-22","title":"숨기지 않고 하나님께 가까이","subtitle":"야고보서 4:8 · 요한일서 1:10","tagline":"잘못을 숨기지 않고, 은혜를 주시는 하나님께 가까이 가자.","body":"## 로중 묵상\n### 첫째 말씀 — 야고보서 4:8\n하나님께 가까이 간다는 말을 마음이 편안해지는 시간으로만 생각하기 쉬워. 그런데 야고보는 다투고 서로 욕심내는 공동체를 향해 이 말을 하고 있어. 손을 씻으라는 요청은 행동을, 두 마음을 성결하게 하라는 요청은 하나님과 다른 욕망 사이에 갈라진 충성을 돌아보게 해. 가까이 감에는 잘못을 인정하고 삶의 방향을 돌리는 회개가 함께 있어.\n\n그렇다고 먼저 흠 없는 사람이 되어야 하나님을 만난다는 뜻은 아니야. 바로 앞 6절은 하나님이 더 큰 은혜를 주시며 겸손한 자에게 은혜를 베푸신다고 말해. 그 은혜 앞에서 자신을 낮추고 돌아오라는 부름이야. 가까이 오시는 하나님의 약속과 우리의 돌이킴을 함께 읽어야겠지.\n\n### 둘째 말씀 — 요한일서 1:10\n요한은 하나님을 빛이라고 말한 뒤, 하나님과 사귄다는 말과 실제 걸음이 일치하는지 묻고 있어. 죄가 없다고 주장하는 것은 자신의 상태를 잘못 아는 데서 그치지 않아. 죄를 드러내시는 하나님의 말씀을 거짓으로 취급하는 일이 된다는 거야.\n\n이 경고 바로 앞에는 죄를 자백할 때 용서하시고 깨끗하게 하신다는 약속이 놓여 있어. 빛 가운데 걷는 삶은 한 번도 넘어지지 않았다고 주장하는 삶이 아니야. 자신의 죄를 숨기지 않고 그리스도의 씻으심을 의지하는 삶으로 읽을 수 있어. 본문은 잘못을 가볍게 만들지도, 용서로 돌아갈 길을 닫지도 않아.\n\n### 두 말씀이 만나는 지점\n야고보는 하나님께 돌아오라고 부르고, 요한은 돌아오는 길에서 죄를 부인하지 말라고 말해. 두 말씀에서 정직함은 하나님과의 관계에 속한 일이야. 회개를 자기혐오에 머무르게 할 이유도 없어. 더 큰 은혜와 용서의 약속이, 잘못을 감추던 손을 펴게 해 주니까.\n\n### 오늘 붙잡을 한 줄\n잘못을 숨기지 않고, 은혜를 주시는 하나님께 가까이 가자.\n\n## 오늘의 적용\n오늘 했던 말이나 행동 가운데 변명으로 덮어 둔 한 가지를 구체적으로 돌아보자. 하나님께 무엇이 잘못이었는지 말하고, 누군가에게 상처를 주었다면 사과하거나 바로잡을 수 있는 행동 하나를 정하자. 죄를 인정하는 기도와 실제 손의 움직임이 이어지도록 해 보자.\n\n## 짧은 기도\n하나님, 저희가 잘못을 감추며 스스로를 옳다 하지 않게 하소서. 죄를 인정할 정직함과 주님의 용서를 믿는 마음을 주소서. 갈라진 마음을 모아 주님께 가까이 가게 하시고, 저희의 말과 행동도 돌이키게 하소서. 아멘.","v":[{"ref":"야고보서 4:8","en":"James 4:8","krv":"하나님을 가까이 하라 그리하면 너희를 가까이 하시리라 죄인들아 손을 깨끗이 하라 두 마음을 품은 자들아 마음을 성결케 하라","bsb":"Draw near to God, and He will draw near to you. Cleanse your hands, you sinners, and purify your hearts, you double-minded."},{"ref":"요한일서 1:10","en":"1 John 1:10","krv":"만일 우리가 범죄하지 아니하였다 하면 하나님을 거짓말하는 자로 만드는 것이니 또한 그의 말씀이 우리 속에 있지 아니하니라","bsb":"If we say we have not sinned, we make Him out to be a liar, and His word is not in us."}],"src":[{"name":"Bible Gateway / Crossway","title":"야고보서 4장 — ESV","url":"https://www.biblegateway.com/passage/?search=James+4&version=ESV"},{"name":"Bible Gateway / Crossway","title":"요한일서 1장 — ESV","url":"https://www.biblegateway.com/passage/?search=1+John+1&version=ESV"}],"sha":"e3d8faaf279e2f3fd7d1f8d8697c8b4ae2e6a62fc72199da268d39824eee75e9"},{"date":"2026-10-23","title":"책망에서 돌이킴으로, 주님께 돌아가는 길","subtitle":"요한복음 16:8 · 사도행전 2:38","tagline":"드러난 잘못 앞에서 변명을 내려놓고, 용서하시는 주님께 돌아가자.","body":"## 로중 묵상\n### 첫째 말씀 — 요한복음 16:8\n\n> 그가 와서 죄에 대하여, 의에 대하여, 심판에 대하여 세상을 책망하시리라\n\n죄가 드러나는 순간을 우리는 어떻게 받아들일까. 오늘 두 말씀은 잘못을 깨닫게 하시는 성령과, 그 깨달음 앞에서 돌아설 길을 함께 보여 줘. 먼저 예수님이 이 말씀을 하신 자리는 십자가를 앞두고 제자들과 나누신 마지막 대화야.\n\n예수님은 떠나시는 일을 슬퍼하는 제자들에게 보혜사, 곧 그들을 도우시는 성령을 보내겠다고 하셔. 이어지는 9~11절은 죄·의·심판이 무엇과 관계되는지 풀어 주지. 죄는 예수님을 믿지 않는 일과, 의는 예수님이 아버지께 가시는 일과, 심판은 이 세상 임금이 심판받았다는 사실과 연결돼. 그러니 여기서 책망은 막연한 죄책감을 끝없이 키우는 일로 좁힐 수 없어. 세상이 예수님에 대해 내린 판단이 옳은지 드러내는 일이기도 해.\n\n사람들에게 배척당하신 예수님이 아버지께 가시고, 세상의 통치자는 이미 심판받았다는 선언이 나란히 놓여 있어. 세상의 평가가 마지막 판결은 아니라는 뜻으로 읽을 수 있지. 성령의 일을 내 기분이 얼마나 무겁거나 가벼운지로만 재지 않고, 예수님이 누구신지를 보게 하시는 말씀과 함께 살펴야겠어.\n\n### 둘째 말씀 — 사도행전 2:38\n\n> 베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니\n\n이 말씀은 오순절에 베드로의 설교를 들은 사람들이 “우리가 어찌할꼬”라고 묻자 나온 대답이야. 그들은 자신들이 십자가에 못 박은 예수님을 하나님이 주와 그리스도로 세우셨다는 말을 듣고 마음에 찔렸어. 베드로는 그 찔림을 오래 유지하라고 하지 않고 회개와 세례로 응답하라고 해.\n\n회개는 잘못을 괴로워하는 감정에만 머물지 않고, 예수님을 거부하던 자리에서 그분께 돌아서는 일이야. 예수님의 이름으로 받는 세례는 그분께 속하게 된 믿음을 드러내는 표지로 이 부름 안에 놓여 있어. 용서를 얻는 기술이나 성령을 받을 자격을 쌓는 절차로 읽기보다, 죄 사함과 성령의 선물을 약속하시는 복음의 초대로 들어야겠지.\n\n바로 다음 절은 이 약속이 듣는 이들과 자녀들, 멀리 있는 사람들 가운데 하나님이 부르시는 이들에게도 열려 있다고 말해. 베드로의 대답에는 잘못을 분명히 하면서도 돌아올 사람을 밀어내지 않는 넓이가 있어.\n\n### 두 말씀이 만나는 지점\n\n요한복음에서 예수님은 성령이 예수님을 둘러싼 세상의 잘못된 판단을 드러내실 것이라고 약속하셔. 사도행전에서는 높임받으신 예수님이 성령을 부으셨다는 선포를 듣고 사람들이 돌이킬 길을 물어. 서로 다른 상황의 본문이지만, 예수님을 바로 알아보는 일과 회개가 이어진다는 점에서 만나지.\n\n우리에게 적용한다면 죄를 알아차리는 데서 멈추지 않는 것이겠어. 잘못을 감추지도, 그 잘못이 나의 마지막 이름이라고 여기지도 말자. 부활하신 주님께 돌아오라는 부름과 용서의 약속을 함께 듣는 거야.\n\n### 오늘 붙잡을 한 줄\n\n드러난 잘못 앞에서 변명을 내려놓고, 용서하시는 주님께 돌아가자.\n\n## 오늘의 적용\n\n기도할 때 막연히 “제가 부족합니다”라고만 말하는 대신, 돌이켜야 할 말이나 행동 한 가지를 구체적으로 고백해 보자. 누군가에게 잘못했다면 사과와 바로잡는 행동까지 이어 가자. 나를 변호할 말을 찾던 자리에서, 예수님이 주님이심을 믿는 사람의 다음 행동을 선택해 보는 거야.\n\n## 짧은 기도\n\n주님, 성령께서 말씀으로 드러내시는 진실을 피하지 않게 하소서. 저희의 죄를 인정하고 예수 그리스도께 돌아가게 하시며, 용서를 약속하신 주님을 신뢰하게 하소서. 회개가 말에 머물지 않고 오늘의 걸음으로 이어지게 하소서. 아멘.","v":[{"ref":"요한복음 16:8","en":"John 16:8","krv":"그가 와서 죄에 대하여, 의에 대하여, 심판에 대하여 세상을 책망하시리라","bsb":"When He comes, He will convict the world in regard to sin and righteousness and judgment."},{"ref":"사도행전 2:38","en":"Acts 2:38","krv":"베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니","bsb":"Repent and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of your sins, and you will receive the gift of the Holy Spirit."}],"src":[{"name":"Daily Divine","title":"2026년 10월 23일 로중 두 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/divine?date=2026-10-23"},{"name":"Bible Gateway / ESV","title":"요한복음 16:7–11 · 사도행전 2:32–41","url":"https://www.biblegateway.com/passage/?search=John%2016%3A7-11%3BActs%202%3A32-41&version=ESV"}],"sha":"95dfcf775bef9101ebf222aadb6abfef02cb874f7593a55a865ad223fefe8715"},{"date":"2026-10-24","title":"위로를 구하는 기도, 위로를 기다리는 사람","subtitle":"시편 119:76 · 누가복음 2:25","tagline":"하나님의 신실하심을 믿는 자리에서도, 그분의 위로를 구해도 된다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 119:76\n“구하오니 주의 종에게 하신 말씀대로 주의 인자하심이 나의 위안이 되게 하시며”\n\n이 기도 앞에서 시인은 자신을 지으신 하나님께 깨달음을 구하고, 고난 가운데서도 하나님의 판단이 의롭고 신실하다고 고백해. 그렇다고 아픔이 사라졌다고 말하지는 않아. 바로 그 자리에서 인자하심이 위안이 되게 해 달라고 간구하지. 하나님의 신실함을 믿는 일과 위로를 필요로 하는 일은 함께 있을 수 있어.\n\n여기서 위로의 근거는 ‘주의 종에게 하신 말씀’이야. 시인은 바라는 결과를 하나님의 약속이라고 이름 붙이지 않고, 하나님이 이미 하신 말씀에 기대어 인자하심을 구해. 이어지는 절에서도 긍휼을 베풀어 자신이 살게 해 달라고 기도해. 말씀을 사랑하는 사람에게도 위로는 스스로 만들어 내는 힘이 아니라 하나님께 받아야 할 은혜인 거야.\n\n### 둘째 말씀 — 누가복음 2:25\n“예루살렘에 시므온이라 하는 사람이 있으니 이 사람이 의롭고 경건하여 이스라엘의 위로를 기다리는 자라 성령이 그 위에 계시더라”\n\n시므온이 기다리는 ‘이스라엘의 위로’는 개인의 기분이 나아지는 일보다 넓어. 하나님이 자기 백성을 찾아와 구원하시리라는 소망을 가리켜. 누가는 그를 의롭고 경건한 사람, 성령이 함께하시는 사람으로 소개해. 다음 구절에서는 주의 그리스도를 보기 전에는 죽지 않으리라는 성령의 지시를 받았다고 밝혀.\n\n그 기다림은 성전에 들어온 아기 예수를 안는 장면으로 이어져. 시므온은 그 아이를 보며 하나님의 구원을 보았다고 고백하지. 하지만 그 만남 뒤에는 마리아의 마음을 찌를 칼과 사람들의 반대에 관한 말도 나와. 누가가 전하는 위로에는 구원의 기쁨과 그 길에서 드러날 아픔이 함께 놓여 있어.\n\n### 두 말씀이 만나는 지점\n시인은 말씀에 기대어 위로를 구하고, 시므온은 하나님이 주실 위로를 기다려. 한 사람의 고난 속 기도와 한 백성의 구원을 향한 기다림은 서로 다른 자리에 있지만, 위로의 근원을 하나님의 신실하심에서 찾는다는 점에서 만나.\n\n그리스도인의 시선으로 두 본문을 함께 읽으면, 하나님의 위로가 예수 안에서 구체적인 얼굴을 얻는 장면을 보게 돼. 다만 시편의 이 한 구절이 시므온의 만남을 직접 예고했다고 단정할 필요는 없어. 두 본문의 각기 다른 목소리를 들으면서, 약속하신 하나님께 위로를 구하고 그리스도를 바라보는 자리로 나아갈 수 있어.\n\n### 오늘 붙잡을 한 줄\n하나님의 신실하심을 믿는 자리에서도, 그분의 위로를 구해도 된다.\n\n## 오늘의 적용\n마음을 누르는 일 하나를 정직하게 하나님께 말씀드려 보자. 곧 해결되어야 한다는 요구를 약속처럼 붙들기보다, 하나님이 어떤 분이신지를 성경에서 확인하고 그 인자하심을 구하는 거야. 곁에 지친 사람이 있다면 성급한 설명을 앞세우기 전에 이야기를 끝까지 들어 보자. 우리가 전하는 위로도 상대의 아픔을 지워 버리는 말이 되지 않도록.\n\n## 짧은 기도\n신실하신 하나님, 주의 말씀대로 인자하심을 베풀어 주옵소서. 기다리는 동안에도 그리스도를 바라보게 하시고, 제 곁의 사람에게 성급한 답보다 귀 기울이는 마음을 주옵소서. 아픔 가운데 있는 저희를 주의 긍휼로 붙들어 주옵소서. 아멘.","v":[{"ref":"시편 119:76","en":"Psalm 119:76","krv":"구하오니 주의 종에게 하신 말씀대로 주의 인자하심이 나의 위안이 되게 하시며","bsb":"May Your loving devotion comfort me, I pray, according to Your promise to Your servant."},{"ref":"누가복음 2:25","en":"Luke 2:25","krv":"예루살렘에 시므온이라 하는 사람이 있으니 이 사람이 의롭고 경건하여 이스라엘의 위로를 기다리는 자라 성령이 그 위에 계시더라","bsb":"There was a man in Jerusalem named Simeon, who was righteous and devout. He was waiting for the consolation of Israel, and the Holy Spirit was upon him."}],"src":[{"name":"Daily Divine DIVINE_SOURCE","title":"2026-10-24 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-24.md"}],"sha":"a329870e90f57ab375ae86f8fd9e8d048bc63547d8e2478a452b47935f32fda4"},{"date":"2026-10-25","title":"건짐의 기억에서, 오늘의 신뢰로","subtitle":"시편 81:7 · 이사야 43:11","tagline":"건져 주신 하나님을 기억하며, 오늘도 그분의 말씀에 귀를 기울이자.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 81:7\n> 네가 고난 중에 부르짖으매 내가 너를 건졌고 뇌성의 은은한 곳에서 네게 응답하며 므리바 물가에서 너를 시험하였도다(셀라)\n\n도움을 구하던 시간이 지나면, 건져 주신 분의 말씀도 계속 듣고 있을까. 오늘 두 말씀은 구원의 기억과 지금의 신뢰를 함께 돌아보게 해. 시편 81편은 절기의 노래로 시작하지만, 이스라엘을 향한 하나님의 말씀을 듣는 자리로 이어져.\n\n하나님은 백성의 어깨에서 짐을 벗기고 부르짖음에 응답하셨던 일을 들려주셔. 이집트의 종살이에서 건져 내신 역사를 기억하게 하시는 거야. 그런데 7절은 구출만 말하지 않고 므리바에서의 시험도 함께 언급해. 건짐받았다는 기억이 그 뒤의 모든 순간에 신뢰가 저절로 이어졌다는 뜻은 아니지.\n\n바로 다음에는 다른 신을 섬기지 말고 하나님께 들으라는 요청이 나와. 백성은 듣지 않았고, 하나님은 그 완고함을 슬퍼하셔. 그러니 이 말씀을 부르짖기만 하면 원하는 결과가 반드시 온다는 공식으로 읽기는 어려워. 구원의 은혜를 기억하며, 건져 주신 분의 음성에 다시 귀를 기울이라는 초대로 읽어야겠어.\n\n### 둘째 말씀 — 이사야 43:11\n> 나 곧 나는 여호와라 나 외에 구원자가 없느니라\n\n이사야 43장은 두려움 속의 이스라엘에게 하나님이 그들을 지으시고 구속하셨다고 선언해. 물과 불을 지날 때 함께하시겠다는 약속도 그 안에 있어. 어려운 길 자체가 없으리라는 말과는 구분해야 해. 그 길을 지나는 백성이 누구에게 속해 있는지 먼저 밝혀 주시는 거야.\n\n8절 이후에는 여러 민족이 모인 가운데 누가 참 하나님인지 증언하는 장면이 펼쳐져. 하나님은 이스라엘을 증인으로 부르시며 자신이 구원하신 일을 말씀하셔. ‘나 외에 구원자가 없다’는 선언은 그 흐름 안에서 들려와. 백성이 스스로의 힘을 자랑하는 근거가 아니라, 구원의 근원이 하나님이심을 아는 고백이 되는 거지.\n\n### 두 말씀이 만나는 지점\n시편은 건짐받은 백성에게 들으라고 부르고, 이사야는 구원을 경험한 백성을 증인으로 세워. 두 본문 모두 하나님이 먼저 행하신 일에서 시작해. 은혜의 기억은 과거의 아름다운 이야기로만 남지 않고, 오늘 누구를 신뢰하며 누구의 말을 따를지 묻게 해.\n\n우리에게 적용할 때도 다른 사람의 도움을 거절하라는 뜻으로 옮길 필요는 없어. 사람과 제도를 통해 도움받으면서도 그것을 절대적인 구원자로 만들지 않는 태도를 생각할 수 있지. 이 구별은 본문의 직접 진술에 기대어 오늘의 삶으로 옮겨 보는 적용이야.\n\n### 오늘 붙잡을 한 줄\n건져 주신 하나님을 기억하며, 오늘도 그분의 말씀에 귀를 기울이자.\n\n## 오늘의 적용\n지나온 시간에 받은 도움 하나를 구체적으로 떠올리고 감사해 보자. 이어 지금 내 판단을 가장 강하게 움직이는 것이 무엇인지 살펴보자. 두려움 때문에 서두르던 일에서 잠시 멈추고, 정직함과 이웃 사랑이라는 말씀의 기준에 맞는 다음 행동 하나를 선택해 보자.\n\n## 짧은 기도\n하나님, 고난 중에 부르짖는 저희의 기도를 들어 주옵소서. 받은 은혜를 잊지 않게 하시고, 도움이 절실할 때에도 주님의 말씀을 외면하지 않게 하소서. 주님을 신뢰하며 오늘의 길을 정직하게 걷게 하소서. 아멘.","v":[{"ref":"시편 81:7","en":"Psalm 81:7","krv":"네가 고난 중에 부르짖으매 내가 너를 건졌고 뇌성의 은은한 곳에서 네게 응답하며 므리바 물가에서 너를 시험하였도다(셀라)","bsb":"You called out in distress, and I rescued you."},{"ref":"이사야 43:11","en":"Isaiah 43:11","krv":"나 곧 나는 여호와라 나 외에 구원자가 없느니라","bsb":"I, yes I, am the LORD, and there is no Savior but Me."}],"src":[{"name":"Daily Divine DIVINE_SOURCE","title":"2026년 로중 연도 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/daily/2026-10-25.md"},{"name":"Bible Gateway","title":"Psalm 81 — ESV / NET / NKJV","url":"https://www.biblegateway.com/passage/?search=Psalm+81&version=ESV%3BNET%3BNKJV"},{"name":"Bible Gateway","title":"Isaiah 43 — Israel's Only Savior","url":"https://search.biblegateway.com/passage/?search=Isaiah+43&version=NIV"}],"sha":"24e13dc60b012fab26d7c2e62b65e6fa2008d7b81f60f753bbc483282097b77e"},{"date":"2026-10-26","title":"찾아오신 구원, 계속되는 간구","subtitle":"누가복음 19:9 · 히브리서 7:25","tagline":"나를 찾아오신 주님을 의지해 하나님께 나아가고, 그 은혜를 이웃을 대하는 행동으로 옮기자.","body":"## 로중 묵상\n### 첫째 말씀 — 누가복음 19:9\n삭개오의 집에 구원이 이르렀다는 선언 앞에는 예수님의 방문과 사람들의 수군거림이 있어. 세리장인 삭개오를 사람들은 죄인으로 보지만, 예수님은 그의 이름을 부르고 그 집에 머무르겠다고 하셔. 삭개오는 기쁘게 맞이하고, 가난한 이들에게 재산을 나누며 속여 빼앗은 것이 있으면 갚겠다고 말하지. 예수님의 구원 선언은 이 만남의 한가운데 놓여 있어.\n\n이 장면을 재산을 내놓아 구원을 산 이야기로 읽기는 어려워. 바로 다음 절에서 예수님은 잃어버린 자를 찾아 구원하러 오셨다고 자신의 사명을 밝히시거든. 은혜가 사람을 찾아오고, 그 만남이 돈과 이웃을 대하는 자리까지 건드리는 흐름으로 읽을 수 있어. ‘아브라함의 자손’이라는 말씀은 사람들이 밀어낸 이 사람도 약속의 백성 가운데 있음을 드러내지.\n\n### 둘째 말씀 — 히브리서 7:25\n여기서 구원의 근거는 예수님이 언제나 살아 계신다는 사실이야. 앞선 23~24절은 죽음 때문에 직무를 이어 갈 수 없었던 제사장들과 영원히 계시는 예수님을 대조해. 그래서 예수님을 통해 하나님께 나아가는 이들에게는 중보자가 사라질까 염려할 이유가 없어.\n\n‘온전히’ 구원하신다는 말은 예수님의 구원 능력과 지속성을 함께 보게 해. 이어지는 문맥은 그분이 자신을 단번에 드리셨다고 말하지. 지금의 간구는 희생이 부족해서 거듭 보충하는 일이 아니라, 자신을 드리신 살아 계신 대제사장의 사역으로 이해해야 해. 내 기도의 힘보다 나를 위해 간구하시는 분에게 먼저 시선이 가는 본문이야.\n\n### 두 말씀이 만나는 지점\n누가복음은 한 사람의 집으로 찾아온 구원을 보여 주고, 히브리서는 하나님께 나아갈 길이 어떻게 계속 열려 있는지 설명해. 같은 장면을 되풀이하는 말씀은 아니지만, 구원의 중심에 예수님이 계신다는 점에서 만나. 그분이 먼저 찾아오시며, 그분을 힘입어 우리는 하나님께 나아가. 이 은혜는 삶을 바꿀 책임과도 이어져. 삭개오의 집에서는 그 변화가 나눔과 갚음이라는 구체적인 말로 드러나지.\n\n### 오늘 붙잡을 한 줄\n나를 찾아오신 주님을 의지해 하나님께 나아가고, 그 은혜를 이웃을 대하는 행동으로 옮기자.\n\n## 오늘의 적용\n하나님께 나아가기를 미루게 하는 잘못이 있다면 변명보다 먼저 그것을 기도로 고백해 보자. 그리고 돌려주어야 할 것, 바로잡아야 할 말, 나눌 수 있는 몫 가운데 실제로 행할 한 가지를 정해 보자. 그 행동을 구원을 얻을 값으로 삼지 않고, 주님을 맞아들인 삶의 응답으로 행하는 거야.\n\n## 짧은 기도\n주 예수님, 잃어버린 자를 찾아오시고 지금도 우리를 위하여 간구하시니 감사합니다. 주님을 힘입어 하나님께 나아가게 하시고, 받은 은혜가 정직한 고백과 이웃을 향한 책임으로 이어지게 하소서. 아멘.","v":[{"ref":"누가복음 19:9","en":"Luke 19:9","krv":"예수께서 이르시되 오늘 구원이 이 집에 이르렀으니 이 사람도 아브라함의 자손임이로다","bsb":"Jesus said to him, “Today salvation has come to this house.”"},{"ref":"히브리서 7:25","en":"Hebrews 7:25","krv":"그러므로 자기를 힘입어 하나님께 나아가는 자들을 온전히 구원하실 수 있으니 이는 그가 항상 살아서 저희를 위하여 간구하심이니라","bsb":"He is able to save completely those who draw near to God through Him, since He always lives to intercede for them."}],"src":[{"name":"Bible Gateway","title":"누가복음 19장 — 삭개오와 예수님의 방문","url":"https://classic.biblegateway.com/passage/?search=Luke+19&version=ESV"},{"name":"Bible Gateway","title":"히브리서 7장 — 영원한 대제사장","url":"https://www.biblegateway.com/passage/?search=Heb.7&version=ESV"}],"sha":"6a917985a89622a92f436a2fe7a2f256b3432675062825b9f9d2fd7abfc997b0"},{"date":"2026-10-27","title":"인자로 나타나는 권능, 완고하지 않은 마음","subtitle":"민수기 14:17 · 시편 95:4","tagline":"깊은 곳까지 쥐신 하나님의 권능은 인자로 드러나니, 오늘 그분의 음성 앞에서 마음을 부드럽게 열어 두자.","body":"## 로중 묵상\n### 첫째 말씀 — 민수기 14:17\n“이제 구하옵나니 이미 말씀하신 대로 주의 큰 권능을 나타내옵소서 이르시기를”\n\n이 구절은 문장이 끝나지 않은 채 다음 절로 이어져. 정탐꾼의 보고를 들은 백성이 하나님을 원망하자, 하나님은 그들을 전염병으로 치겠다고 말씀하셔. 모세는 그 앞에 서서 중재 기도를 드려. 그가 구하는 ‘큰 권능’은 하나님이 일을 이루시는 힘이야. 그런데 이어지는 18절에서 모세는 그 권능을 적을 쓰러뜨리는 힘으로 설명하지 않고, 노하기를 더디 하시고 인자가 많으시며 죄악을 사하시는 하나님의 이름으로 풀어 내.\n\n20절에서 하나님은 모세의 말대로 사하셨다고 답하셔. 다만 이 용서가 모든 결과를 없앤다는 뜻은 아니야. 이어서 하나님은 영광과 표적을 보고도 열 번이나 자신을 시험한 사람들이 그 땅을 보지 못할 것이라고 말씀하셔. 용서와 책임 있는 결과가 한 장면 안에 함께 있어.\n\n### 둘째 말씀 — 시편 95:4\n“땅의 깊은 곳이 그 위에 있으며 산들의 높은 것도 그의 것이로다”\n\n시편 95편은 노래하며 여호와께 나아가자는 초대로 시작해. 하나님은 큰 하나님이시고 모든 신 위에 큰 왕이시니, 사람의 눈에 닿지 않는 깊은 곳도 오르기 어려운 산꼭대기도 그분의 다스림 아래 있다는 거야. 위치가 가장 낮은 곳부터 가장 높은 곳까지 하나님이 다스리신다는 고백이지.\n\n그런데 시편은 찬양에서 멈추지 않아. 7절 뒤쪽부터는 오늘 그분의 음성을 듣거든 마음을 완고하게 하지 말라고 하고, 므리바와 맛사에서 하나님을 시험한 광야 세대를 돌아봐. 그 세대는 하나님의 일을 보고도 그분의 길을 알지 못해 안식에 들어가지 못했다고 해. 큰 왕을 노래하는 입술과 그분의 음성 앞에서 닫히는 마음이 함께 갈 수는 없다는 경고야.\n\n### 두 말씀이 만나는 지점\n민수기에서 모세는 무너질 수밖에 없어 보이는 자리에서 하나님의 큰 권능을 구했고, 시편은 그 권능이 깊은 곳과 높은 곳을 모두 덮는다고 노래해. 시편 95편의 마지막 부분이 광야 세대를 돌아본다는 점에서, 두 본문은 같은 이야기의 앞과 뒤를 비추는 것처럼 읽을 수 있어. 다만 시편이 민수기 14장을 직접 인용했다고 단정할 필요는 없어.\n\n그래서 이 만남에서 보이는 것은 권능의 성격이야. 하나님의 큰 권능은 위협하는 힘으로만 드러나지 않고, 인자와 용서 안에서도 드러나. 그 권능을 믿는 사람의 응답은 오늘 들려오는 음성 앞에서 마음을 부드럽게 열어 두는 거야.\n\n### 오늘 붙잡을 한 줄\n깊은 곳까지 쥐신 하나님의 권능은 인자로 드러나니, 오늘 그분의 음성 앞에서 마음을 완고하게 하지 말자.\n\n## 오늘의 적용\n지금 가장 무겁게 느껴지는 일을 하나 정해, 원하는 해결책만 말하기 전에 하나님이 어떤 분이신지를 먼저 고백해 보자. ‘노하기를 더디 하시고 인자가 많으신 분’이라는 말씀에 기대어 기도하는 거야. 그리고 이미 알고 있으면서 미뤄 둔 순종이 있다면, 용서를 구하는 데서 끝내지 말고 바로잡을 수 있는 일 한 가지를 오늘 시작하자. 하나님은 용서하시면서도 우리 행동의 결과를 가볍게 다루지 않으시니까.\n\n## 짧은 기도\n크신 하나님, 땅의 깊은 곳과 산의 높은 곳까지 주의 손 안에 있음을 믿습니다. 주님의 권능이 인자와 용서로 나타남을 기억하게 하시고, 저의 연약함 앞에서 낙심하지 않게 하소서. 오늘 주님의 음성을 들을 때 마음을 완고하게 하지 않고, 알게 된 순종을 미루지 않게 하소서. 아멘.","v":[{"ref":"민수기 14:17","en":"Numbers 14:17","krv":"이제 구하옵나니 이미 말씀하신 대로 주의 큰 권능을 나타내옵소서 이르시기를","bsb":"So now I pray, may the power of my Lord be magnified, just as You have declared."},{"ref":"시편 95:4","en":"Psalm 95:4","krv":"땅의 깊은 곳이 그 위에 있으며 산들의 높은 것도 그의 것이로다","bsb":"In His hand are the depths of the earth, and the mountain peaks belong to Him."}],"src":[{"name":"Bible Gateway","title":"Numbers 14 (ESV)","url":"https://www.biblegateway.com/passage/?search=Numbers+14&version=ESV"},{"name":"Bible Gateway","title":"Psalm 95 (ESV)","url":"https://www.biblegateway.com/passage/?search=Psalm+95&version=ESV"}],"sha":"41da8e8aa4229a5ceedada34f4922bbc27c8632746b3887edd6f69590fc483a0"},{"date":"2026-10-28","title":"구한 것을 받은 줄로 믿는 기도, 기쁨이 충만해지는 구함","subtitle":"마가복음 11:24 · 요한복음 16:24","tagline":"기도는 두려움 속에서 애쓰는 일이 아니라, 아버지께 구하며 기쁨으로 나아가는 길이다.","body":"## 로중 묵상\n### 첫째 말씀 — 마가복음 11:24\n“그러므로 내가 너희에게 말하노니 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라 그리하면 너희에게 그대로 되리라”\n\n‘그러므로’라는 말에서 시작해 보자. 마가복음 11장에서 예수님은 무화과나무가 뿌리째 마른 것을 보고 놀란 베드로에게 “하나님을 믿으라”고 답하셔. 이 말씀은 기도를 소원 성취의 기술로 소개하려는 게 아니야. 하나님을 믿는 믿음이 기도의 바탕이라는 뜻이지. 같은 장에서 예수님은 성전을 ‘만민이 기도하는 집’이라고 부르시며 기도의 자리를 되찾으려 하셔. 기도는 처음부터 하나님과 맺는 관계 안에 있는 일이야.\n\n바로 다음 절인 25절이 그 방향을 더 분명하게 해. 서서 기도할 때 누구에게 품은 원망이 있으면 용서하라고 하시거든. 구하는 일과 용서하는 일이 한 호흡으로 이어져 있어. 그래서 24절의 “받은 줄로 믿으라”를 내 계획대로 되리라는 확신으로만 읽으면 문맥을 놓치게 돼. 하나님께 기도하는 사람이 하나님을 신뢰하며, 이웃과의 관계도 하나님 앞에 정리하려는 자리에서 들리는 말씀이야.\n\n### 둘째 말씀 — 요한복음 16:24\n“지금까지는 너희가 내 이름으로 아무 것도 구하지 아니하였으나 구하라 그리하면 받으리니 너희 기쁨이 충만하리라”\n\n이 말씀은 십자가를 앞둔 밤, 제자들에게 하신 작별의 가르침 가운데 있어. 예수님은 곧 떠나신다고 말씀하시고, 제자들의 마음은 근심으로 가득 차. 20절에서 예수님은 제자들이 울며 애통하겠지만 그 근심이 기쁨으로 바뀔 것이라고 하셔. 23절에는 그날에 아버지께 무엇을 구하든 내 이름으로 구하면 주신다는 약속이 나와.\n\n‘내 이름으로’는 마지막에 붙이는 주문이 아니야. 예수님과 연결되어, 예수님이 열어 주신 길로 아버지께 나아간다는 뜻이야. 그래서 24절의 초대는 단순해. 지금까지 해 보지 않았다면 이제 구하라는 거야. 그리고 구하는 이유가 기쁨의 충만이라고 하셔. 받는 것 자체보다, 아버지와 함께하는 자리에서 누리는 기쁨이 끝에 놓여 있어.\n\n### 두 말씀이 만나는 지점\n두 말씀은 모두 기도를 ‘구하라’는 명령과 ‘받는다’는 약속으로 묶어 놓아. 다만 마가복음은 기도하는 사람의 믿음과 용서의 태도를 살피게 하고, 요한복음은 기도가 향하는 곳이 아버지이며 그 길이 예수님의 이름이라는 점을 보게 해. 두 본문이 같은 방향을 가리키는 건 맞지만, 한 본문의 약속을 다른 본문에 그대로 옮겨 붙여 모든 기도가 내 바람대로 이뤄진다는 보증으로 삼을 수는 없어.\n\n그래서 이 만남에서 보이는 것은 기도의 자리야. 의심을 이기려는 힘겨루기도, 근심을 감추는 연습도 아니고, 아버지께 구하는 일을 시작해도 된다는 초대야. 믿음은 결과를 미리 쥐는 일이 아니라, 하나님이 들으신다는 사실 위에 서는 일이고, 그 끝에는 기쁨이 약속되어 있어.\n\n### 오늘 붙잡을 한 줄\n아버지께 구하는 일을 미루지 말자. 그 기도는 믿음 위에서 시작되고, 기쁨으로 이어진다.\n\n## 오늘의 적용\n오늘 마음에 걸리는 일을 한 문장으로 적어 아버지께 그대로 구해 보자. 이미 이뤄 주셨다고 우기기보다, 들으시는 분께 맡긴다는 마음으로 말씀드리는 거야. 그 전에 마음에 쌓아 둔 서운함이 떠오르는 사람이 있다면, 오늘 기도 중에 이름을 불러 놓고 용서하는 쪽으로 한 걸음 내딛어 보자. 응답이 어떤 모양으로 오든, 구하고 난 뒤에는 기도 끝에 이 한 줄을 덧붙이자. “아버지, 주신 대로 받겠습니다.”\n\n## 짧은 기도\n아버지 하나님, 제가 구할 것을 이미 아시는 주님께 나아갑니다. 예수님의 이름으로 담대히 구하게 하시고, 구하는 마음 가운데 누군가를 향한 원망이 있다면 먼저 내려놓게 하소서. 응답을 제 뜻대로 붙들려 하지 않고, 주님이 들으신다는 사실 위에 서게 하소서. 근심이 깊은 날에도 주님과 함께하는 기쁨을 맛보게 하소서. 아멘.","v":[{"ref":"마가복음 11:24","en":"Mark 11:24","krv":"그러므로 내가 너희에게 말하노니 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라 그리하면 너희에게 그대로 되리라","bsb":"Whatever you ask for in prayer, believe that you have received it, and it will be yours."},{"ref":"요한복음 16:24","en":"John 16:24","krv":"지금까지는 너희가 내 이름으로 아무 것도 구하지 아니하였으나 구하라 그리하면 받으리니 너희 기쁨이 충만하리라","bsb":"Ask and you will receive, so that your joy may be complete."}],"src":[{"name":"Bible Gateway","title":"Mark 11 (ESV)","url":"https://www.biblegateway.com/passage/?search=Mark+11&version=ESV"},{"name":"Bible Gateway","title":"John 16 (ESV)","url":"https://www.biblegateway.com/passage/?search=John+16&version=ESV"}],"sha":"42c2a6d281a8c57f3f8b622b3496488bce37984fc0d1f7c71d4b4d604d254531"},{"date":"2026-10-29","title":"돌아오라는 부름, 고치시는 사랑","subtitle":"예레미야 3:22 · 호세아 14:4","tagline":"먼저 부르시는 하나님께 돌아서서 대답하면, 고치시는 일은 그분이 기꺼이 이루신다.","body":"## 로중 묵상\n### 첫째 말씀 — 예레미야 3:22\n“배역한 자식들아 돌아오라 내가 너희의 배역함을 고치리라 보소서 우리가 주께 왔사오니 주는 우리 하나님 여호와이심이니이다”\n\n‘배역’은 등을 돌리고 떠났다는 말이야. 예레미야 3장은 이스라엘이 높은 산과 푸른 나무 아래서 다른 신들을 쫓은 일을 고발하는 것으로 시작해. 그런데 12절과 14절에서 하나님은 정죄로 끝내지 않고 “돌아오라”고 거듭 부르시고, 자신이 긍휼이 많은 분이라서 영원히 노하지 않겠다고 말씀하셔. 22절은 그 부름 뒤에 이어지는 말이야. 하나님이 먼저 “돌아오라, 내가 고치리라” 하시고, 백성의 입에서 “우리가 주께 왔사오니 주는 우리 하나님이시니이다”라는 대답이 나와.\n\n바로 뒤 23~25절에서 그 대답은 구체적인 고백이 돼. 산 위의 제사는 헛된 것이었고, 자기들이 수치 속에 누워 있다는 거야. 그러니까 22절의 ‘돌아옴’은 기분이 좋아져서 하는 말이 아니라, 떠나 있던 길이 거짓이었음을 인정하는 자리에서 나온 말이야.\n\n### 둘째 말씀 — 호세아 14:4\n“내가 저희의 패역을 고치고 즐거이 저희를 사랑하리니 나의 진노가 저에게서 떠났음이니라”\n\n호세아 14장은 “이스라엘아 네 하나님 여호와께로 돌아오라”는 부름으로 열려. 2절에서 하나님은 돌아올 때 빈손으로 오지 말고 ‘말씀을 가지고’ 오라고 하시고, 그 말은 “모든 불의를 제하시고 선한 것을 받으소서”라는 기도야. 3절에는 앗수르가 우리를 구원하지 못하고, 손으로 만든 것에게 다시는 “우리 신이라” 하지 않겠다는 다짐이 이어져. 의지하던 것을 내려놓는 고백이지.\n\n4절은 거기에 대한 하나님의 답이야. 고쳐 주시겠다는 말씀 뒤에 “즐거이 사랑하리니”가 붙어. 마지못해 받아 주시는 게 아니라, 값없이, 기꺼이 사랑하시겠다는 뜻이야. 그 이유는 “나의 진노가 떠났음이니라”로 설명돼. 이 사랑은 백성이 얼마나 잘 돌아오느냐에 기대지 않고, 이미 거두어진 진노 위에 서 있어.\n\n### 두 말씀이 만나는 지점\n두 본문은 둘 다 돌아옴을 말하는데, 그 순서가 닮았어. 하나님이 먼저 부르시고, 백성이 고백하며 돌아오고, 하나님이 고치시겠다고 답하셔. 그리고 두 말씀 모두 “고치리라”는 같은 약속을 담고 있어. 예레미야는 돌아오는 사람의 입으로 ‘주는 우리 하나님이시니이다’를 말하게 하고, 호세아는 돌아오는 사람을 향한 하나님의 마음이 기쁨이라는 점을 보여 줘. 다만 두 책은 서로 다른 때와 말씀이니, 한쪽을 다른 쪽의 해설로 못 박을 필요는 없어.\n\n그래서 이 만남에서 보이는 것은 돌아옴의 무게중심이야. 돌아오는 일은 내가 얼마나 반듯해졌는지를 증명하는 시험이 아니라, 이미 부르고 계신 분께 “주는 우리 하나님이시니이다” 하고 대답하는 일이야. 고치는 일은 그분이 하시겠다고 하셔.\n\n### 오늘 붙잡을 한 줄\n부르시는 하나님께 대답하길 원합니다. 돌아선 저를 고치시니, 주는 나의 하나님이십니다.\n\n## 오늘의 적용\n요즘 내가 은근히 의지하면서 하나님 자리에 올려 둔 것이 무엇인지 한 가지만 떠올려 보자. 사람의 평가일 수도, 통장 잔고일 수도, 내 계획이 틀어지지 않으리라는 자신감일 수도 있어. 호세아 14장 2~3절처럼 그것을 소리 내어 말씀드리고 “이것을 내려놓습니다” 하고 아뢰어 보자. 그리고 나를 고치시겠다고 하신 약속을 한 번 소리 내어 읽고, 오늘 하루는 스스로를 고치려는 조급함보다 그분께 돌아서는 한 걸음을 먼저 선택하자.\n\n## 짧은 기도\n고치시는 하나님, 떠나 있던 저를 먼저 불러 주셔서 감사합니다. 제가 기대어 온 헛된 것들을 내려놓고 주님께 돌아섭니다. 주님은 저의 하나님입니다. 저의 패역을 고쳐 주시고, 기꺼이 사랑하신다는 말씀을 오늘 하루 제 마음에 새기게 하소서. 아멘.","v":[{"ref":"예레미야 3:22","en":"Jeremiah 3:22","krv":"배역한 자식들아 돌아오라 내가 너희의 배역함을 고치리라 보소서 우리가 주께 왔사오니 주는 우리 하나님 여호와이심이니이다","bsb":"“Return, O faithless children, and I will heal your faithlessness.” “Here we are. We come to You, for You are the LO
