RD our God.”"},{"ref":"호세아 14:4","en":"Hosea 14:4","krv":"내가 저희의 패역을 고치고 즐거이 저희를 사랑하리니 나의 진노가 저에게서 떠났음이니라","bsb":"I will heal their apostasy; I will freely love them, for My anger has turned away from them."}],"src":[{"name":"Bible Gateway","title":"Jeremiah 3 (ESV)","url":"https://www.biblegateway.com/passage/?search=Jeremiah+3&version=ESV"},{"name":"Bible Gateway","title":"Hosea 14 (ESV)","url":"https://www.biblegateway.com/passage/?search=Hosea+14&version=ESV"}],"sha":"0cfa49c553660e13b3348cdbd5cbd6670cbb42e7162c628e21fe4920ef613948"}];

      ctx.textAlign = refAlign; ctx.fillStyle = T.ref; ctx.font = L.enRefFont; ctx.fillText(b.v.en, rx, b.enRefY);
    });
    /* one-line takeaway */
    if (L.tl.length) {
      if (S.tagRule) { ctx.fillStyle = T.ink; ctx.fillRect(ruleX, L.tagTop, ruleW, S.tagRule); }
      ctx.textAlign = center ? 'center' : 'left'; ctx.fillStyle = T.ink; ctx.font = L.tagFont;
      L.tl.forEach(function (l, i) { ctx.fillText(l, ax, L.tagTop + S.tagRule + S.tagPad + i * L.tagLH + baselineIn(L.fTag, L.tagLH)); });
    }
    /* credits (kept on every card) */
    ctx.textAlign = center ? 'center' : 'left'; ctx.fillStyle = T.foot; ctx.font = L.credFont;
    ctx.fillText('Selection: The Word (Bible 2.0)  ·  Texts: KRV (1961) / BSB', ax, L.credTop + baselineIn(L.fCred, L.credLH));
    ctx.fillText('Association of Bible references by project “Bible 2.0”', ax, L.credTop + L.credLH + baselineIn(L.fCred, L.credLH));
  }

  function cardTheme(iso) {
    var key = themeFor(iso), T = THEMES[key]; T.key = key; return T;
  }

  function renderCardToPngBlob(e) {
    return new Promise(function (resolve, reject) {
      if (!e.v.every(function (v) { return v.krv && v.krv.trim() && v.bsb && v.bsb.trim(); })) { reject(new Error('missing_text')); return; }
      var cv = document.createElement('canvas'); cv.width = CARD_W; cv.height = CARD_H;
      var ctx = cv.getContext('2d');
      var T = cardTheme(e.date), p = e.date.split('-').map(Number), dow = ymdUTC(p[0], p[1], p[2]).getUTCDay();
      e.__tag = cardTag(e);
      var L = chooseLayout(ctx, e, T);
      if (!L) { reject(new Error('too_long')); return; }
      Promise.all(T.svgs.map(function (sv) { return svgImage(sv.xml); })).then(function (imgs) {
        drawCard(ctx, e, T, L, imgs, dow);
        if (cv.toBlob) cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('blob')); }, 'image/png');
        else reject(new Error('blob'));
      });
    });
  }

  function fontsReady(e) {
    var tasks = [];
    if (document.fonts && document.fonts.load) {
      var ko = e.v.map(function (v) { return v.krv + v.ref; }).join(' ');
      var en = e.v.map(function (v) { return v.bsb + v.en; }).join(' ');
      var tag = cardTag(e);
      tasks = [
        document.fonts.load('600 40px "Noto Serif KR"', ko + ' 0123456789.'),
        document.fonts.load('500 40px "Noto Serif KR"', ko + ' 0123456789.' + tag),
        document.fonts.load('italic 400 30px "Noto Serif"', en),
        document.fonts.load('700 20px "Noto Sans KR"', '0123456789.' + ko + en),
        document.fonts.load('500 17px "Noto Sans KR"', 'Selection: The Word (Bible 2.0) Texts KRV BSB Association of Bible references by project “Bible 2.0”')
      ];
    }
    var all = Promise.all(tasks).then(function () { return document.fonts ? document.fonts.ready : null; }, function () { return null; });
    var timeout = new Promise(function (r) { setTimeout(r, 4000); });
    return Promise.race([all, timeout]);
  }

  /* ---------- prepared-file share flow ---------- */
  var shareBtn = $('share'), shareLabel = $('shareLabel');
  var preparedFile = null, preparedURL = null, generation = 0, sharing = false, dl = null;

  function setShareReady(ready) {
    shareBtn.disabled = !ready || sharing;
    shareLabel.textContent = ready ? '공유' : '카드 준비 중';
  }
  function prepareCard(e) {
    var current = ++generation;
    preparedFile = null;
    if (preparedURL) { URL.revokeObjectURL(preparedURL); preparedURL = null; }
    setShareReady(false); setStatus('');
    fontsReady(e).then(function () { return renderCardToPngBlob(e); }).then(function (blob) {
      if (current !== generation) return;
      if (!blob || blob.type !== 'image/png') throw new Error('PNG 생성 실패');
      preparedFile = new File([blob], 'daily-divine-' + e.date + '.png', { type: 'image/png' });
      setShareReady(true);
    }).catch(function (err) {
      if (current !== generation) return;
      setShareReady(false);
      if (err && err.message === 'too_long') setStatus('성구가 길어 4:5 카드에 다 들어가지 않아요(최소 글자 크기·간격까지 줄여도). 카드를 만들지 않았어요.', true);
      else if (err && err.message === 'missing_text') setStatus('개역한글이나 BSB 원문이 비어 있어 카드를 만들지 않았어요.', true);
      else setStatus('카드를 만들지 못했어요. 날짜를 다시 골라 주세요.', true);
    });
  }

  function showPngSaveFallback(file, msg) {
    if (!preparedURL) preparedURL = URL.createObjectURL(file);
    $('cardImg').src = preparedURL;
    $('saveMsg').textContent = msg || '이 화면에서는 공유창을 바로 열 수 없어요. 이렇게 보내 주세요.';
    $('savePanel').hidden = false;
    $('savePanel').scrollIntoView({ block: 'nearest' });
  }
  function saveViaDownloads(file) {
    return dl.save({ filename: file.name, data: file });
  }
  function plainDownload(file) {
    if (!preparedURL) preparedURL = URL.createObjectURL(file);
    var a = document.createElement('a'); a.href = preparedURL; a.download = file.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  shareBtn.addEventListener('click', function () {
    var file = preparedFile;
    if (!file || sharing) return;
    var canFileShare = false;
    try { canFileShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (x) { canFileShare = false; }

    sharing = true; shareBtn.disabled = true;
    var finish = function () { sharing = false; shareBtn.disabled = !preparedFile; };
    var p;
    if (canFileShare) {
      /* standalone HTTPS page: open the OS share sheet right away with the prepared file */
      p = navigator.share({ files: [file] }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (dl) return saveViaDownloads(file).catch(function (e2) { if (!e2 || e2.code !== 'declined') showPngSaveFallback(file); });
        showPngSaveFallback(file);
      });
    } else if (dl) {
      /* inside Claude: hand the PNG to the platform save (share sheet in the Claude iOS app) */
      p = saveViaDownloads(file).catch(function (err) {
        if (err && err.code === 'declined') return;
        showPngSaveFallback(file);
      });
    } else {
      showPngSaveFallback(file);
      p = Promise.resolve();
    }
    p.then(finish, finish);
  });

  $('savePng').addEventListener('click', function () {
    var file = preparedFile; if (!file) return;
    if (dl) {
      saveViaDownloads(file).then(function () { toast('PNG를 넘겼어요.'); }, function (err) {
        if (err && err.code === 'declined') return;
        $('saveMsg').textContent = '저장이 막혀 있어요. 위 이미지를 길게 눌러 사진에 저장해 주세요.';
      });
    } else {
      plainDownload(file);
    }
  });
  $('closeSave').addEventListener('click', function () { $('savePanel').hidden = true; });

  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (ns) { dl = ns || null; }, function () { dl = null; });
    }
  } catch (x) { dl = null; }

  /* ---------- wiring ---------- */
  if (!dates.length) {
    $('entry').textContent = ''; $('entry').appendChild(el('p', 'empty', '불러올 말씀이 없어요.'));
    shareLabel.textContent = '공유'; return;
  }
  var sel = $('pick');
  dates.slice().reverse().forEach(function (d) {
    var o = document.createElement('option'); o.value = d; o.textContent = dotDate(d.slice(5)) + ' · ' + byDate[d].title; sel.appendChild(o);
  });
  sel.addEventListener('change', function () { render(sel.value, true); window.scrollTo(0, 0); });
  $('prev').addEventListener('click', function () { var i = dates.indexOf(cur); if (i > 0) render(dates[i - 1], true); });
  $('next').addEventListener('click', function () { var i = dates.indexOf(cur); if (i < dates.length - 1) render(dates[i + 1], true); });
  $('today').addEventListener('click', function () { var t = seoulToday(); render(byDate[t] ? t : latestUpTo(t), true); });
  $('copyShort').addEventListener('click', function () { copyText(shortText(byDate[cur]), '말씀과 한 줄을'); });
  $('copyFull').addEventListener('click', function () { copyText(fullText(byDate[cur]), '묵상 전체를'); });
  $('closeManual').addEventListener('click', function () { $('manualPanel').hidden = true; });
  $('selectAll').addEventListener('click', function () { var t = $('manualText'); t.focus(); t.select(); });

  (function () {
    var f = $('foot'); f.textContent = '';
    f.appendChild(document.createTextNode('성구 선정: The Word (Bible 2.0). Association of Bible references by project “Bible 2.0” ('));
    var a = document.createElement('a'); a.href = 'https://bible2.net'; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'bible2.net'; f.appendChild(a);
    f.appendChild(document.createTextNode('). English text: Berean Standard Bible (BSB), dedicated to the public domain (berean.bible).'));
  })();
  render(pickInitial(), false);
})();
</script>
