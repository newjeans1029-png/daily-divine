<style>
/* Layout: a single reading column on ivory paper with the card's green rule down the left edge.
   Order follows the card: date, the two words (KRV large, BSB italic, references right-aligned), then the meditation. */
:root {
  --paper: #f3efe7;
  --sheet: #faf8f3;
  --ink: #1f2724;
  --muted: #6b716b;
  --rule: #ddd6c9;
  --green: #173d33;
  --green-ink: #2c5a4b;
  --on-green: #f3efe7;
  --ochre: #8a6340;
  --ochre-soft: #efe5d4;
  --warn: #9a4b16;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --serif-en: "Noto Serif", "Noto Serif KR", Georgia, serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #181714; --sheet: #211f1b; --ink: #ddd8ce; --muted: #9e988d; --rule: #3b3832;
    --green: #2f6b58; --green-ink: #8cc2ab; --on-green: #f3efe7; --ochre: #c9a27a; --ochre-soft: #2a251e; --warn: #f0a46e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #181714; --sheet: #211f1b; --ink: #ddd8ce; --muted: #9e988d; --rule: #3b3832;
  --green: #2f6b58; --green-ink: #8cc2ab; --on-green: #f3efe7; --ochre: #c9a27a; --ochre-soft: #2a251e; --warn: #f0a46e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.8;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 64px;
  word-break: keep-all; overflow-wrap: break-word;
}
body::after { content: ""; position: fixed; top: 0; bottom: 0; left: 0; width: 6px; background: var(--green); pointer-events: none; }
.page { max-width: 620px; margin: 0 auto; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* masthead */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 14px; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 17px; letter-spacing: .01em; color: var(--green-ink); }
.share-btn { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px 0 13px; border: 0; border-radius: 20px; background: var(--green); color: var(--on-green); cursor: pointer; font-size: 14px; font-weight: 500; }
.share-btn svg { width: 17px; height: 17px; }
.share-btn:disabled { opacity: .5; cursor: default; }

/* date block */
.dateblock { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px 12px; padding: 18px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.daybig { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.dateline { margin: 8px 0 0; font-size: 13.5px; color: var(--ochre); font-weight: 500; letter-spacing: .02em; }
.steps { display: flex; gap: 6px; }
.round { width: 40px; height: 40px; border: 1px solid var(--rule); border-radius: 50%; background: var(--sheet); cursor: pointer; font-size: 15px; line-height: 1; }
.round:disabled { opacity: .35; cursor: default; }
.jump { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.jump select { flex: 1; min-width: 0; height: 36px; padding: 0 30px 0 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); font-size: 13.5px; color: var(--muted); appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.chip { flex: none; height: 36px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 18px; background: transparent; cursor: pointer; font-size: 13.5px; color: var(--green-ink); font-weight: 500; }
.status { min-height: 0; margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.status:empty { display: none; }
.status.err { color: var(--warn); }

/* the two words */
.verses { padding: 26px 0 8px; }
.word + .word { margin-top: 26px; padding-top: 26px; position: relative; }
.word + .word::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--rule); }
.krv { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.7; }
.ref { margin: 10px 0 0; text-align: right; font-size: 13px; font-weight: 700; color: var(--ochre); letter-spacing: .02em; }
.esv { margin: 12px 0 0; font-family: var(--serif-en); font-style: italic; font-size: 16.5px; line-height: 1.65; color: var(--muted); word-break: normal; }
.esv.missing { font-family: var(--sans); font-style: normal; font-size: 14px; color: var(--warn); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 0 6px; }
.btn { min-height: 40px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 20px; background: var(--sheet); cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink); }

.panel { margin: 14px 0 6px; padding: 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.panel img { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto 12px; border-radius: 4px; box-shadow: 0 1px 0 var(--rule); }
.panel p { margin: 0 0 10px; font-size: 14px; color: var(--muted); line-height: 1.65; }
.panel ol { margin: 0 0 12px; padding-left: 1.3em; font-size: 14px; line-height: 1.7; }
.panel textarea { width: 100%; min-height: 180px; padding: 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.6; }
.panel .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* meditation */
.med { margin-top: 30px; padding-top: 28px; border-top: 2px solid var(--ink); }
.eyebrow { margin: 0 0 10px; font-size: 12.5px; font-weight: 700; letter-spacing: .14em; color: var(--ochre); }
h1 { margin: 0 0 10px; font-family: var(--serif); font-weight: 700; font-size: 27px; line-height: 1.45; text-wrap: balance; }
.tagline { margin: 0 0 6px; font-family: var(--serif); font-size: 16.5px; line-height: 1.75; color: var(--muted); }
.body { font-family: var(--serif); font-size: 17px; line-height: 1.95; }
.body h2 { display: flex; align-items: center; gap: 12px; margin: 38px 0 14px; font-family: var(--sans); font-size: 12.5px; font-weight: 700; letter-spacing: .14em; color: var(--ochre); }
.body h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.body h3 { margin: 26px 0 8px; font-size: 18px; font-weight: 600; line-height: 1.55; color: var(--green-ink); }
.body p { margin: 0 0 16px; }
.body blockquote { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--rule); color: var(--muted); }
.body blockquote p { margin: 0; }
.keyline { margin: 4px 0 18px !important; padding: 4px 0 4px 18px; border-left: 3px solid var(--ochre); font-size: 19px; font-weight: 600; line-height: 1.7; }
.prayer { padding: 18px 20px; border-radius: 10px; background: var(--ochre-soft); }

.sources { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); }
.sources h2 { margin: 0 0 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .14em; color: var(--ochre); }
.sources ul { margin: 0; padding-left: 1.1em; font-size: 13.5px; line-height: 1.75; color: var(--muted); }
.sources a, .foot a { color: var(--green-ink); }
.foot { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.empty { margin: 40px 0; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 14px; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (min-width: 560px) { .daybig { font-size: 54px; } .krv { font-size: 23px; } h1 { font-size: 30px; } }
</style>

<div class="page">
  <header class="mast">
    <span class="brand">Daily Divine</span>
    <button class="share-btn" id="share" disabled aria-label="말씀 카드 공유">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>

    <div class="actions">

    <div class="panel" id="manualPanel" hidden>
      <p>자동 복사가 막혀 있어요. 아래 글을 선택해 직접 복사해 주세요.</p>
      <textarea id="manualText" readonly></textarea>
      <div class="row"><button class="btn" id="selectAll">전체 선택</button><button class="btn" id="closeManual">닫기</button></div>
    </div>

    <section class="med" aria-label="오늘의 묵상">
      <p class="eyebrow">오늘의 묵상</p>

      <div class="body" id="body"></div>

    <section class="sources" id="sources" aria-label="출처"><h2>출처</h2><ul id="srcList"></ul></section>

  <p class="foot" id="foot"></p>
</div>

<script>
var D = [{"date":"2026-08-22","title":"말씀을 노래하는 혀","subtitle":"시편 119:172 · 야고보서 3:10","tagline":"하나님의 말씀을 노래하는 혀라면, 같은 입으로 사람을 해치는 말을 내보내는 모순을 가볍게 넘길 수 없다.","body":"시편 기자는 하나님의 모든 계명이 의롭기 때문에 자신의 혀가 말씀을 노래할 것이라 말한다. 말씀을 안다는 것은 생각 속에만 머무는 일이 아니다. 혀가 무엇을 반복하고 누구를 높이며 어떤 말을 내보내는지까지 신앙의 자리로 들어온다.\n\n야고보는 더 날카롭게 같은 입에서 찬송과 저주가 나온다고 지적한다. 여기서 문제는 말투의 세련됨보다 예배와 삶이 갈라지는 모순이다. 하나님을 찬송하는 입으로 하나님의 형상대로 지음 받은 사람을 깎아내린다면, 입술의 고백과 일상의 언어가 서로 다른 방향을 향한다.\n\n두 말씀을 함께 읽으면 혀를 통제한다는 것은 언제나 좋은 말만 하라는 주문이 아니다. 진실을 말하되 멸시하지 않고, 잘못을 지적하되 상대를 무너뜨리는 쾌감에 기대지 않으며, 분노가 말을 무기로 만들려 할 때는 침묵할 줄 아는 훈련에 가깝다. 말씀을 노래하는 혀는 동시에 이웃을 향한 말도 말씀 아래에 두려 한다.\n\n오늘 한 문장을 고르자. 보내기 전의 메시지든, 입 밖으로 내기 직전의 말이든, ‘이 말을 한 뒤에도 같은 입으로 하나님을 찬송할 수 있는가’를 물어보자. 이미 상처를 남긴 말이 있다면 변명보다 짧은 사과를 먼저 건네고, 누군가에게 한 문장의 감사나 축복을 의식적으로 건네도 좋다.\n\n기도 — 하나님, 주님의 말씀을 노래하면서 같은 입으로 사람을 해치는 모순을 가볍게 여기지 않게 하소서. 진실하되 잔인하지 않고, 분명하되 교만하지 않은 말을 배우게 하시며, 오늘 제 입술이 주님과 이웃을 함께 섬기게 하소서. 아멘.","v":[{"ref":"말라기 4:5","en":"Malachi 4:5","krv":"보라 여호와의 크고 두려운 날이 이르기 전에 내가 선지 엘리야를 너희에게 보내리니","bsb":"Behold, I will send you Elijah the prophet before the coming of the great and awesome Day of the LORD."},{"ref":"베드로후서 3:13","en":"2 Peter 3:13","krv":"우리는 그의 약속대로 의의 거하는 바 새 하늘과 새 땅을 바라보도다","bsb":"In keeping with God’s promise, we are looking forward to a new heaven and a new earth, where righteousness dwells."}],"src":[{"name":"Evangelische Landeskirche in Württemberg","title":"Losung und Lehrtext · 22.08.2026","url":"https://www.elk-wue.de/glauben/kalenderblatt?cHash=bb0b9f795a51b87fd1fd331529e7437d&tx_sudhaus7newspage_pluginlist%5Bcontroller%5D=Plugin&tx_sudhaus7newspage_pluginlist%5Bpage%5D=6"}],"sha":"c9e061a17ab1399e5856038ebd6727e0f6fc46c4ce754e20c5a35f2abeffebc0"},{"date":"2026-08-23","title":"쉼은 명령이면서 선물이다","subtitle":"출애굽기 20:9–10 · 마가복음 2:27","tagline":"일이 남아 있어도 멈출 수 있는 것은, 세상을 붙들고 계신 분이 내가 아니라 하나님이시기 때문이다.","body":"하나님은 엿새 동안 힘써 일하라고 하시면서도, 제칠일에는 일을 멈추라고 명하신다. 노동을 하찮게 여기셔서가 아니다. 일에는 자리가 있지만 한계도 있기 때문이다. 안식일에 손을 놓는 행위는 세상이 내 수고만으로 유지되지 않으며, 내가 멈추어도 하나님은 여전히 하나님이심을 인정하는 믿음의 고백이다.\n\n그러나 사람은 쉼마저 의무의 목록으로 바꾸기 쉽다. 예수님 시대의 종교 지도자들은 안식일을 사람을 살리는 선물보다 사람을 판정하는 잣대로 만들었다. 예수님은 “안식일은 사람을 위하여 있는 것”이라고 말씀하시며 계명의 본뜻을 되찾아 주신다. 하나님이 주시는 안식은 우리를 억누르는 또 하나의 과제가 아니라, 예배하고 회복하며 이웃을 돌아보도록 마련된 은혜의 자리다.\n\n두 말씀은 충실히 일하는 삶과 기꺼이 쉬는 삶을 함께 가르친다. 일이 모두 끝난 뒤에야 쉴 수 있다면 우리는 영원히 쉬지 못한다. 해야 할 일은 언제나 남기 때문이다. 성경의 안식은 모든 것을 통제한 사람에게 주어지는 보상이 아니라, 아직 일이 남아 있어도 하나님의 돌보심을 믿으며 받는 선물이다.\n\n오늘은 미완성인 일 하나를 그대로 내려놓아도 좋다. 예배 앞에서 성취로 자신을 증명하려는 마음을 멈추고, 몸의 피로를 인정하며, 가족과 이웃을 한 사람으로 바라보자. 쉼의 목적은 아무것도 하지 않는 데 있지 않다. 내가 한 일보다 나를 지으시고 구원하신 하나님께 다시 시선을 돌리는 데 있다.\n\n기도 — 하나님, 해야 할 일에 충실하게 하시되 일의 주인이 된 것처럼 살지 않게 하소서. 멈추는 것을 불안해하는 마음을 내려놓고, 안식을 명령이자 선물로 받게 하소서. 오늘의 예배와 쉼 속에서 내가 주님의 것임을 다시 기억하게 하소서. 아멘.","v":[{"ref":"출애굽기 20:9-10","en":"Exodus 20:9-10","krv":"엿새 동안은 힘써 네 모든 일을 행할 것이나 제칠일은 너의 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 육축이나 네 문안에 유하는 객이라도 아무 일도 하지 말라","bsb":"Six days you shall labor and do all your work, but the seventh day is a Sabbath to the LORD your God, on which you must not do any work."},{"ref":"마가복음 2:27","en":"Mark 2:27","krv":"또 가라사대 안식일은 사람을 위하여 있는 것이요 사람이 안식일을 위하여 있는 것이 아니니","bsb":"The Sabbath was made for man, not man for the Sabbath."}],"src":[],"sha":"678be7381f5c2caa7b7818d46bc12d2b95815599a6517fa98bc0683ca677d0e7"},{"date":"2026-08-24","title":"말의 능력이 아니라 하나님의 능력","subtitle":"출애굽기 4:10 · 고린도전서 4:20","tagline":"내가 충분히 능숙해서 하나님께 쓰임받는 것이 아니라, 부족한 나를 통해서도 하나님이 실제로 일하실 수 있다.","body":"## 로중 묵상\n### 첫째 말씀 — 출애굽기 4:10\n모세는 하나님의 부르심 앞에서 “나는 본래 말에 능치 못한 자”라고 하며 물러서려 한다. 본문이 직접 말하는 것은 모세가 자신을 말에 능하지 못한 사람으로 여겼다는 사실이다. 이것을 특정한 언어장애로 단정할 필요는 없다.\n\n중요한 것은 이어지는 하나님의 대답이다. 하나님은 모세의 자기평가를 논박하기보다 사람의 입을 지으신 분이 누구인가를 되물으시고, “내가 네 입과 함께 있어서 할 말을 가르치리라”고 약속하신다. 부르심의 성패가 모세의 언변에 달려 있지 않다는 뜻이다. 그렇다고 모세의 실제 약함이 무시되는 것도 아니다. 하나님은 아론을 붙여 주심으로 그 약함을 구체적으로 고려하신다. 부족함을 없다고 하지 않으면서도, 그것을 하나님의 부르심보다 크게 만들지 않으신다.\n\n### 둘째 말씀 — 고린도전서 4:20\n고린도 교회에서는 스스로 높아져 말과 지혜를 과시하는 사람들이 있었다. 바울은 그들의 말이 얼마나 인상적인지를 겨루지 않고, 실제 능력을 보겠다고 한다. “하나님의 나라는 말에 있지 아니하고 오직 능력에 있음이라”는 선언은 화려한 주장만 있고 복음의 열매가 없는 신앙을 겨냥한다.\n\n여기서 ‘능력’을 기적이나 초자연적 현상으로만 좁혀 읽을 필요는 없다. 문맥상 그것은 하나님의 통치가 사람과 공동체 안에서 실제로 나타내는 효력까지 포함한다. 교만을 낮추고, 죄를 다루며, 공동체를 거룩하게 세우는 변화다. 말 자체가 무가치한 것이 아니라, 말의 진실성은 그 말이 맺는 열매로 드러난다.\n\n### 두 말씀이 만나는 지점\n모세는 “나는 말을 잘하지 못합니다”라고 두려워하고, 고린도 사람들은 말의 능숙함으로 자신을 높인다. 두 본문은 서로 반대편에서 같은 착각을 드러낸다. 하나님의 일은 사람의 표현력이 부족하다고 막히지도 않고, 표현력이 뛰어나다고 이루어지지도 않는다. 최종 근거는 부르시고 함께하시는 하나님 자신에게 있다.\n\n이것이 준비나 말의 책임을 가볍게 여기라는 뜻은 아니다. 모세는 결국 가서 말해야 했고, 바울도 복음을 분명한 언어로 전했다. 필요한 준비는 충실히 하되, 결과를 보장하는 힘까지 내 능숙함에서 찾지 않는 것이 두 말씀이 가리키는 믿음이다.\n\n### 오늘 붙잡을 한 줄\n내가 충분히 능숙해서 하나님께 쓰임받는 것이 아니라, 부족한 나를 통해서도 하나님이 실제로 일하실 수 있다.\n\n## 오늘의 적용\n오늘 해야 할 일을 앞두고 “내가 이것을 잘할 수 있는가?”만 묻지 않고, “하나님 앞에서 충실하게 해야 할 일은 무엇인가?”를 먼저 묻자. 말해야 할 내용은 책임 있게 준비하되, 완벽한 표현으로 자신을 증명하려는 마음은 내려놓자. 내가 한 말이 실제로 사람을 살리고 공동체를 세우는 열매로 이어지는지도 돌아보자.\n\n## 짧은 기도\n하나님, 제 능력과 말솜씨를 의지하지 않게 하시고, 부족한 가운데서도 함께하시는 주님의 능력을 신뢰하게 하소서. 해야 할 말과 일을 충실히 준비하되 그것으로 저를 높이지 않게 하시며, 제 말과 삶이 복음의 실제 열매를 맺게 하소서. 아멘.","v":[{"ref":"출애굽기 4:10","en":"Exodus 4:10","krv":"모세가 여호와께 고하되 주여 나는 본래 말에 능치 못한 자라 주께서 주의 종에게 명하신 후에도 그러하니 나는 입이 뻣뻣하고 혀가 둔한 자니이다","bsb":"“Please, Lord,” Moses replied, “I have never been eloquent, neither in the past nor since You have spoken to Your servant.”"},{"ref":"고린도전서 4:20","en":"1 Corinthians 4:20","krv":"하나님의 나라는 말에 있지 아니하고 오직 능력에 있음이라","bsb":"The kingdom of God is not a matter of talk but of power."}],"src":[{"name":"Daily Divine","title":"2026-08-24 오늘의 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"ee669f316db3a1467ccacb9dba8a49e9be6c5bb7464ece8e5d8e080550d883d6"},{"date":"2026-08-25","title":"말씀대로 살기를 기뻐하는 종","subtitle":"시편 40:8 · 누가복음 1:38","tagline":"하나님의 뜻을 다 이해한 뒤 따르는 것이 아니라, 말씀하신 하나님을 신뢰하기에 오늘 순종한다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 40:8\n시편 40편의 화자는 깊은 웅덩이에서 건지신 하나님을 찬양한 뒤, 제사와 예물만으로는 하나님의 뜻에 응답할 수 없음을 말한다. 이어 “내가 왔나이다”라고 자신을 내어놓으며, 하나님의 뜻 행하기를 즐거워하고 그 법이 마음속에 있다고 고백한다. 순종이 바깥에서 억지로 눌러오는 명령에 머물지 않고, 구원하신 하나님께 마음으로 응답하는 일이 된 것이다.\n\n“즐기오니”를 모든 순종이 감정적으로 늘 즐겁다는 뜻으로 좁혀서는 안 된다. 이 시편에도 고난과 죄, 대적에 대한 탄식이 함께 있다. 기쁨은 어려움이 사라진 상태라기보다, 하나님의 뜻을 선한 것으로 받아들이고 그 뜻에 자신의 방향을 맞추는 마음을 가리킨다. 또한 제사를 무가치하다고 선언한다기보다, 예배의 행위와 삶의 순종이 갈라질 수 없음을 드러낸다.\n\n### 둘째 말씀 — 누가복음 1:38\n마리아는 가브리엘에게서 자신이 아들을 낳고 그가 다윗의 왕위를 이어 영원히 다스릴 것이라는 놀라운 말씀을 듣는다. “어찌 이 일이 있으리이까”라고 물은 뒤 성령의 역사와 엘리사벳에게 일어난 일을 듣고, 마침내 “주의 계집종이오니 말씀대로 내게 이루어지이다”라고 답한다.\n\n이 대답은 아무 질문도 하지 않는 맹목이나 수동적인 체념이 아니다. 마리아는 자신이 모든 결과를 이해한다고 말하지 않으면서도, 말씀하신 하나님을 신뢰하여 자신을 ‘주의 종’으로 내어놓는다. 그의 동의가 앞으로 겪을 모든 어려움을 가볍게 만들지는 않는다. 순종은 결과를 통제할 수 있어서가 아니라, 말씀하신 분을 신뢰하기 때문에 가능한 응답이다.\n\n### 두 말씀이 만나는 지점\n시편의 화자는 “주의 뜻 행하기를 즐기오니”라고 말하고, 마리아는 “말씀대로 내게 이루어지이다”라고 답한다. 두 말씀에서 순종은 규칙을 지키는 바깥 행동보다 먼저, 하나님의 말씀을 마음에 받아 자신의 뜻과 삶을 그 앞에 내어놓는 응답이다.\n\n동시에 두 본문은 순종을 가벼운 낙관으로 만들지 않는다. 시편의 순종은 구원과 탄식이 함께 있는 삶에서 나오고, 마리아의 응답은 앞날을 모두 알지 못하는 자리에서 나온다. 믿음은 모든 부담이 사라진 뒤에 하나님의 뜻을 선택하는 것이 아니라, 그 뜻이 선하다는 신뢰로 오늘의 한 걸음을 내딛는 것이다.\n\n### 오늘 붙잡을 한 줄\n하나님의 뜻을 다 이해한 뒤 따르는 것이 아니라, 말씀하신 하나님을 신뢰하기에 오늘 순종한다.\n\n## 오늘의 적용\n오늘 이미 분명히 알고 있는 책임 한 가지를 미루지 말고 행하자. 마음이 완전히 내킬 때까지 기다리거나 결과를 먼저 보장받으려 하지 말고, 하나님의 말씀에 어긋나지 않는지 살핀 뒤 정직하고 기꺼운 마음으로 시작하자. 동시에 내 욕망이나 충동을 ‘하나님의 뜻’이라고 부르지 않도록, 기록된 말씀 앞에서 자신의 동기를 점검하자.\n\n## 짧은 기도\n하나님, 주의 말씀을 마음에 두고 주의 뜻 행하기를 기뻐하게 하소서. 모든 결과를 알지 못해도 말씀하신 주님을 신뢰하여 제 삶을 내어놓게 하시고, 제 욕망을 주의 뜻으로 꾸미지 않으며 오늘의 분명한 순종을 미루지 않게 하소서. 아멘.","v":[{"ref":"시편 40:8","en":"Psalm 40:8","krv":"나의 하나님이여 내가 주의 뜻 행하기를 즐기오니 주의 법이 나의 심중에 있나이다 하였나이다","bsb":"I delight to do Your will, O my God; Your law is within my heart."},{"ref":"누가복음 1:38","en":"Luke 1:38","krv":"마리아가 가로되 주의 계집종이오니 말씀대로 내게 이루어지이다 하매 천사가 떠나가니라","bsb":"“I am the Lord’s servant,” Mary answered. “May it happen to me according to your word.”"}],"src":[{"name":"Daily Divine","title":"2026-08-25 오늘의 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"3982518c2ec0dd6c9b81fbdf58eba528d9426c2d015ff7ef7028bc58ea85fbda"},{"date":"2026-08-26","title":"압박 속에서 하나님 앞에 펼쳐 놓기","subtitle":"민수기 20:10 · 열왕기하 19:14","tagline":"압박이 커질수록 해결자의 자리를 차지하지 말고, 현실을 하나님 앞에 펼쳐 놓고 그분을 하나님으로 인정하자.","body":"## 로중 묵상\n### 첫째 말씀 — 민수기 20:10\n이스라엘 회중은 가데스에서 물이 없자 모세와 아론에게 거칠게 항의한다. 모세와 아론이 회막 문에서 엎드렸을 때 하나님은 모세에게 반석을 향해 말하여 물을 내라고 명하신다. 그런데 모세는 백성 앞에서 “패역한 너희여 들으라 우리가 너희를 위하여 이 반석에서 물을 내랴”라고 말한 뒤 반석을 두 번 친다. 물은 풍성히 나오지만, 하나님은 이어 모세와 아론이 자신을 믿지 않았고 이스라엘 앞에서 거룩하게 하지 않았다고 책망하신다.\n\n이 장면을 단순히 ‘화를 내면 안 된다’는 교훈으로 줄이면 본문의 판정을 놓치기 쉽다. 모세의 분노가 장면에 배어 있는 것은 분명하지만, 본문이 직접 밝히는 문제는 하나님의 말씀을 그대로 따르지 않은 것과 그 결과 하나님을 거룩한 분으로 드러내지 못한 데 있다. “우리가 물을 내랴”라는 표현에 모세의 정확한 심리를 모두 읽어 넣을 수도 없다. 분명한 것은 압박 속에서 하나님의 명령보다 자신의 격앙된 행동이 앞섰고, 하나님은 그 실패를 가볍게 넘기지 않으셨다는 사실이다. 동시에 물은 나왔다. 하나님의 공급은 모세의 흠 없는 수행에 달려 있지 않았지만, 하나님의 일을 맡은 사람의 불순종 역시 사라지지 않았다.\n\n### 둘째 말씀 — 열왕기하 19:14\n히스기야가 받은 편지는 앗수르 왕 산헤립이 예루살렘을 위협하며 하나님을 불신하게 만들려는 말로 가득했다. 히스기야는 그 편지를 읽고 여호와의 전에 올라가 여호와 앞에 펼쳐 놓는다. 이어지는 기도에서 그는 현실을 축소하지 않는다. 앗수르가 여러 나라를 실제로 황폐하게 했음을 인정하면서도, 먼저 여호와만이 모든 나라의 하나님이며 천지를 지으신 분이라고 고백한다. 그리고 구원을 구하는 목적까지 “천하 만국으로 주 여호와는 홀로 하나님이신 줄 알게 하옵소서”라는 데 둔다.\n\n편지를 성전 바닥에 펼친 행위 자체에 어떤 주술적 효력이 있는 것은 아니다. 그 뒤의 기도가 이 행동의 의미를 보여 준다. 히스기야는 위협을 부정하거나 자기 힘으로 작아 보이게 만들지 않고, 읽은 그대로 하나님 앞에 가져간다. 믿음은 현실을 덜 심각하게 말하는 능력이 아니라, 심각한 현실을 하나님의 통치 아래 다시 놓는 태도로 나타난다.\n\n### 두 말씀이 만나는 지점\n두 장면에는 모두 지도자가 감당하기 버거운 압박이 있다. 모세 앞에는 원망하는 회중이 있고, 히스기야 앞에는 제국의 군사적 위협과 조롱이 있다. 두 본문을 같은 사건처럼 만들 수는 없지만, 나란히 읽으면 압박을 받을 때 누가 중심에 서는지가 또렷해진다. 모세의 장면에서는 하나님의 명령이 자신의 격앙된 행동 뒤로 밀리고, 하나님은 그것을 ‘나를 거룩하게 하지 않았다’고 평가하신다. 히스기야는 위협을 자기 안에서 부풀리거나 자신이 해결자의 자리에 서기보다 하나님 앞에 펼쳐 놓고 하나님의 이름과 통치를 먼저 붙든다.\n\n하나님을 의지한다는 것은 책임을 회피하는 수동성이 아니다. 모세에게도 해야 할 명령이 있었고, 히스기야에게도 위기 속에서 취할 현실의 책임이 있었다. 차이는 행동의 유무보다, 누구의 말씀과 누구의 명예가 행동을 지배하는가에 있다. 하나님의 일을 하면서도 내가 중심에 설 수 있고, 큰 문제 앞에서도 그 문제를 하나님 앞에 두며 충실하게 움직일 수 있다.\n\n### 오늘 붙잡을 한 줄\n압박이 커질수록 해결자의 자리를 차지하지 말고, 현실을 하나님 앞에 펼쳐 놓고 그분을 하나님으로 인정하자.\n\n## 오늘의 적용\n오늘 급하게 해결해야 한다고 느끼는 일 하나를 떠올리고, 먼저 사실을 있는 그대로 적어 보자. 그다음 ‘지금 내가 분명히 책임져야 할 일은 무엇인가’와 ‘내가 통제하려 들고 있는 몫은 무엇인가’를 구분해 보자. 분노나 조급함 때문에 하나님의 말씀과 정직한 책임의 경계를 넘어가지 않도록 살피고, 문제를 축소하지 않은 채 기도로 하나님 앞에 펼친 뒤 내가 해야 할 일을 행하자.\n\n## 짧은 기도\n하나님, 압박 속에서 제가 해결자의 자리를 차지하려 하지 않게 하소서. 현실을 감추지 않고 주님 앞에 펼쳐 놓게 하시며, 제 감정과 조급함보다 주님의 말씀을 앞세우게 하소서. 제가 해야 할 책임에는 충실하고, 주님의 몫은 주님께 맡기며, 모든 일 가운데 주님을 거룩한 하나님으로 인정하게 하소서. 아멘.","v":[{"ref":"민수기 20:10","en":"Numbers 20:10","krv":"모세와 아론이 총회를 그 반석 앞에 모으고 모세가 그들에게 이르되 패역한 너희여 들으라 우리가 너희를 위하여 이 반석에서 물을 내랴 하고","bsb":"Moses and Aaron gathered the assembly in front of the rock, and Moses said to them, “Listen now, you rebels, must we bring you water out of this rock?”"},{"ref":"열왕기하 19:14","en":"2 Kings 19:14","krv":"히스기야가 사자의 손에서 편지를 받아보고 여호와의 전에 올라가서 그 편지를 여호와 앞에 펴놓고","bsb":"Hezekiah received the letter from the messengers, read it, and went up to the house of the LORD and spread it out before the LORD."}],"src":[{"name":"Daily Divine","title":"2026-08-26 오늘의 말씀","url":"https://daily-divine.newjeans1029.chatgpt.site/today"},{"name":"ESV.org","title":"Numbers 20:2–13","url":"https://www.esv.org/verses/Numbers%2B20%3A2%E2%80%9313/"},{"name":"ESV.org","title":"2 Kings 19:14–19","url":"https://www.esv.org/verses/2%2BKings%2B19%3A14%E2%80%9319/"}],"sha":"71cfa07f49bd4d36fd2ec04cf8a55f58f26c2055bf6bff68643b897bfc5f0896"},{"date":"2026-08-27","title":"말씀은 달리고, 공동체는 길을 비운다","subtitle":"사도행전 6:7 · 시편 147:15","tagline":"말씀의 효력은 하나님께 있고, 우리의 몫은 섬김과 질서로 그 길을 막지 않는 것이다.","body":"## 로중 묵상\n### 첫째 말씀 — 사도행전 6:7\n사도행전 6장은 성장하는 예루살렘 교회 안에서 헬라파 과부들이 매일의 구제에서 빠지고 있다는 불만으로 시작한다. 열두 사도는 이 문제를 사소한 행정으로 밀어 두지 않는다. 온 공동체를 불러 성령과 지혜가 충만한 일곱 사람을 세우고, 자신들은 기도와 말씀 사역에 전념하도록 역할을 정리한다. 그 직후 7절은 “하나님의 말씀이 점점 왕성하여” 제자의 수가 크게 늘고 많은 제사장도 이 도에 복종했다고 기록한다.\n\n이 연결을 ‘구제는 덜 중요하고 설교만 중요하다’는 우열표로 읽어서는 안 된다. 앞 절들은 오히려 돌봄의 누락을 실제로 바로잡기 위해 책임 있는 사람을 세운다. 말씀의 사역과 필요한 섬김이 서로를 침식하지 않도록 공동체의 질서를 바로 세운 뒤, 누가는 말씀의 확장을 보고한다. 하나님의 말씀을 자라게 하는 힘은 교회의 운영 기술 자체에 있지 않지만, 교회는 방치와 혼란을 그대로 둔 채 말씀만 외칠 수도 없다.\n\n### 둘째 말씀 — 시편 147:15\n시편 147편 후반부는 예루살렘에게 하나님을 찬양하라고 부르며, 그분이 성문의 빗장을 견고하게 하고 평화를 주며 좋은 곡식으로 채우신다고 노래한다. 이어 하나님이 명령을 땅에 보내시니 “그 말씀이 속히 달리는도다”라고 한다. 다음 절들은 눈과 서리와 우박, 그리고 다시 그것들을 녹이는 바람과 물을 말한다.\n\n따라서 여기서 ‘달리는 말씀’은 먼저 선교의 확산을 뜻하는 표현이 아니다. 피조세계가 하나님의 명령에 신속히 응답한다는 고백이다. 말씀을 보내 눈을 내리게도 하고 다시 녹이기도 하시는 분이 하나님이다. 같은 단락 끝에서는 하나님이 자신의 말씀과 율례를 이스라엘에게 알리셨다는 사실도 찬양의 이유로 나온다. 시편의 초점은 하나님의 말씀이 자연과 백성 위에 실제 효력을 가진다는 데 있다.\n\n### 두 말씀이 만나는 지점\n두 본문은 같은 사건을 말하지 않는다. 사도행전은 복음의 말씀이 예루살렘에서 퍼지는 역사이고, 시편은 하나님의 명령이 피조세계에서 이루어지는 것을 노래한다. 그러나 둘을 나란히 읽을 때 한 가지 공통점이 선명하다. 말씀의 최종적인 효력은 사람의 힘이 아니라 말씀하시는 하나님께 있다.\n\n그 사실은 사람의 책임을 지우지 않는다. 사도행전의 공동체는 누락된 돌봄을 바로잡고 역할을 분명히 하며, 기도와 말씀 사역이 계속되도록 실제 구조를 정돈한다. 우리는 말씀에 능력을 더할 수는 없지만, 무책임과 혼란으로 그 증언을 가로막지 않도록 순종할 수 있다. 하나님의 말씀은 달리고, 공동체는 그 길을 점유하기보다 비워 준다.\n\n### 오늘 붙잡을 한 줄\n말씀의 효력은 하나님께 있고, 우리의 몫은 섬김과 질서로 그 길을 막지 않는 것이다.\n\n## 오늘의 적용\n오늘 내가 책임진 자리에서 ‘중요하지만 아무도 맡지 않아 빠지고 있는 일’이 하나 있는지 살펴보자. 사람이 소외되거나 돌봄이 누락되는 문제라면 영적인 명분으로 미루지 말고 책임을 분명히 하자. 동시에 내가 반드시 지켜야 할 기도와 말씀의 시간도 잡다한 긴급함에 계속 빼앗기고 있지 않은지 점검하자. 무엇이든 내가 다 해야 한다는 태도 대신, 필요한 일을 맡길 사람을 세우고 내가 맡은 부르심에는 집중하자.\n\n## 짧은 기도\n하나님, 주님의 말씀에 제가 힘을 보태야 한다는 교만에서도, 아무 책임도 지지 않아도 된다는 무책임에서도 지켜 주소서. 돌봄이 빠진 곳을 정직하게 바로잡고, 맡길 것은 맡기며, 기도와 말씀 앞에 충실하게 하소서. 주님의 말씀이 오늘도 저와 공동체 안에서 막힘없이 달리게 하소서. 아멘.","v":[{"ref":"사도행전 6:7","en":"Acts 6:7","krv":"하나님의 말씀이 점점 왕성하여 예루살렘에 있는 제자의 수가 더 심히 많아지고 허다한 제사장의 무리도 이 도에 복종하니라","bsb":"So the word of God continued to spread. The number of disciples in Jerusalem grew rapidly."},{"ref":"시편 147:15","en":"Psalm 147:15","krv":"그 명을 땅에 보내시니 그 말씀이 속히 달리는도다","bsb":"He sends forth His command to the earth; His word runs swiftly."}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"ESV.org","title":"Acts 6:1–7","url":"https://www.esv.org/verses/Acts%2B6%3A1%E2%80%937/"},{"name":"ESV.org","title":"Psalm 147:12–20","url":"https://www.esv.org/verses/Psalm%2B147%3A12%E2%80%9320/"}],"sha":"d4295a1f2de1f57f1a190c4188d5ac5e66ab650db40518086a5ff347f0499518"},{"date":"2026-08-28","title":"약속대로 오는 사랑","subtitle":"시편 119:41 · 예레미야 31:3","tagline":"하나님의 사랑은 막연한 기대가 아니라, 약속에 따라 구원하고 다시 세우는 신실하심이다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 119:41\n시편 119편의 ‘와우’ 연(41–48절)은 하나님의 말씀을 사랑하는 사람이 현실의 조롱 속에서 무엇을 구하는지 보여 준다. 41절의 기도는 단순히 마음을 따뜻하게 해 달라는 요청이 아니다. 시인은 “주의 말씀대로” 인자와 구원을 자신에게 오게 해 달라고 구한다. 다음 절에서 그 구원은 자신을 조롱하는 자에게 대답할 근거가 되고, 그는 하나님의 말씀을 신뢰하며 진리의 말씀을 입에서 놓지 않고 계명을 지키기를 바란다.\n\n그러므로 이 절의 중심은 내가 원하는 방식으로 형편이 풀리는 데 있지 않다. 시인은 하나님의 약속이 실제 삶에 도달하기를 구하고, 그 응답 속에서 더 자유롭게 말씀을 붙들고 증언하기를 바란다. 인자와 구원은 말씀과 분리된 막연한 위로가 아니라, 약속하신 하나님을 신뢰하게 하는 근거다.\n\n### 둘째 말씀 — 예레미야 31:3\n예레미야 31장은 심판과 흩어짐을 지나 다시 세우고 돌아오게 하시는 회복의 약속 한가운데 있다. “내가 무궁한 사랑으로 너를 사랑”했다는 선언 뒤에는 “다시 너를 세우리라”, 다시 기쁨이 있고 사마리아에 포도원을 심으며 시온을 향해 올라갈 날이 온다는 약속이 이어진다. 여기서 영원한 사랑은 추상적인 감정이 아니라 무너진 이스라엘을 포기하지 않고 다시 세우시는 하나님의 지속적인 신실하심으로 나타난다.\n\n이 말씀을 모든 개인의 바람이 곧바로 이루어진다는 보증으로 넓혀 읽어서는 안 된다. 직접 문맥에서 하나님은 언약 백성을 향한 회복을 말씀하신다. 그러나 본문이 분명히 보여 주는 것은 인간의 흔들림보다 먼저 있고 더 오래 지속되는 하나님의 사랑이다.\n\n### 두 말씀이 만나는 지점\n첫 번째 말씀은 약속대로 인자와 구원이 “내게 임하게” 해 달라고 기도하고, 두 번째 말씀은 하나님이 이미 “무궁한 사랑”으로 사랑해 왔다고 선언한다. 하나는 사랑을 기다리는 기도이고, 다른 하나는 그 기다림을 떠받치는 하나님의 자기 선언이다.\n\n두 본문이 만나는 자리에서 믿음은 막연한 낙관이 아니다. 우리는 약속을 근거로 구하고, 하나님의 오래된 신실하심을 근거로 기다린다. 때로 사랑이 보이지 않는 시간에도 믿음은 “사랑이 있는가?”를 내 감정만으로 판정하지 않고, 말씀하신 분의 성품과 약속으로 돌아간다.\n\n### 오늘 붙잡을 한 줄\n하나님의 사랑은 막연한 기대가 아니라, 약속에 따라 구원하고 다시 세우는 신실하심이다.\n\n## 오늘의 적용\n오늘 마음을 붙들고 있는 한 가지 걱정을 하나님 앞에 구체적으로 말하되, 원하는 결과만 반복하기보다 내가 붙들 수 있는 하나님의 약속을 함께 읽자. 그리고 아직 답이 보이지 않아도 ‘주께서 사랑하신다’는 사실을 감정의 강도와 동일시하지 말자. 약속을 붙들고 기다리는 동안 내가 순종할 한 가지—진실한 말, 맡은 책임, 용서, 말씀을 읽는 시간—를 오늘 실제로 행하자.\n\n## 짧은 기도\n하나님, 주의 말씀대로 주의 인자와 구원이 제 삶에 임하게 하소서. 눈앞의 형편만으로 주님의 사랑을 재단하지 않고, 오래도록 신실하신 주님의 약속을 붙들게 하소서. 저를 다시 세우시는 사랑을 믿으며 오늘 해야 할 순종을 감당하게 하소서. 아멘.","v":[{"ref":"시편 119:41","en":"Psalm 119:41","krv":"여호와여 주의 말씀대로 주의 인자하심과 주의 구원을 내게 임하게 하소서","bsb":"May Your loving devotion come to me, O LORD, Your salvation, according to Your promise."},{"ref":"예레미야 31:3","en":"Jeremiah 31:3","krv":"나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로 너를 사랑하는 고로 인자함으로 너를 인도하였다 하였노라","bsb":"“I have loved you with an everlasting love; therefore I have drawn you with loving devotion.”"}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Bible Gateway","title":"Psalm 119:41–48 (ESV)","url":"https://www.biblegateway.com/passage/?search=Psalm%20119%3A41-48&version=ESV"},{"name":"Bible Gateway","title":"Jeremiah 31:3–6 (ESV)","url":"https://www.biblegateway.com/passage/?search=Jeremiah%2031%3A3-6&version=ESV"}],"sha":"0be5c37bce587bfb55d2fa7d52d797b6c3f4ab5dedec06f6ac1058f6d570bfd1"},{"date":"2026-08-29","title":"끌어 올리시고, 발을 세우시는 하나님","subtitle":"시편 30:1 · 시편 40:2","tagline":"구원은 웅덩이에서 끌어 올리시는 데서 멈추지 않고, 다시 걸을 수 있도록 발을 반석 위에 세우시는 하나님의 일이다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 30:1\n시편 30편은 위기에서 건져 주신 하나님께 드리는 감사의 노래다. 1절에서 시인은 자신을 “끌어 올리신” 주님을 높이겠다고 말하며, 대적이 자신의 몰락을 기뻐하지 못하게 하셨다고 고백한다. 이어지는 2–3절에서는 도움을 부르짖었고 치유를 받았으며, 스올과 구덩이로 내려가는 자리에서 생명을 회복했다고 노래한다. 그래서 1절의 ‘끌어 올림’은 단순히 기분이 나아졌다는 표현보다, 죽음과 패배에 가까운 자리에서 삶이 되돌려진 구원을 가리킨다.\n\n이 시편은 구원받은 사람이 다시는 흔들리지 않는다고 말하지 않는다. 6–7절에서 시인은 형통할 때 “영영히 요동치 아니하리라” 생각했지만 하나님의 얼굴이 가려지자 두려워했다고 돌아본다. 찬양은 자기 힘으로 위기를 이겼다는 결론이 아니라, 자기 안정이 주님의 은혜에 달려 있음을 다시 아는 고백이다.\n\n### 둘째 말씀 — 시편 40:2\n시편 40편 첫머리에서 시인은 오래 기다리는 가운데 부르짖었고, 하나님이 그 소리를 들으셨다고 말한다. 2절의 ‘기가 막힐 웅덩이와 수렁’은 문자적 사건을 특정할 만큼 설명되어 있지 않지만, 스스로 발판을 만들 수 없는 곤경을 강하게 그린다. 중요한 것은 하나님이 그를 끌어 올리실 뿐 아니라 발을 반석 위에 두고 걸음을 견고하게 하셨다는 것이다.\n\n바로 다음 3절에서 구원은 새 노래와 하나님께 드리는 찬송으로 이어지고, 다른 이들이 보고 하나님을 신뢰하게 되는 증언이 된다. 시편 40편이 그리는 구원은 탈출 한 번으로 끝나지 않는다. 빠져나올 수 없는 자리에서 건짐을 받고, 다시 설 자리를 얻고, 다시 걸으며, 다시 찬양하게 되는 회복이다.\n\n### 두 말씀이 만나는 지점\n두 시편은 모두 하나님을 ‘끌어 올리시는 분’으로 말한다. 시편 30편은 끌어 올림을 주님을 높여야 할 이유로 고백하고, 시편 40편은 그 끌어 올림 뒤에 반석과 견고한 걸음까지 보여 준다. 한 말씀은 “누가 나를 살리셨는가”를 분명히 하고, 다른 말씀은 “살리신 뒤 무엇을 주시는가”를 보여 준다.\n\n그래서 오늘의 구원은 단지 어려움이 사라지는 것만을 뜻하지 않는다. 하나님은 빠져나올 힘이 없는 곳에서 건지시고, 다시 설 자리를 주시며, 흔들리는 발이 다음 걸음을 내딛도록 붙드신다. 그때 사람의 응답은 자신을 높이는 것이 아니라 자신을 끌어 올리신 주님을 높이는 것이다.\n\n### 오늘 붙잡을 한 줄\n주님은 나를 끌어 올리실 뿐 아니라, 다시 걸을 수 있도록 발을 반석 위에 세우신다.\n\n## 오늘의 적용\n오늘 내가 ‘수렁처럼’ 느끼는 한 가지를 막연하게 두지 말고 한 문장으로 적어 하나님께 그대로 말씀드리자. 그리고 모든 문제가 한꺼번에 해결되기를 기다리기보다, 지금 주어진 반석 같은 한 가지—확인된 말씀, 해야 할 책임, 정직한 대화, 작은 순종—위에 발을 올리고 다음 한 걸음을 내딛자. 일이 풀렸을 때에는 “내가 해냈다”보다 먼저 나를 끌어 올리신 분을 기억하며 감사하자.\n\n## 짧은 기도\n하나님, 제 힘으로 빠져나오기 어려운 자리에서 저를 끌어 올려 주소서. 제 발을 반석 위에 두시고 오늘의 한 걸음을 견고하게 하소서. 구원과 회복의 공을 제게 돌리지 않고, 저를 살리신 주님을 높이며 살게 하소서. 아멘.","v":[{"ref":"시편 30:1","en":"Psalm 30:1","krv":"여호와여 내가 주를 높일 것은 주께서 나를 끌어내사 내 대적으로 나를 인하여 기뻐하지 못하게 하심이니이다","bsb":"I will exalt You, O LORD, for You have lifted me up."},{"ref":"시편 40:2","en":"Psalm 40:2","krv":"나를 기가 막힐 웅덩이와 수렁에서 끌어 올리시고 내 발을 반석 위에 두사 내 걸음을 견고케 하셨도다","bsb":"He lifted me up from the pit of despair, out of the miry clay; He set my feet upon a rock, and made my footsteps firm."}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Bible Gateway","title":"Psalm 30:1–11 (ESV)","url":"https://www.biblegateway.com/passage/?search=Psalm+30%3A1-11&version=ESV"},{"name":"Bible Gateway","title":"Psalm 40:1–5 (ESV)","url":"https://www.biblegateway.com/passage/?search=Psalm+40%3A1-5&version=ESV"}],"sha":"3ddb7603cc3d9240a1ad6f08c48d42a9c27ed00f7cd0a8d63b939998e6bc3a88"},{"date":"2026-08-30","title":"주는 나를 돕는 자시니","subtitle":"시편 28:7 · 히브리서 13:6","tagline":"도움은 두려울 일이 사라졌다는 뜻이 아니라, 두려움 속에서도 누구를 의지할지 분명해지는 일이다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 28:7\n시편 28편에서 다윗은 하나님이 침묵하시면 자신이 구덩이에 내려가는 자와 같아질 것이라며 먼저 도움을 부르짖는다. 악인들과 함께 끌려가지 않게 해 달라는 간구 뒤에 6절부터 분위기가 바뀐다. 하나님이 간구하는 소리를 들으셨다는 확신 때문이다. 7절의 “나의 힘과 나의 방패”는 막연한 격려가 아니라, 두려운 형편 속에서 마음이 하나님을 의지했고 실제로 도움을 얻었다는 고백이다. 그래서 두려움은 곧 기쁨과 노래로 방향을 바꾼다.\n\n### 둘째 말씀 — 히브리서 13:6\n히브리서 13장은 공동체가 실제 삶에서 어떻게 믿음을 살아낼지를 권면한다. 5절은 돈을 사랑하지 말고 있는 바를 족한 줄 알라고 하면서, 하나님이 결코 버리지도 떠나지도 않으시겠다는 약속을 붙인다. 바로 그 약속 때문에 6절의 “주는 나를 돕는 자시니 내가 무서워 아니하겠노라”가 나온다. 담대함의 근거는 사람이 강해졌기 때문이 아니라, 떠나지 않으시는 하나님이 현재의 도움이라는 사실에 있다.\n\n### 두 말씀이 만나는 지점\n시편의 기도자는 위협 가운데 하나님을 힘과 방패로 경험하고, 히브리서는 떠나지 않으시는 하나님 때문에 두려움 앞에서 담대히 말할 수 있다고 한다. 두 말씀 모두 믿음을 ‘아무것도 두렵지 않은 상태’로 만들지 않는다. 오히려 두려움의 한복판에서 누구를 의지하고 누구의 도움을 기대할지를 다시 정한다. 마음이 환경보다 먼저 안전해지는 이유는 도움의 근원이 분명하기 때문이다.\n\n### 오늘 붙잡을 한 줄\n두려움이 사라져야 담대해지는 것이 아니라, 주님이 나의 도움임을 붙들 때 두려움의 자리가 달라진다.\n\n## 오늘의 적용\n오늘 마음을 움츠러들게 하는 일을 하나 구체적으로 적어 보자. 그 문제를 축소하거나 “괜찮다”고 덮기보다, 시편처럼 하나님께 도움을 구하고 히브리서처럼 “주는 나를 돕는 자”라고 소리 내어 고백해 보자. 그리고 내가 통제할 수 있는 작은 책임 하나는 피하지 말고 수행하자. 믿음은 위험을 부정하는 일이 아니라, 그 위험보다 먼저 나와 함께 계신 분을 바라보는 일이다.\n\n## 짧은 기도\n주님, 두려운 일을 외면하지 않으면서도 두려움에 지배되지 않게 하소서. 제 힘과 방패가 되어 주시고, 저를 떠나지 않으시는 주님의 도움을 믿게 하소서. 오늘 해야 할 일을 담대히 감당하고, 도움을 얻은 마음으로 주님을 찬송하게 하소서. 아멘.","v":[{"ref":"시편 28:7","en":"Psalm 28:7","krv":"여호와는 나의 힘과 나의 방패시니 내 마음이 저를 의지하여 도움을 얻었도다 그러므로 내 마음이 크게 기뻐하며 내 노래로 저를 찬송하리로다","bsb":"The LORD is my strength and my shield."},{"ref":"히브리서 13:6","en":"Hebrews 13:6","krv":"그러므로 우리가 담대히 가로되 주는 나를 돕는 자시니 내가 무서워 아니하겠노라 사람이 내게 어찌하리요 하노라","bsb":"So we say with confidence: “The Lord is my helper; I will not be afraid. What can man do to me?”"}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Bible Gateway","title":"Psalm 28:1–9 (ESV)","url":"https://www.biblegateway.com/passage/?search=Psalm+28%3A1-9&version=ESV"},{"name":"Bible Gateway","title":"Hebrews 13:1–8 (ESV)","url":"https://www.biblegateway.com/passage/?search=Hebrews+13%3A1-8&version=ESV"}],"sha":"d6f525c538b81e9a37b522e1a4d6b2e4f6071718b5bc3f520c812f0bf6da5041"},{"date":"2026-08-31","title":"사람에게가 아니라 하나님께","subtitle":"레위기 19:11 · 사도행전 5:4","tagline":"거짓은 이웃을 속이는 말에서 시작하지만, 하나님 앞에서 자신을 꾸미는 일로 끝난다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 레위기 19:11\n레위기 19장은 “내가 거룩하니 너희도 거룩하라”는 부르심을 일상의 관계 속에 펼쳐 놓는다. 가난한 이가 거둘 몫을 남기는 일과 도둑질·속임·거짓말을 금하는 명령이 한 흐름에 놓인다. 거룩함은 예배 시간에만 드러나는 태도가 아니라, 이웃의 것을 빼앗지 않고 말로 현실을 조작하지 않는 삶이다.\n\n### 둘째 말씀 — 사도행전 5:4\n아나니아의 죄는 땅값 전부를 내놓지 않은 데 있지 않았다. 베드로는 땅도, 판 뒤의 돈도 그의 권한 아래 있었다고 분명히 말한다. 문제는 일부를 감추고도 전부를 바친 사람처럼 자신을 꾸민 일이었다. 공동체 앞의 거짓은 성령 앞에서 진실한 사람으로 보이려 한 거짓이기도 했다.\n\n### 두 말씀이 만나는 지점\n레위기는 거짓말을 이웃에게 행하는 해악으로 다루고, 사도행전은 그 거짓이 하나님과 무관하지 않다고 드러낸다. 사람에게 보이는 모습과 하나님 앞의 실제 모습을 갈라놓을 수 없기 때문이다. 정직은 모든 속사정을 누구에게나 공개하는 일이 아니다. 말하기로 한 것과 실제 행동 사이에 다른 사람을 속이기 위한 틈을 만들지 않는 일이다.\n\n### 오늘 붙잡을 한 줄\n하나님 앞의 정직은 사람에게 보이는 나와 실제의 나 사이를 좁히는 데서 시작된다.\n\n## 오늘의 적용\n오늘 내가 더 좋아 보이려고 과장하거나, 책임을 피하려고 흐리게 말한 부분이 있는지 돌아보자. 있다면 설명을 더 붙여 자신을 지키기보다 사실을 짧고 정확하게 바로잡자. 정직은 체면을 잃는 순간처럼 느껴질 수 있지만, 하나님과 이웃 앞에서 관계가 설 자리를 다시 만드는 순종이다.\n\n## 짧은 기도\n거룩하신 하나님, 사람의 시선 앞에서 제 모습을 꾸미지 않게 하소서. 제 말과 행동 사이의 거짓을 보게 하시고, 숨기거나 과장한 것을 정직하게 바로잡을 용기를 주소서. 진실 안에서 하나님과 이웃을 사랑하게 하소서. 아멘.","v":[{"ref":"레위기 19:11","en":"Leviticus 19:11","krv":"너희는 도적질하지 말며 속이지 말며 서로 거짓말하지 말며","bsb":"You must not steal. You must not lie or deceive one another."},{"ref":"사도행전 5:4","en":"Acts 5:4","krv":"땅이 그대로 있을 때에는 네 땅이 아니며 판 후에도 네 임의로 할 수가 없더냐 어찌하여 이 일을 네 마음에 두었느냐 사람에게 거짓말한 것이 아니요 하나님께로다","bsb":"You have not lied to men, but to God!"}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Bible Gateway","title":"Leviticus 19 (ESV)","url":"https://www.biblegateway.com/passage/?search=Leviticus+19&version=ESV"},{"name":"Bible Gateway","title":"Acts 5:1–11 (ESV)","url":"https://www.biblegateway.com/passage/?search=Acts+5%3A1-11&version=ESV"}],"sha":"af77772f7c475757c6ee1b2f7df606fce78ce9e7dba0c5f34ccd229af32304fb"},{"date":"2026-09-01","title":"모든 민족을 향해 나아가는 복음","subtitle":"마가복음 13:10 · 요한계시록 14:6","tagline":"복음은 좋은 조건을 기다리지 않고, 하나님이 여신 자리에서 모든 사람을 향해 나아간다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 마가복음 13:10\n예수님은 성전의 무너짐과 제자들이 겪을 환난을 말씀하시며, 그들이 공회와 권력자들 앞에 서게 될 것이라고 하신다. 그 한가운데 “복음이 먼저 만국에 전파되어야 한다”는 말씀이 놓인다. 여기서 ‘먼저’는 제자들이 편안한 조건을 갖춘 뒤 선교한다는 뜻이 아니다. 붙잡히고 미움을 받는 자리까지도 여러 민족에게 증언이 이르는 통로가 된다.\n\n### 둘째 말씀 — 요한계시록 14:6\n요한은 심판을 알리는 장면 속에서 공중을 나는 천사가 ‘영원한 복음’을 온 땅의 모든 나라와 족속과 방언과 백성에게 전하는 것을 본다. 이어지는 외침은 하나님을 두려워하고 그분께 영광을 돌리라는 부름이다. 세상의 권세와 우상이 영원해 보일 때에도, 복음의 대상과 하나님의 통치는 어느 제국이나 언어권에 갇히지 않는다.\n\n### 두 말씀이 만나는 지점\n마가복음은 고난받는 제자들의 증언을, 요한계시록은 온 땅 위에 울리는 천사의 선포를 보여 준다. 전달자는 다르지만 두 본문 모두 복음의 범위가 ‘모든 민족’임을 분명히 한다. 복음의 전진은 안전한 시대와 강한 교회만의 성과가 아니다. 하나님이 정하신 목적 안에서, 약한 증인의 말과 마지막 심판을 앞둔 선포까지 사용되어 경계를 넘어간다.\n\n### 오늘 붙잡을 한 줄\n복음은 좋은 조건을 기다리지 않고, 하나님이 여신 자리에서 모든 사람을 향해 나아간다.\n\n## 오늘의 적용\n오늘 복음을 전한다는 말을 거창한 계획으로만 미루지 말자. 내 앞의 한 사람을 출신·세대·언어·형편으로 미리 가르지 않고 존중하며, 내가 믿는 소망을 숨기지 않는 작은 증언부터 시작할 수 있다. 결과를 통제하려 하기보다 말할 기회를 분별하고, 두려움 속에서도 진실하고 온유하게 말하자.\n\n## 짧은 기도\n온 세상의 주인이신 하나님, 복음을 제 울타리 안에 가두지 않게 하소서. 상황이 좋을 때만 주님을 말하려는 두려움과 계산을 내려놓게 하시고, 오늘 만나는 사람을 사랑으로 대하며 그리스도의 소망을 정직하게 전하게 하소서. 아멘.","v":[{"ref":"마가복음 13:10","en":"Mark 13:10","krv":"또 복음이 먼저 만국에 전파되어야 할 것이니라","bsb":"The gospel must first be proclaimed to all the nations."},{"ref":"요한계시록 14:6","en":"Revelation 14:6","krv":"또 보니 다른 천사가 공중에 날아가는데 땅에 거하는 자들 곧 여러 나라와 족속과 방언과 백성에게 전할 영원한 복음을 가졌더라","bsb":"I saw another angel flying overhead, with the eternal gospel to proclaim to those who dwell on the earth—to every nation and tribe and tongue and people."}],"src":[{"name":"Bible 2.0","title":"The Word · yearly .twd source","url":"https://bible2.net/en/download"},{"name":"The SWORD Project / CrossWire","title":"KorRV · Korean Revised Version","url":"https://www.crosswire.org/sword/modules/ModInfo.jsp?modName=KorRV"},{"name":"Bible Gateway","title":"Mark 13 (ESV)","url":"https://www.biblegateway.com/passage/?search=Mark+13&version=ESV"},{"name":"Bible Gateway","title":"Revelation 14 (ESV)","url":"https://www.biblegateway.com/passage/?search=Revelation+14&version=ESV"}],"sha":"f95bbf229a7a3947f64e4fd6d712b57bedfb2ea2e668f79621b7f3f6e8d64605"},{"date":"2026-09-02","title":"모든 나라가 한 왕을 찬양하는 날","subtitle":"시편 117:1 · 스가랴 14:9","tagline":"모든 나라를 부르시는 하나님을 믿는다면, 내 믿음의 울타리도 한 사람 앞에서 더 넓어져야 한다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 117:1\n시편 117편은 두 절뿐이지만 부름의 범위는 가장 넓다. 시인은 이스라엘 안에서만 찬양을 요청하지 않고 “모든 나라”와 “모든 백성”을 향해 여호와를 높이라고 외친다. 다음 절은 그 이유를 하나님의 크신 인자와 영원한 진실하심에서 찾는다. 찬양은 어느 민족의 기분이나 형편이 아니라 변하지 않는 하나님의 성품에 기대어 열린다.\n\n### 둘째 말씀 — 스가랴 14:9\n스가랴 14장은 ‘여호와의 날’에 닥칠 심판과 구원을 함께 그린다. 혼란과 전쟁이 끝난 뒤 여호와께서 온 땅의 왕으로 드러나시며, 그날에는 그분이 홀로 하나님이시고 그 이름이 하나임이 분명해진다. 이것은 한 나라가 다른 나라를 삼키는 정치적 승리가 아니다. 경쟁하던 우상과 권세가 물러나고 창조주께 속한 통치와 예배가 온전히 드러나는 장면이다.\n\n### 두 말씀이 만나는 지점\n시편은 지금 모든 민족을 찬양으로 부르고, 스가랴는 마침내 온 땅이 한 왕의 통치 아래 서는 날을 내다본다. 현재의 초대와 미래의 완성이 서로 이어진다. 교회가 복음을 전하고 여러 언어로 하나님을 찬양하는 일은 낯선 사람을 우리 문화 안으로 끌어들이는 일이 아니다. 이미 온 땅의 왕이신 하나님께 함께 시선을 돌리는 증언이다.\n\n### 오늘 붙잡을 한 줄\n모든 나라를 부르시는 하나님을 믿는다면, 내 믿음의 울타리도 한 사람 앞에서 더 넓어져야 한다.\n\n## 오늘의 적용\n오늘 만나는 사람을 출신·세대·성향으로 먼저 분류하지 말자. 내게 익숙하지 않은 사람도 하나님이 찬양으로 부르시는 백성 가운데 있음을 기억하며, 한 번 더 듣고 존중하는 말로 대하자. 복음을 전할 기회가 오면 내 취향이나 우월함을 말하기보다, 인자와 진실이 영원하신 하나님을 조용하고 분명하게 소개하자.\n\n## 짧은 기도\n온 땅의 왕이신 하나님, 제 좁은 울타리로 주님의 나라를 가리지 않게 하소서. 모든 민족을 찬양으로 부르시는 마음을 배우고, 오늘 만나는 한 사람을 존중하며 주님의 인자와 진실을 드러내게 하소서. 아멘.","v":[{"ref":"시편 117:1","en":"Psalm 117:1","krv":"너희 모든 나라들아 여호와를 찬양하며 너희 모든 백성들아 저를 칭송할지어다","bsb":"Praise the LORD, all you nations! Extol Him, all you peoples!"},{"ref":"스가랴 14:9","en":"Zechariah 14:9","krv":"여호와께서 천하의 왕이 되시리니 그 날에는 여호와께서 홀로 하나이실 것이요 그 이름이 홀로 하나이실 것이며","bsb":"On that day the LORD will become King over all the earth—the LORD alone, and His name alone."}],"src":[{"name":"Daily Divine · DIVINE_SOURCE","title":"2026-09-02 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"ea1112fb6d07b9751fc683b329c52c9d6c37c63540b0a3f5eac633a176467b9c"},{"date":"2026-09-03","title":"참되신 왕의 말씀 안에 머물다","subtitle":"예레미야 10:10 · 요한복음 8:31–32","tagline":"참되신 하나님을 아는 자유는 그분의 말씀을 벗어나는 데 있지 않고, 그 말씀 안에 머무는 데 있다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 예레미야 10:10\n예레미야는 사람이 만든 우상과 여호와를 맞세운다. 우상은 장인이 나무와 금속으로 만들고, 넘어지지 않도록 못으로 고정하며, 스스로 말하거나 걷지 못한다. 그와 달리 여호와는 “참 하나님”, “사시는 하나님”, “영원한 왕”이시다. 이 고백은 막연한 종교적 진심보다, 실제로 살아 계시며 세상과 열방을 다스리시는 분이 누구인지를 분명히 가른다. 이어지는 진노와 땅의 진동은 그분의 진실하심이 가볍고 안전한 관념이 아니라 심판할 권세를 지닌 왕의 진실임을 보여 준다.\n\n### 둘째 말씀 — 요한복음 8:31–32\n예수님은 자신을 믿었다고 한 유대인들에게 “내 말에 거하면” 참 제자가 된다고 말씀하신다. 한순간의 동의가 끝이 아니라, 그분의 말씀 안에 계속 머무는 삶이 믿음의 실체를 드러낸다. 여기서 진리는 원하는 것을 마음대로 하게 만드는 정보가 아니다. 뒤이어 예수님은 죄를 범하는 자가 죄의 종이라고 밝히신다. 진리가 주는 자유는 진리를 떠날 자유가 아니라, 죄의 속박에서 벗어나 아들의 말씀 아래 사는 자유다.\n\n### 두 말씀이 만나는 지점\n예레미야는 참되신 분이 살아 계신 영원한 왕이라고 선포하고, 예수님은 그 진리를 자신의 말씀 안에 거하는 제자의 삶으로 이끄신다. 진리는 사람이 만들어 붙잡아 두는 우상처럼 우리 손에 통제되지 않는다. 살아 계신 하나님께서 말씀하시고, 제자는 그 말씀에 머물며 자신이 무엇에 묶여 있었는지를 알게 된다. 하나님을 참되시다고 고백하는 입술과 그분의 말씀을 떠나려는 삶은 함께 갈 수 없다.\n\n### 오늘 붙잡을 한 줄\n참되신 하나님을 아는 자유는 그분의 말씀을 벗어나는 데 있지 않고, 그 말씀 안에 머무는 데 있다.\n\n## 오늘의 적용\n오늘 내 선택을 지배하는 말 하나를 살펴보자. 사람의 평가, 불안, 욕망이 만든 문장을 당연한 진리처럼 따르고 있지는 않은가. 그 문장을 예수님의 말씀 앞에 놓고, 알고도 미뤄 둔 순종 한 가지를 실행하자. 말씀에 거한다는 것은 감정이 생길 때까지 기다리는 일이 아니라, 참되신 왕의 말씀을 오늘의 판단 기준으로 받아들이는 일이다.\n\n## 짧은 기도\n참되시고 살아 계신 하나님, 제가 만든 확신을 진리처럼 붙들지 않게 하소서. 예수님의 말씀 안에 머물러 죄의 속박을 분별하고, 순종으로 누리는 자유를 알게 하소서. 아멘.","v":[{"ref":"예레미야 10:10","en":"Jeremiah 10:10","krv":"오직 여호와는 참 하나님이시요 사시는 하나님이시요 영원한 왕이시라 그 진노하심에 땅이 진동하며 그 분노하심을 열방이 능히 당치 못하느니라","bsb":"The LORD is the true God; He is the living God and eternal King."},{"ref":"요한복음 8:31-32","en":"John 8:31-32","krv":"그러므로 예수께서 자기를 믿은 유대인들에게 이르시되 너희가 내 말에 거하면 참 내 제자가 되고 진리를 알지니 진리가 너희를 자유케 하리라","bsb":"He said to the Jews who had believed Him, “If you continue in My word, you are truly My disciples. Then you will know the truth, and the truth will set you free.”"}],"src":[{"name":"Daily Divine · DIVINE_SOURCE","title":"2026-09-03 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"},{"name":"Bible Gateway","title":"Jeremiah 10 · ESV","url":"https://www.biblegateway.com/passage/?search=Jeremiah+10&version=ESV"},{"name":"Bible Gateway","title":"John 8 · ESV","url":"https://www.biblegateway.com/passage/?search=John+8&version=ESV"}],"sha":"8fdb823f6daf71b654f700a544136682731cf848f22507e1247566e2c2e7fb04"},{"date":"2026-09-04","title":"눈물 속에서도 씨를 뿌리다","subtitle":"시편 126:5-6 · 고린도후서 9:6","tagline":"눈물이 남아 있어도 심고, 손에 남겨 두고 싶은 것에서도 사랑을 시작하자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 126:5-6\n시편 126편은 포로에서 돌아온 이들이 아직 완전히 회복되지 않은 자리에서 부르는 노래다. 눈물을 흘리며 씨를 뿌린다는 말은 슬픔이 끝난 뒤에야 순종하겠다는 뜻이 아니다. 눈물이 남아 있는 바로 그때에도 씨를 놓는 믿음을 가리킨다. 시인은 수확의 기쁨을 약속하지만, 씨를 뿌리는 현재의 수고를 지우지 않는다.\n\n### 둘째 말씀 — 고린도후서 9:6\n바울은 예루살렘의 성도들을 돕는 연보를 말하며 적게 심는 자와 많이 심는 자를 대조한다. 여기서 ‘많이’는 하나님께 더 많이 받아내기 위한 거래의 양이 아니다. 인색함이 아니라 자원하는 마음으로 내어놓는 태도를 말한다. 하나님은 외형적인 액수보다 마음의 방향과 이웃을 향한 실제 행동을 보게 하신다.\n\n### 두 말씀이 만나는 지점\n두 말씀은 심고 거두는 일을 단순한 성공 공식으로 만들지 않는다. 시편에서는 눈물 속의 기다림이, 고린도후서에서는 아낌없이 나누는 행위가 등장한다. 하나는 결과를 당장 볼 수 없는 순종이고, 다른 하나는 손에 있던 것을 내어놓는 순종이다. 둘 모두 열매를 만들어 내는 주체가 인간의 계산만은 아니라는 사실을 전제한다. 믿음은 눈물을 부정하지 않으면서도 오늘의 씨를 심고, 부족해질까 움켜쥐는 마음을 조금씩 풀어 놓는다.\n\n### 오늘 붙잡을 한 줄\n눈물이 남아 있어도 심고, 손에 남겨 두고 싶은 것에서도 사랑을 시작하자.\n\n## 오늘의 적용\n오늘 해야 할 선한 일을 결과가 보일 때까지 미루지 않는다. 가족에게 건넬 한마디, 맡은 일에서 정직하게 마무리할 한 단계, 도움이 필요한 사람에게 보낼 작은 나눔을 정한다. 그것이 곧바로 큰 열매가 되는지 계산하기보다, 눈물 속에서도 씨를 뿌리고 가진 것을 선뜻 나누는 방향에 서 있는지 살핀다.\n\n## 짧은 기도\n하나님, 결과가 보이지 않는 날에도 선을 심게 하시고, 움켜쥔 마음을 풀어 이웃을 사랑하게 하소서. 눈물의 시간을 외면하지 않으면서도 주께서 주실 열매를 기다리게 하소서. 아멘.","v":[{"ref":"시편 126:5-6","en":"Psalm 126:5-6","krv":"눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다 울며 씨를 뿌리러 나가는 자는 정녕 기쁨으로 그 단을 가지고 돌아오리로다","bsb":"Those who sow in tears will reap with shouts of joy. He who goes out weeping, bearing a trail of seed, will surely return with shouts of joy, carrying sheaves of grain."},{"ref":"고린도후서 9:6","en":"2 Corinthians 9:6","krv":"이것이 곧 적게 심는 자는 적게 거두고 많이 심는 자는 많이 거둔다 하는 말이로다","bsb":"Remember this: Whoever sows sparingly will also reap sparingly, and whoever sows generously will also reap generously."}],"src":[{"name":"Daily Hub · DIVINE_SOURCE","title":"2026-09-04 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"},{"name":"Bible Gateway","title":"Psalm 126 · ESV","url":"https://www.biblegateway.com/passage/?search=Psalm+126&version=ESV"},{"name":"Bible Gateway","title":"2 Corinthians 9 · ESV","url":"https://www.biblegateway.com/passage/?search=2+Corinthians+9&version=ESV"}],"sha":"fa80aa1b2b02c416013387a1f1f97eb8f08a3dff8ea2e9f679643499d6b10b93"},{"date":"2026-09-05","title":"성읍의 평안을 구하는 믿음","subtitle":"예레미야 29:7 · 로마서 13:4","tagline":"하나님을 사랑하는 믿음은 내가 사는 곳의 평안을 구하는 책임으로 이어진다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 예레미야 29:7\n예레미야가 편지를 보낸 대상은 바벨론에 끌려간 유다 백성이었다. 그들은 낯선 성읍을 잠시 머물다 떠날 곳으로 여기기 쉬웠지만, 하나님은 그 성읍의 평안을 힘쓰고 그곳을 위해 기도하라고 하셨다. 포로 된 현실을 선하다고 부르라는 뜻은 아니다. 돌아갈 날을 기다리는 동안에도 집을 짓고 밭을 일구며, 자신이 사는 자리의 평안에 책임 있게 참여하라는 명령이다. 하나님의 백성은 불편한 자리에서도 이웃의 안녕을 외면하지 않는다.\n\n### 둘째 말씀 — 로마서 13:4\n바울은 권세를 맡은 이를 “네게 선을 이루는 하나님의 사자”라고 부른다. 권세 자체를 무조건 옳다고 선언하는 말이 아니라, 권세가 선을 섬기고 악을 억제해야 할 목적을 밝히는 말이다. 이어지는 경고는 악에 대한 심판의 책임까지 포함한다. 그러므로 그리스도인은 통치자를 숭배하지도, 공적인 질서를 가볍게 여기지도 않는다. 권세가 맡은 목적을 기억하며 선과 정의를 분별하고, 양심을 따라 책임 있게 살아간다.\n\n### 두 말씀이 만나는 지점\n예레미야는 포로지의 성읍을 위해 기도하라고 하고, 바울은 공적 권세가 선을 위한 봉사자라고 말한다. 두 말씀은 믿음을 사적인 위안에 가두지 않는다. 우리가 사는 도시의 평안, 약한 이의 안전, 정직한 제도와 공동선은 기도의 바깥에 있지 않다. 동시에 어떤 도시나 권세도 하나님 자리를 차지할 수 없다. 하나님께 속한 사람은 맹목적으로 따르거나 냉소적으로 물러서기보다, 선을 요구하고 자신부터 선을 행하며 공동체의 평안을 구한다.\n\n### 오늘 붙잡을 한 줄\n하나님을 사랑하는 믿음은 내가 사는 곳의 평안을 구하는 책임으로 이어진다.\n\n## 오늘의 적용\n오늘 내가 속한 동네나 일터에서 평안을 해치는 작은 일을 하나 살펴보자. 확인하지 않은 말을 퍼뜨리는 습관, 공동 규칙을 나만 예외로 두는 태도, 도움이 필요한 사람을 모른 척한 순간일 수 있다. 비난을 먼저 늘어놓기보다 바로잡을 행동 하나를 정하고, 책임을 맡은 이들이 선과 정의를 섬기도록 구체적으로 기도하자.\n\n## 짧은 기도\n하나님, 제가 사는 곳의 평안을 남의 일로 여기지 않게 하소서. 권세를 두려움이나 숭배의 대상으로 만들지 않고, 선을 섬기도록 분별하며 기도하게 하소서. 오늘 제 자리에서 이웃의 안녕을 위해 정직한 행동 하나를 시작하게 하소서. 아멘.","v":[{"ref":"예레미야 29:7","en":"Jeremiah 29:7","krv":"너희는 내가 사로잡혀 가게 한 그 성읍의 평안하기를 힘쓰고 위하여 여호와께 기도하라 이는 그 성이 평안함으로 너희도 평안할 것임이니라","bsb":"Seek the prosperity of the city to which I have sent you as exiles. Pray to the LORD on its behalf, for if it prospers, you too will prosper."},{"ref":"로마서 13:4","en":"Romans 13:4","krv":"그는 하나님의 사자가 되어 네게 선을 이루는 자니라 그러나 네가 악을 행하거든 두려워하라 그가 공연히 칼을 가지지 아니하였으니 곧 하나님의 사자가 되어 악을 행하는 자에게 진노하심을 위하여 보응하는 자니라","bsb":"He is God’s servant for your good."}],"src":[{"name":"Daily Hub · DIVINE_SOURCE","title":"2026-09-05 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"},{"name":"Bible Gateway","title":"Jeremiah 29 · ESV","url":"https://www.biblegateway.com/passage/?search=Jeremiah+29&version=ESV"},{"name":"Bible Gateway","title":"Romans 13 · ESV","url":"https://www.biblegateway.com/passage/?search=Romans+13&version=ESV"}],"sha":"d01ad2cab02db7cebcd254a1498679f2ee211d07a178ee0891184ac84ceab54b"},{"date":"2026-09-06","title":"손의 일도 주님의 이름으로","subtitle":"출애굽기 20:15 · 골로새서 3:17","tagline":"하나님의 이름을 부르는 삶은 남의 것을 탐하지 않고, 내 손의 모든 일을 감사로 돌려드리는 데서 드러난다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 출애굽기 20:15\n“도적질하지 말라”는 계명은 남의 물건을 몰래 가져가지 말라는 최소한의 금지에 그치지 않는다. 십계명은 이웃의 생명과 관계, 소유를 차례로 보호하며 공동체가 서로의 것을 침범하지 않도록 경계를 세운다. 훔침은 물건 하나를 옮기는 행위처럼 보이지만, 그 안에는 이웃의 수고와 권리를 자기 욕망 아래 두는 태도가 들어 있다.\n\n### 둘째 말씀 — 골로새서 3:17\n바울은 말과 행동을 따로 떼지 않고 “무엇을 하든지” 주 예수의 이름으로 하라고 권한다. 주님의 이름으로 한다는 것은 모든 행동에 종교적 표지를 붙이는 일이 아니라, 말과 일의 방향을 그리스도 앞에서 점검하는 것이다. 감사는 내가 가진 것을 당연한 내 몫으로 움켜쥐기보다, 받은 것과 맡은 것을 바르게 다루게 한다.\n\n### 두 말씀이 만나는 지점\n출애굽기의 계명은 이웃의 것을 침범하지 말라고 선을 긋고, 골로새서는 내 말과 일을 주님의 이름 아래 놓으라고 요구한다. 정직은 손이 훔치지 않는 데서만 끝나지 않는다. 맡은 시간과 정보, 공로와 신뢰를 자기 것처럼 가로채지 않는 태도까지 포함한다. 감사하는 사람은 남의 몫을 빼앗아야만 풍성해진다는 거짓말을 거부하고, 자기 손에 들어온 것도 주님의 방식으로 사용한다.\n\n### 오늘 붙잡을 한 줄\n하나님의 이름을 부르는 삶은 남의 것을 탐하지 않고, 내 손의 모든 일을 감사로 돌려드리는 데서 드러난다.\n\n## 오늘의 적용\n오늘 내가 다루는 물건뿐 아니라 시간, 정보, 공로, 약속을 살펴보자. 남의 수고를 내 성과처럼 말했거나, 맡겨진 것을 내 편의를 위해 함부로 사용한 일이 있다면 작게라도 바로잡자. 누군가의 몫을 지켜 주는 정직한 행동 하나와, 이미 받은 것에 대한 구체적인 감사 하나를 실천하자.\n\n## 짧은 기도\n주 예수님, 제 손과 입술과 판단을 주님의 이름 아래 두게 하소서. 남의 것을 탐하거나 남의 수고를 가로채지 않게 하시고, 맡겨진 모든 일을 감사함으로 정직하게 감당하게 하소서. 아멘.","v":[{"ref":"출애굽기 20:15","en":"Exodus 20:15","krv":"도적질하지말지니라","bsb":"You shall not steal."},{"ref":"골로새서 3:17","en":"Colossians 3:17","krv":"또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라","bsb":"Whatever you do, in word or deed, do it all in the name of the Lord Jesus, giving thanks to God the Father through Him."}],"src":[{"name":"Daily Hub DIVINE_SOURCE","title":"2026-09-06 원문 행","url":"https://docs.google.com/spreadsheets/d/1T61P4RNl9dWPVI5jwaOJKEcycCoPq4MSjxIAK4j7boE/edit#gid=275452764&range=A249:Q249"},{"name":"Daily Divine","title":"Daily Divine 운영 페이지","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"c95f2b1044b683d68daf1354aef0e35d8dd9fd545e139ea4f44b43663bcd7779"},{"date":"2026-09-07","title":"진리와 화평이 만나는 길","subtitle":"시편 85:9-10 · 요한복음 14:6","tagline":"구원은 멀리 있는 관념이 아니라, 진리와 생명이신 그리스도 안에서 아버지께로 가까이 오는 길로 주어진다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 85:9-10\n시편 85편은 무너진 공동체가 다시 살기를 구하는 기도다. 오늘 말씀은 구원이 하나님을 경외하는 자에게 가까우며, 그 결과로 하나님의 영광이 땅에 머문다고 노래한다. 이어지는 “긍휼과 진리가 같이 만나고 의와 화평이 서로 입맞추었으며”라는 장면은 회복을 한 가지 감정으로 줄이지 않는다. 사랑과 진실, 의와 평화가 서로 밀어내지 않고 함께 서는 것이 이 시편이 바라보는 구원의 모습이다.\n\n### 둘째 말씀 — 요한복음 14:6\n요한복음 14장에서 도마는 예수께서 어디로 가시는지 알지 못하는데 어떻게 그 길을 알 수 있느냐고 묻는다. 예수님은 방향을 설명하는 지도를 주지 않고 자신을 “길이요 진리요 생명”이라고 말씀하신다. 아버지께 나아가는 길은 올바른 정보만 아는 데 있지 않고, 예수 그리스도와의 관계 안에서 열리는 길이다. 진리와 생명도 그 길과 떨어져 있는 추상적인 가치가 아니다.\n\n### 두 말씀이 만나는 지점\n두 본문은 서로 다른 자리에서 말하지만 함께 읽으면 한 가지 긴장이 선명해진다. 시편은 사랑과 진실, 의와 화평이 함께 만나는 회복을 기다리고, 요한복음은 길과 진리와 생명을 예수 그리스도 안에 묶어 둔다. 그래서 평화를 위해 진실을 버리거나, 옳음을 지킨다는 이유로 사랑을 잃는 선택은 성경이 말하는 회복을 충분히 보여 주지 못한다. 그리스도를 따른다는 것은 진리와 화평을 갈라 고르는 일이 아니라 둘을 함께 살아내는 길을 배우는 일이다.\n\n### 오늘 붙잡을 한 줄\n진리와 화평을 따로 고르지 말고, 길이신 그리스도 안에서 둘을 함께 살아내자.\n\n## 오늘의 적용\n오늘 내가 옳음을 말해야 하는 장면 하나를 떠올려 보자. 사실을 숨겨 평화를 가장하지도 말고, 사실을 말한다는 이유로 상대를 꺾으려 하지도 말자. 한 문장을 덜 날카롭게 고쳐 말하거나, 피하고 있던 필요한 말을 정직하고 온유하게 전해 보자. 진실과 평화가 함께 서는 작은 선택이 오늘의 길이 될 수 있다.\n\n## 짧은 기도\n주 예수님, 길과 진리와 생명이신 주님을 따라 걷게 하소서. 옳음을 붙든다는 이유로 사랑을 잃지 않게 하시고, 평화를 지킨다는 이유로 진실을 피하지 않게 하소서. 제 말과 행동 안에서 긍휼과 진리, 의와 화평이 함께 드러나게 하소서. 아멘.","v":[{"ref":"시편 85:9-10","en":"Psalm 85:9-10","krv":"진실로 그의 구원이 그를 경외하는 자에게 가까우니 이에 영광이 우리 땅에 거하리이다 긍휼과 진리가 같이 만나고 의와 화평이 서로 입맞추었으며","bsb":"Surely His salvation is near to those who fear Him, that His glory may dwell in our land. Loving devotion and faithfulness have joined together; righteousness and peace have kissed."},{"ref":"요한복음 14:6","en":"John 14:6","krv":"예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라","bsb":"I am the way and the truth and the life. No one comes to the Father except through Me."}],"src":[{"name":"Daily Hub DIVINE_SOURCE","title":"2026-09-07 원문 행","url":"https://docs.google.com/spreadsheets/d/1T61P4RNl9dWPVI5jwaOJKEcycCoPq4MSjxIAK4j7boE/edit#gid=275452764&range=A251:Q251"},{"name":"Daily Divine","title":"Daily Divine 운영 페이지","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"eb02fe52c1d11c358303b9b9069b4fa0bad86d41184af2ad9f5d81a43a5c56c2"},{"date":"2026-09-08","title":"새로운 삶이 시작되는 자리","subtitle":"요한복음 1:12 · 고린도후서 5:17","tagline":"새로운 삶은 자격을 증명하는 데서가 아니라, 그리스도 안에서 받은 관계를 믿고 걷는 데서 시작된다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 요한복음 1:12\n하나님의 자녀라는 이름은 무엇을 잘해 낸 사람에게 주는 상일까. 요한복음은 예수님을 영접하고 그 이름을 믿는 이들에게 이 자리가 주어진다고 말한다. 오늘 두 말씀은 더 나은 사람이 되려는 다짐보다, 그리스도 안에서 누구에게 속하게 되었는지를 먼저 묻게 한다.\n\n요한복음의 서두에는 빛이 세상에 왔지만 세상이 그를 알아보지 못했다는 어두운 대조가 있다. 그 거절 한가운데서 12절은 그를 받아들이는 이들에게 하나님의 자녀가 되는 권세가 주어졌다고 선언한다. 이어지는 13절은 이 출생이 혈통이나 인간의 의지에서 나온 것이 아니라 하나님께로부터 난 것이라고 설명한다. 믿음은 자녀의 자격을 만들어 내는 실적이 아니라, 오신 그리스도를 받아들이는 응답이다.\n\n### 둘째 말씀 — 고린도후서 5:17\n바울이 말하는 새로운 피조물은 성격을 조금 다듬은 사람을 뜻하는 데 그치지 않는다. 앞선 문맥에서 그리스도는 모든 사람을 위해 죽으셨고, 살아 있는 이들은 더 이상 자신만을 위해 살지 않도록 부름받는다. 사람을 평가하는 시선도 그리스도의 죽음과 부활을 중심으로 달라진다.\n\n17절 다음에는 이 모든 것이 하나님께로부터 왔으며, 하나님이 그리스도로 우리를 자신과 화목하게 하셨다는 설명이 이어진다. 새로움의 출발점은 내가 과거를 지우는 능력이 아니라 하나님이 여신 관계다. 이 말씀을 믿으면 옛 습관이나 상처가 즉시 사라진다고 약속하는 것은 본문보다 멀리 나가는 해석이다.\n\n### 두 말씀이 만나는 지점\n요한복음은 하나님의 자녀로 태어나는 일을, 고린도후서는 그리스도 안에서 새 창조에 참여하는 일을 말한다. 서로 다른 표현이지만 두 본문 모두 시작을 하나님께 둔다. 동시에 선물로 받은 관계는 삶을 그대로 방치하는 구실이 되지 않는다. 자녀로 받아들여진 사람은 자신만을 위해 살던 방향을 돌아보며, 화목하게 하신 분을 따라 다른 사람을 대하는 법을 배운다.\n\n### 오늘 붙잡을 한 줄\n새로운 삶은 자격을 증명하는 데서가 아니라, 그리스도 안에서 받은 관계를 믿고 걷는 데서 시작된다.\n\n## 오늘의 적용\n오늘 반복하기 쉬운 반응 하나를 골라 보자. 누군가를 지난 실수로만 규정하거나, 내 가치를 인정받으려고 말을 과장하는 순간일 수 있다. 그런 반응이 올라올 때 이미 받아 주신 하나님을 기억하고, 사실을 정직하게 말하거나 상대의 말을 끝까지 듣는 작은 행동을 택하자. 이것은 자녀가 되기 위한 조건이 아니라 자녀로서 배우는 걸음이다.\n\n## 짧은 기도\n하나님 아버지, 그리스도 안에서 저를 받아 주시고 새로운 삶으로 부르시니 감사합니다. 제 실패나 성취만으로 저 자신과 이웃을 판단하지 않게 하소서. 주신 관계를 믿고, 오늘 한 사람을 정직하고 온유하게 대하게 하소서. 예수님의 이름으로 기도합니다. 아멘.","v":[{"ref":"요한복음 1:12","en":"John 1:12","krv":"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","bsb":"To all who did receive Him, to those who believed in His name, He gave the right to become children of God."},{"ref":"고린도후서 5:17","en":"2 Corinthians 5:17","krv":"그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다","bsb":"If anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!"}],"src":[{"name":"Daily Hub DIVINE_SOURCE","title":"2026-09-08 로중 원문 · Daily Divine 연도 자료","url":"https://daily-divine.newjeans1029.chatgpt.site/sources"}],"sha":"1e435a9a5e6057e7c0922723a163d6688d4c2c5fd9d56dd7dd927189aa66bf30"},{"date":"2026-09-09","title":"슬픔보다 크신 기쁨","subtitle":"느헤미야 8:10 · 시편 33:21","tagline":"주님을 기뻐하는 힘은 슬픔을 부정하는 데서가 아니라, 슬픔보다 크신 하나님을 신뢰하는 데서 온다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 느헤미야 8:10\n무너졌던 예루살렘 성벽을 다시 세운 백성은 하나님의 율법을 듣고 울었다. 자신의 삶이 말씀에서 얼마나 멀어졌는지 깨달았기 때문이다. 느헤미야와 에스라는 그 눈물을 가볍게 여기지 않으면서도, 거룩한 날을 슬픔에만 가두지 말라고 한다. 먹을 것을 준비하지 못한 이들과 나누고 함께 기뻐하라는 명령은 회개가 공동체의 잔치와 돌봄으로 이어져야 함을 보여 준다.\n\n“여호와를 기뻐하는 것이 너희의 힘”이라는 말은 감정을 억지로 밝게 만들라는 주문이 아니다. 백성을 다시 모으시고 말씀을 들려주신 하나님 자신이 그들이 일어설 근거라는 뜻이다. 죄를 깨닫는 슬픔은 필요하지만, 하나님의 은혜보다 더 오래 중심을 차지해서는 안 된다.\n\n### 둘째 말씀 — 시편 33:21\n시편 33편은 군대의 수나 말의 힘이 사람을 구원하지 못한다고 노래한다. 시인은 눈에 보이는 자원의 크기가 아니라 언약을 지키시는 하나님의 인자하심을 기다린다. 그래서 마음의 즐거움은 형편이 모두 풀린 뒤 생기는 결과가 아니라, 하나님의 거룩한 이름을 신뢰하는 데서 솟는다.\n\n여기서 하나님의 이름은 단순한 호칭이 아니라 그분이 어떤 분이신지를 가리킨다. 신뢰는 막연한 낙관이 아니다. 창조하시고 말씀하시며 자기 백성을 살피시는 하나님의 성품에 마음의 무게를 싣는 일이다.\n\n### 두 말씀이 만나는 지점\n느헤미야의 백성은 말씀 앞에서 자신의 실패를 보았고, 시편의 공동체는 인간의 힘이 구원을 보장하지 못함을 안다. 두 본문 모두 즐거움을 현실 회피로 만들지 않는다. 오히려 부족함을 정직하게 본 뒤에도 하나님의 성품과 은혜가 마지막 말을 하게 한다. 그 기쁨은 혼자 간직하는 기분이 아니라, 준비하지 못한 이와 음식을 나누고 함께 기다리는 힘으로 드러난다.\n\n### 오늘 붙잡을 한 줄\n주님을 기뻐하는 힘은 슬픔을 부정하는 데서가 아니라, 슬픔보다 크신 하나님을 신뢰하는 데서 온다.\n\n## 오늘의 적용\n오늘 마음을 무겁게 하는 한 가지를 숨기지 말고 하나님 앞에 정확히 말해 보자. 그다음 나를 붙드는 근거를 내 능력이나 상황의 호전에서만 찾지 말고, 지금도 말씀하시고 돌보시는 하나님의 성품에서 찾아보자. 가능하다면 작은 음식이나 따뜻한 말 하나를 누군가와 나누며 받은 기쁨을 공동체의 힘으로 바꾸자.\n\n## 짧은 기도\n주님, 제 슬픔과 부족함을 정직하게 보게 하시되 거기에 갇히지 않게 하소서. 주님의 거룩한 이름을 신뢰하며 다시 일어설 힘을 얻게 하시고, 받은 기쁨을 이웃과 나누게 하소서. 예수님의 이름으로 기도합니다. 아멘.","v":[{"ref":"느헤미야 8:10","en":"Nehemiah 8:10","krv":"느헤미야가 또 이르기를 너희는 가서 살찐 것을 먹고 단 것을 마시되 예비치 못한 자에게는 너희가 나누어 주라 이 날은 우리 주의 성일이니 근심하지 말라 여호와를 기뻐하는 것이 너희의 힘이니라 하고","bsb":"Do not grieve, for the joy of the LORD is your strength."},{"ref":"시편 33:21","en":"Psalm 33:21","krv":"우리 마음이 저를 즐거워함이여 우리가 그 성호를 의지한 연고로다","bsb":"Our hearts rejoice in Him, since we trust in His holy name."}],"src":[{"name":"Daily Hub DIVINE_SOURCE","title":"2026-09-09 로중 원문 · Daily Divine 연도 자료","url":"https://daily-divine.newjeans1029.chatgpt.site/sources"}],"sha":"6fa0213f17827f4d932cfdadc79ca9b5b425f5769e74892a9a0032bd6902eef5"},{"date":"2026-09-10","title":"영원하신 분의 가득한 영광","subtitle":"시편 41:13 · 이사야 6:3","tagline":"흔들리는 오늘보다 영원하신 하나님이 더 크시며, 그분의 영광은 지금도 온 땅에 가득하다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 41:13\n시편 41편은 병들고 배신당한 사람이 하나님의 돌보심을 구하는 기도다. 시인은 가난한 이를 돌보는 자에게 베푸시는 복을 기억하고, 원수의 조롱과 가까운 친구의 배신까지 하나님 앞에 내놓는다. 마지막 13절의 찬송은 고통이 없었다는 선언이 아니다. 흔들리는 현실보다 영원하신 하나님을 더 큰 테두리로 삼는 고백이다.\n\n“영원부터 영원까지”라는 말은 오늘의 형편이 하나님의 신실하심을 다 설명하지 못한다는 뜻을 품는다. 두 번의 “아멘”은 이 찬송에 마음을 거듭 얹는 응답이다.\n\n### 둘째 말씀 — 이사야 6:3\n이사야는 웃시야 왕이 죽던 해에 높이 들린 보좌와 그 주위의 스랍들을 본다. 스랍들이 서로 부르는 “거룩하다”는 찬송은 하나님이 모든 피조물과 구별되신 분임을 드러낸다. 그 거룩함 앞에서 성전 문지방이 흔들리고 연기가 가득하며, 이사야는 먼저 자신의 부정함을 깨닫는다.\n\n그러나 “온 땅에 충만한 영광”은 하나님의 임재가 성전 안에만 갇히지 않음을 보여 준다. 왕의 죽음으로 시대가 흔들려도 참된 왕의 영광은 온 땅을 채운다.\n\n### 두 말씀이 만나는 지점\n시편의 찬송은 배신과 병의 한가운데서 영원하신 하나님을 바라보고, 이사야의 찬송은 왕이 사라진 때에도 보좌에 계신 거룩한 하나님을 본다. 두 본문은 안정된 상황이 찬송의 근거라고 말하지 않는다. 오히려 찬송은 흔들리는 현실을 하나님의 영원하심과 거룩하심 안에서 다시 보게 한다. 그 앞에서 인간은 자신을 정직하게 보고, 은혜로 새롭게 되어 부르심에 응답한다.\n\n### 오늘 붙잡을 한 줄\n흔들리는 오늘보다 영원하신 하나님이 더 크시며, 그분의 영광은 지금도 온 땅에 가득하다.\n\n## 오늘의 적용\n오늘 불안하게 만드는 현실 하나를 구체적으로 적어 보자. 그 문제를 축소하지 않은 채 “영원부터 영원까지” 계신 하나님과 나란히 놓고, 두 번의 아멘으로 신뢰를 고백하자. 거룩하신 하나님 앞에서 고쳐야 할 말이나 태도가 떠오르면 작은 순종 하나로 응답하자.\n\n## 짧은 기도\n영원하시고 거룩하신 하나님, 흔들리는 형편보다 주님을 크게 보게 하소서. 제 부정함을 숨기지 않고 은혜로 깨끗하게 하시는 주님을 의지하며, 오늘 맡기신 자리에서 순종하게 하소서. 예수님의 이름으로 기도합니다. 아멘.","v":[{"ref":"시편 41:13","en":"Psalm 41:13","krv":"여호와 이스라엘의 하나님을 영원부터 영원까지 찬송할지로다 아멘 아멘","bsb":"Blessed be the LORD, the God of Israel, from everlasting to everlasting."},{"ref":"이사야 6:3","en":"Isaiah 6:3","krv":"서로 창화하여 가로되 거룩하다 거룩하다 거룩하다 만군의 여호와여 그 영광이 온 땅에 충만하도다","bsb":"“Holy, holy, holy is the LORD of Hosts; all the earth is full of His glory.”"}],"src":[{"name":"Daily Divine · DIVINE_SOURCE","title":"2026-09-10 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"f0fccc4cf4a95591dc6bb7592c5be80a3217183b200741a7a0dfa6cdfcba2d91"},{"date":"2026-09-11","title":"주의 얼굴을 찾는 시선","subtitle":"시편 27:8 · 고린도후서 3:18","tagline":"주를 바라보는 동안 우리의 얼굴과 삶의 방향이 조금씩 바뀐다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 27:8\n\n하나님은 “내 얼굴을 찾으라”고 먼저 부르신다. 시인은 그 부름을 멀리서 들은 명령으로만 남겨 두지 않고, 자기 마음의 대답으로 받아 적는다. “여호와여 내가 주의 얼굴을 찾으리이다.” 믿음은 모든 사정이 정리된 뒤 하나님을 바라보는 일이 아니라, 복잡한 마음 한가운데서도 얼굴을 돌려 그분을 찾는 응답이다.\n\n### 둘째 말씀 — 고린도후서 3:18\n\n바울은 수건을 벗은 얼굴로 주의 영광을 바라보는 사람들이 그와 같은 형상으로 변화된다고 말한다. 이 변화는 자신을 단단히 고쳐 세우는 의지의 성과가 아니다. 주의 영이 우리를 “영광으로 영광에” 이르게 하신다. 바라봄은 현실 도피가 아니라, 성령께서 사람의 모습과 방향을 새롭게 하시는 자리다.\n\n### 두 말씀이 만나는 지점\n\n시편은 하나님을 찾으라는 부름과 마음의 응답을 들려주고, 고린도후서는 그렇게 주를 바라보는 사람 안에서 일어나는 변화를 보여 준다. 우리는 답을 얻기 위해서만 얼굴을 찾지 않는다. 그분 앞에 머무는 동안 굳어진 시선이 풀리고, 두려움과 분노로 닮아 가던 얼굴이 주님의 성품을 향해 조금씩 바뀐다.\n\n### 오늘 붙잡을 한 줄\n\n주의 얼굴을 찾는 시선이 오늘 내 얼굴과 삶의 방향을 바꾼다.\n\n## 오늘의 적용\n\n마음이 가장 자주 붙잡히는 걱정이나 사람을 하나 떠올려 보자. 그 생각을 억지로 지우기보다 잠시 멈추고 “주님, 오늘도 주의 얼굴을 찾습니다”라고 고백하자. 그리고 오늘 한 번, 그 사람을 대할 때 주님의 인내나 온유를 닮은 작은 반응을 선택해 보자.\n\n## 짧은 기도\n\n주님, 제 마음을 부르시는 음성을 듣게 하시고 주의 얼굴을 찾게 하소서. 제 힘으로 저를 고치려 애쓰기보다 성령께서 저를 주님의 형상으로 변화시키시는 일에 마음을 열게 하소서. 아멘.","v":[{"ref":"시편 27:8","en":"Psalm 27:8","krv":"너희는 내 얼굴을 찾으라 하실 때에 내 마음이 주께 말하되 여호와여 내가 주의 얼굴을 찾으리이다 하였나이다","bsb":"My heart said, “Seek His face.” Your face, O LORD, I will seek."},{"ref":"고린도후서 3:18","en":"2 Corinthians 3:18","krv":"우리가 다 수건을 벗은 얼굴로 거울을 보는 것 같이 주의 영광을 보매 저와 같은 형상으로 화하여 영광으로 영광에 이르니 곧 주의 영으로 말미암음이니라","bsb":"We, who with unveiled faces all reflect the glory of the Lord, are being transformed into His image with intensifying glory, which comes from the Lord, who is the Spirit."}],"src":[{"name":"Daily Divine · DIVINE_SOURCE","title":"2026-09-11 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"4f34f1d3658422a2aac446bfb259015aa09d7644ee716a220f685c3d5f8ff103"},{"date":"2026-09-12","title":"나뉘지 않은 마음으로 걷는 길","subtitle":"열왕기상 8:61 · 야고보서 1:7-8","tagline":"갈라진 마음을 숨기지 말고, 오늘의 한 걸음을 하나님께 다시 맞추자.","body":"## 로중 묵상\n\n### 첫째 말씀 — 열왕기상 8:61\n솔로몬은 성전 봉헌 기도를 마치며 백성에게 마음이 여호와와 온전히 하나가 되라고 권한다. 여기서 “완전한 마음”은 흠 하나 없는 감정 상태라기보다, 하나님의 법도와 계명을 따라 걷도록 방향이 나뉘지 않은 마음이다. 성전의 장엄함도 언약에 응답하는 삶을 대신할 수 없다. 하나님이 가까이 계시다는 고백은 오늘의 걸음으로 이어져야 한다.\n\n### 둘째 말씀 — 야고보서 1:7-8\n야고보는 지혜를 구하되 의심하며 흔들리는 사람을 “두 마음을 품은 사람”이라고 부른다. 이것은 질문이 생기거나 믿음이 약해지는 순간 자체를 정죄하는 말이 아니다. 하나님께 구하면서도 실제 삶의 주도권은 끝까지 놓지 않으려는 분열을 드러낸다. 파도처럼 밀려다니는 까닭은 정보가 부족해서만이 아니라, 의지할 중심이 둘로 갈라졌기 때문이다.\n\n### 두 말씀이 만나는 지점\n열왕기상은 마음을 하나님과 화합하여 그 길을 걷으라고 부르고, 야고보서는 두 마음이 사람의 모든 길을 불안정하게 만든다고 경고한다. 두 본문은 신앙을 순간의 열정이나 말의 동의에 가두지 않는다. 한마음은 망설임이 전혀 없는 강한 성격이 아니라, 망설이는 중에도 다시 하나님께 방향을 맞추고 순종의 한 걸음을 택하는 신실함이다.\n\n### 오늘 붙잡을 한 줄\n갈라진 마음을 숨기지 말고, 오늘의 한 걸음을 하나님께 다시 맞추자.\n\n## 오늘의 적용\n기도하면서도 놓지 않으려는 선택 하나를 떠올려 보자. 그 선택을 하나님 앞에 구체적으로 말하고, 이미 아는 말씀에 순종할 수 있는 가장 작은 행동을 오늘 안에 정하자. 마음의 확신이 완벽해질 때까지 기다리기보다, 방향을 분명히 하는 한 걸음으로 기도에 응답하자.\n\n## 짧은 기도\n주님, 제 안의 두 마음을 밝히 보게 하시고 숨기지 않게 하소서. 흔들릴 때마다 주님께 다시 방향을 맞추며, 오늘 주신 말씀을 작은 순종으로 살아 내게 하소서. 예수님의 이름으로 기도합니다. 아멘.","v":[{"ref":"열왕기상 8:61","en":"1 Kings 8:61","krv":"그런즉 너희 마음을 우리 하나님 여호와와 화합하여 완전케 하여 오늘날과 같이 그 법도를 행하며 그 계명을 지킬지어다","bsb":"Let your heart be fully devoted to the LORD our God."},{"ref":"야고보서 1:7-8","en":"James 1:7-8","krv":"이런 사람은 무엇이든지 주께 얻기를 생각하지 말라 두 마음을 품어 모든 일에 정함이 없는 자로다","bsb":"That man should not expect to receive anything from the Lord. He is a double-minded man, unstable in all his ways."}],"src":[{"name":"Daily Divine · DIVINE_SOURCE","title":"2026-09-12 로중 원문","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"f1bc047dfaa15cd640934e869bd58bcce4a14d12d89c500fbad2d844663534d8"},{"date":"2026-09-13","title":"변하는 날들 아래의 영원한 팔","subtitle":"신명기 33:27 · 히브리서 13:8","tagline":"달라지는 하루를 살면서도, 나를 붙드시는 주님께 신뢰를 둘 수 있다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 신명기 33:27\n모세는 죽음을 앞두고 이스라엘을 축복하며, 그들이 머물 곳은 영원하신 하나님이라고 말한다. 백성을 이끌던 사람은 떠나도 그들을 받치는 팔까지 사라지는 것은 아니다. 이 말씀은 내가 얼마나 단단히 버티는가보다 누구에게 붙들려 있는가를 묻게 한다.\n\n‘네 아래’ 있는 팔은 멀리서 지켜보기만 하는 보호자의 모습과 다르다. 이어지는 대적에 관한 말씀까지 읽으면, 이 축복은 막연한 평온이 아니라 위협 속에서 백성을 지키시는 하나님의 능력을 노래한다. 이스라엘에게 주어진 승리의 표현을 오늘 나와 갈등하는 사람을 제거해 주신다는 약속으로 옮겨서는 안 된다.\n\n### 둘째 말씀 — 히브리서 13:8\n히브리서는 하나님의 말씀을 전해 준 지도자들을 기억하고 그 믿음을 본받으라는 권면 뒤에, 예수 그리스도가 영원히 동일하시다고 고백한다. 이어서는 여러 낯선 가르침에 끌려가지 말고 은혜로 마음을 굳게 하라고 한다. 사람과 상황이 달라지는 가운데 믿음의 기준을 어디에 둘지 밝히는 말씀이다.\n\n그리스도가 동일하시다는 것은 우리의 일상이 어제와 똑같이 유지된다는 뜻이 아니다. 익숙한 사람이 떠나거나 삶의 조건이 바뀌어도 그리스도께 대한 믿음의 근거는 없어지지 않는다. 변하지 않는 주님을 붙드는 일은 변화 자체를 거부하는 태도와 구별된다.\n\n### 두 말씀이 만나는 지점\n신명기의 축복은 백성이 머물 처소와 그 아래의 팔을 말하고, 히브리서는 세월을 지나도 동일하신 그리스도를 가리킨다. 두 본문의 상황은 같지 않지만, 신뢰의 근거를 지나가는 사람이나 조건이 아니라 하나님께 둔다는 점에서 만난다. 안전을 내가 모든 변수를 통제하는 상태로만 생각한다면, 이미 나를 받치고 있는 은혜는 보이지 않기 쉽다.\n\n### 오늘 붙잡을 한 줄\n달라지는 하루를 살면서도, 나를 붙드시는 주님께 신뢰를 둘 수 있다.\n\n## 오늘의 적용\n요즘 바뀔까 봐 두려워하는 조건 하나를 하나님 앞에 구체적으로 말해 보자. 그것이 그대로 유지되어야만 하나님을 신뢰할 수 있다고 생각했는지도 돌아보자. 결과를 장담하는 대신, 오늘 맡은 책임 한 가지를 정직하게 수행하며 필요한 도움을 구하자.\n\n## 짧은 기도\n영원하신 하나님, 눈앞의 조건만 붙들려는 제 마음을 주님께 돌려 주소서. 변화를 겪을 때에도 그리스도의 신실하심을 의지하고, 오늘 맡은 일을 은혜 안에서 감당하게 하소서. 예수님의 이름으로 기도합니다. 아멘.","v":[{"ref":"신명기 33:27","en":"Deuteronomy 33:27","krv":"영원하신 하나님이 너의 처소가 되시니 그 영원하신 팔이 네 아래 있도다 그가 네 앞에서 대적을 쫓으시며 멸하라 하시도다","bsb":"The eternal God is your dwelling place, and underneath are the everlasting arms."},{"ref":"히브리서 13:8","en":"Hebrews 13:8","krv":"예수 그리스도는 어제나 오늘이나 영원토록 동일하시니라","bsb":"Jesus Christ is the same yesterday and today and forever."}],"src":[{"name":"Daily Divine","title":"2026-09-13 성구 데이터 확인","url":"https://daily-divine.newjeans1029.chatgpt.site/api/hub/verify?date=2026-09-13"}],"sha":"2734769fa2f49665defbe8c8028aeed6b36cf484c250db0f7df9fdf9bf68977b"},{"date":"2026-09-14","title":"기다림 속에서 부르는 자비","subtitle":"예레미야애가 3:25 · 마가복음 10:48","tagline":"기다리는 동안에도 주님께 자비를 구하는 기도를 멈추지 않는다.","body":"## 로중 묵상\n### 첫째 말씀 — 예레미야애가 3:25\n기다림은 아무 말도 하지 않는 것일까요. 예레미야애가는 무너진 삶의 고통을 숨기지 않으면서, 기다리는 영혼에게 하나님이 선하시다고 말합니다. 이 선하심은 고통이 없다는 설명이 아니라, 고통 속에서도 누구를 찾아야 하는지를 가리킵니다.\n\n3장의 화자는 자신의 괴로움과 쓴 기억을 되짚은 뒤, 여호와의 인자와 긍휼을 마음에 떠올립니다. 25절의 기다림은 그 전환 안에 놓여 있습니다. 이어지는 잠잠히 구원을 기다리라는 권면도 아픔을 대수롭지 않게 여기라는 말이 아닙니다. 아직 보이지 않는 구원을 스스로 만들어 내기보다 하나님의 신실하심에 기대는 자세입니다.\n\n### 둘째 말씀 — 마가복음 10:48\n길가에 앉아 있던 바디매오는 예수께서 지나가신다는 말을 듣고 불쌍히 여겨 달라고 외칩니다. 사람들이 조용히 하라고 꾸짖어도 그의 간청은 더 커집니다. 여기서 믿음은 남의 시선을 이겨 내는 강한 성격이라기보다, 자신을 도우실 분께 자비를 구하는 모습으로 드러납니다.\n\n예수께서는 걸음을 멈추고 그를 부르십니다. 무엇을 원하는지 물으시고, 보기를 원하는 그의 간청에 응답하십니다. 이야기는 치유에서 끝나지 않고 그가 길에서 예수를 따르는 장면으로 이어집니다. 이 한 사건을 모든 간절한 기도가 곧바로 같은 결과를 얻는 공식으로 바꿀 수는 없습니다.\n\n### 두 말씀이 만나는 지점\n한 말씀은 잠잠한 기다림을, 다른 말씀은 멈추지 않는 부르짖음을 보여 줍니다. 겉모습은 달라도 두 사람의 시선은 하나님께 향합니다. 기다림과 간구는 서로 반대가 아닙니다. 결과를 움켜쥐려 하지 않으면서도 필요한 자비를 구할 수 있습니다. 믿음을 목소리의 크기나 감정의 고요함으로 재기보다, 누구를 향해 기다리고 부르는지 살펴보게 됩니다.\n\n### 오늘 붙잡을 한 줄\n기다리는 동안에도 주님께 자비를 구하는 기도를 멈추지 않는다.\n\n## 오늘의 적용\n해결을 서두르고 싶은 일 하나를 하나님 앞에 구체적으로 아뢰어 봅니다. 원하는 것을 숨기지도, 원하는 때에 응답하셔야 한다고 요구하지도 않습니다. 오늘 내가 할 수 있는 정직한 한 걸음을 행하고, 아직 내 손에 없는 결과는 주님께 맡깁니다.\n\n## 짧은 기도\n주님, 조급함 때문에 주님의 선하심을 잊지 않게 하소서. 잠잠히 기다릴 때에도 간절히 부를 때에도 주님을 향하게 하시고, 받은 자비를 따라 오늘의 길을 걷게 하소서. 아멘.","v":[{"ref":"예레미야애가 3:25","en":"Lamentations 3:25","krv":"무릇 기다리는 자에게나 구하는 영혼에게 여호와께서 선을 베푸시는도다","bsb":"The LORD is good to those who wait for Him, to the soul who seeks Him."},{"ref":"마가복음 10:48","en":"Mark 10:48","krv":"많은 사람이 꾸짖어 잠잠하라 하되 그가 더욱 소리질러 가로되 다윗의 자손이여 나를 불쌍히 여기소서 하는지라","bsb":"Many people admonished him to be silent, but he cried out all the louder, “Son of David, have mercy on me!”"}],"src":[{"name":"Daily Divine","title":"2026-09-14 성구 데이터 확인","url":"https://daily-divine.newjeans1029.chatgpt.site/api/hub/verify?date=2026-09-14"}],"sha":"0ff4f7d1190be24d017d2bfc9dc761792166550acd9a9ceeabd467b5422b54cd"},{"date":"2026-09-15","title":"사랑을 지키는 돌아봄","subtitle":"여호수아 23:11 · 히브리서 12:15","tagline":"하나님을 사랑하는 마음으로 내 안의 쓴 뿌리와 서로의 필요를 돌아본다.","body":"## 로중 묵상\n### 첫째 말씀 — 여호수아 23:11\n여호수아는 약속의 땅에 들어온 뒤, 이스라엘이 어떻게 그 자리에 서게 되었는지를 돌아보게 합니다. 그의 마지막 권면은 복잡한 전략보다 먼저 “너희 하나님 여호와를 사랑하라”는 말입니다. 사랑은 마음속 감정에만 머무르지 않고, 하나님을 떠나게 하는 길을 경계하며 그분께 붙드는 삶으로 드러납니다.\n\n“스스로 조심하라”는 말에는 방심하지 말라는 뜻이 담겨 있습니다. 이미 많은 일을 경험했고 정착도 시작됐지만, 그때야말로 하나님을 향한 마음을 쉽게 잃을 수 있기 때문입니다. 은혜를 오래 받았다는 사실이 사랑을 자동으로 지켜 주지는 않습니다.\n\n### 둘째 말씀 — 히브리서 12:15\n히브리서는 한 사람이 하나님의 은혜에서 멀어지지 않도록 서로 돌아보라고 권합니다. 쓴 뿌리는 마음속에 숨은 불만이 굳어지는 모습입니다. 그것이 자라면 자신만 괴롭게 하는 데서 끝나지 않고, 가까운 사람들에게도 상처와 혼란을 퍼뜨립니다.\n\n이 말씀은 누군가의 속마음을 단정하라는 요구가 아닙니다. 은혜를 놓치고 있지는 않은지, 관계 안에 굳어 가는 원망은 없는지 함께 살피라는 부르심입니다. 사랑은 무관심하게 지나치는 것이 아니라, 은혜로 다시 돌아오도록 곁을 지키는 일입니다.\n\n### 두 말씀이 만나는 지점\n하나님을 사랑하라는 권면과 쓴 뿌리를 경계하라는 권면은 한 방향을 가리킵니다. 마음이 하나님께 붙들릴 때 원망이 자랄 자리를 내어 주지 않게 됩니다. 또한 그 사랑은 혼자 지키는 결심에 그치지 않고, 서로의 은혜를 살피는 공동체의 모습으로 이어집니다.\n\n### 오늘 붙잡을 한 줄\n하나님을 사랑하는 마음으로 내 안의 쓴 뿌리와 서로의 필요를 돌아본다.\n\n## 오늘의 적용\n오늘 마음에 오래 남아 있는 서운함 하나를 하나님 앞에 정직하게 꺼내 봅니다. 그것을 핑계로 사람에게서 멀어지기보다, 은혜 안에서 풀어 갈 수 있도록 기도합니다. 가까운 한 사람에게도 판단보다 관심으로 안부를 묻습니다.\n\n## 짧은 기도\n주님, 받은 은혜를 잊어 마음이 굳어지지 않게 하소서. 주님을 사랑하게 하시고, 내 안의 쓴 뿌리를 살피며 서로를 은혜로 돌아보게 하소서. 아멘.","v":[{"ref":"여호수아 23:11","en":"Joshua 23:11","krv":"그러므로 스스로 조심하여 너희 하나님 여호와를 사랑하라","bsb":"Therefore watch yourselves carefully, that you love the LORD your God."},{"ref":"히브리서 12:15","en":"Hebrews 12:15","krv":"너희는 돌아보아 하나님 은혜에 이르지 못하는 자가 있는가 두려워하고 또 쓴 뿌리가 나서 괴롭게 하고 많은 사람이 이로 말미암아 더러움을 입을까 두려워하고","bsb":"See to it that no one falls short of the grace of God, and that no root of bitterness springs up to cause trouble and defile many."}],"src":[{"name":"Daily Divine","title":"2026-09-15 성구 데이터 확인","url":"https://daily-divine.newjeans1029.chatgpt.site/api/hub/verify?date=2026-09-15"}],"sha":"3efec8e3a12911e9e71374c5ab1556c445421b10cdecf789af1178c38c087fb0"},{"date":"2026-09-16","title":"멈추어 다시 서는 사람","subtitle":"시편 46:10 · 레위기 26:13","tagline":"멈추어 하나님을 알고, 풀려난 몸으로 다시 바르게 걷는다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 46:10\n“가만히 있어 내가 하나님 됨을 알지어다.” 이 말씀은 아무 일도 하지 말라는 체념이 아니다. 내가 세상을 붙들고 있어야만 모든 것이 유지된다는 생각을 멈추라는 초대에 가깝다. 손에 쥔 힘과 판단을 잠시 내려놓고, 하나님이 하나님이심을 인정할 때 마음은 상황보다 더 큰 분을 바라보게 된다.\n\n가만히 있는 시간은 현실을 외면하는 시간이 아니다. 두려움과 조급함을 그대로 안고도, 그것들이 내 삶의 주인이 되지 못하게 자리를 바꾸는 시간이다. 하나님을 안다는 것은 정보를 더 많이 갖는 일이 아니라, 내가 통제할 수 없는 자리에서도 그분의 주권을 신뢰하는 방향으로 몸과 마음을 돌리는 일이다.\n\n### 둘째 말씀 — 레위기 26:13\n하나님은 이스라엘을 애굽에서 이끌어 내시고 종의 멍에를 깨뜨리셨다고 말씀하신다. 구원은 억압에서 빠져나왔다는 과거의 표지만이 아니다. 하나님은 “바로 서서 걷게” 하신다. 굽은 몸으로 겨우 버티던 사람이 자기 발로 서서, 더 이상 종의 자세가 아닌 자유의 걸음으로 나아가게 하신다는 약속이다.\n\n### 두 말씀이 만나는 지점\n한 말씀은 멈추라고 하고, 다른 말씀은 바로 서서 걸으라고 한다. 둘은 서로 반대가 아니다. 하나님 앞에서 멈추는 사람은 자기 힘으로 자신을 구해야 한다는 멍에를 내려놓고, 그분이 깨뜨리신 멍에를 다시 메지 않은 채 걸음을 시작한다. 참된 쉼은 무기력이 아니라 신뢰이며, 참된 자유는 제멋대로가 아니라 하나님께 받은 방향으로 서는 힘이다.\n\n### 오늘 붙잡을 한 줄\n멈추어 하나님을 알고, 풀려난 몸으로 다시 바르게 걷는다.\n\n## 오늘의 적용\n오늘 마음을 몰아붙이는 일 하나 앞에서 잠시 손을 멈춥니다. 먼저 하나님이 하나님이심을 고백한 뒤, 내가 책임질 수 있는 한 걸음과 내려놓아야 할 결과를 구분해 봅니다. 누군가를 대할 때에는 나와 상대를 묶어 두는 말 한마디를 줄이고, 자유를 받은 사람답게 정직하고 바른 태도로 행동합니다.\n\n## 짧은 기도\n주님, 모든 것을 통제하려는 조급함에서 저를 잠시 멈추게 하소서. 주님이 깨뜨리신 멍에를 다시 짊어지지 않게 하시고, 주님을 신뢰하는 고요함에서 오늘의 한 걸음을 내딛게 하소서. 굽은 마음을 펴시고 자유롭게 주님을 따르게 하소서. 아멘.","v":[{"ref":"시편 46:10","en":"Psalm 46:10","krv":"이르시기를 너희는 가만히 있어 내가 하나님 됨을 알지어다 내가 열방과 세계 중에서 높임을 받으리라 하시도다","bsb":"Be still and know that I am God."},{"ref":"레위기 26:13","en":"Leviticus 26:13","krv":"나는 너희를 애굽 땅에서 인도하여 내어 그 종된 것을 면케 한 너희 하나님 여호와라 내가 너희 멍에 빗장목을 깨뜨리고 너희로 바로 서서 걷게 하였느니라","bsb":"I am the LORD your God, who brought you out of the land of Egypt so that you would no longer be slaves to the Egyptians."}],"src":[{"name":"Daily Divine","title":"2026-09-16 성구 데이터 확인","url":"https://daily-divine.newjeans1029.chatgpt.site/api/hub/verify?date=2026-09-16"}],"sha":"2c71a368f681841e273c17353f9c7ae671e99469041f8f8a456cf57b80bbae62"},{"date":"2026-09-19","title":"먼저 내 눈의 들보를 보라","subtitle":"누가복음 6:42 · 로마서 2:1","tagline":"남을 판단하는 눈보다 먼저, 같은 기준 앞에 선 나를 보게 하소서.","body":"## 로중 묵상\n### 첫째 말씀 — 누가복음 6:42\n예수님은 형제의 눈에서 티를 빼 주겠다는 말보다 먼저, 자기 눈 속의 들보를 보라고 하신다. 문제는 남의 잘못을 알아보는 능력이 아니라, 자기 안의 더 크고 가까운 결함을 보지 못한 채 교정자의 자리에 서는 태도다. “외식하는 자”라는 호칭은 죄가 있다는 사실만이 아니라, 자기 죄를 가린 채 남의 죄를 다루려는 분열을 겨냥한다.\n\n### 둘째 말씀 — 로마서 2:1\n바울도 같은 방향에서 판단하는 사람의 핑계를 막는다. 남을 정죄하는 기준을 세우면서 자신은 그 기준 밖에 있다고 생각할 수 없다는 것이다. 특히 로마서 1장의 죄 목록을 들은 뒤 다른 사람을 심판하는 독자는, 자신도 같은 방식으로 하나님 앞에 서야 한다는 사실을 마주한다. 정죄의 말이 곧바로 자기 자신에게 돌아오는 이유다.\n\n### 두 말씀이 만나는 지점\n두 본문은 분별 자체를 없애지 않는다. 형제의 눈을 살피는 일도, 악을 악이라 부르는 일도 사라지지 않는다. 먼저 요구되는 것은 시선의 순서다. 자기 눈의 들보를 인정한 사람만이 남을 지배하는 판정자가 아니라 함께 고침을 구하는 형제로 다가갈 수 있다.\n\n### 오늘 붙잡을 한 줄\n남을 바로잡기 전에, 내가 같은 기준 앞에 서 있는지 먼저 보자.\n\n## 맥체인 성경읽기365\n### 사무엘하 15장\n압살롬의 반역은 하루아침의 폭발보다 오랜 시간 사람들의 마음을 훔쳐 온 정치적 연출로 시작된다. 다윗은 왕의 자리를 붙들기보다 예루살렘을 떠나며, 자신의 죄와 하나님의 섭리를 모두 알 수 없는 자리에서 피난길을 걷는다. 본문은 권력의 위기와 함께, 판단을 서두를 수 없는 왕의 낮아짐을 보여 준다.\n\n### 고린도후서 8장\n바울은 마게도냐 교회들의 가난한 중에도 넘친 연보를 말하며, 헌금을 경쟁이나 압박으로 만들지 않는다. 그리스도의 은혜가 기준이다. 주께서 부요하신 분으로서 우리를 위하여 가난하게 되셨다는 복음이, 공동체 안에서 서로의 부족을 채우는 자발적 나눔으로 번역된다.\n\n### 에스겔 22장\n예루살렘의 죄는 몇몇 악인의 일탈로 축소되지 않는다. 지도자·제사장·선지자·백성이 각자의 자리에서 힘을 남용하고 거룩한 것을 가볍게 여긴다. 하나님은 공동체 전체에 퍼진 불의를 낱낱이 드러내시며, 외형적 종교가 정의의 붕괴를 덮을 수 없음을 밝히신다.\n\n### 시편 69편\n시편 기자는 고난을 아름답게 포장하지 않고, 물이 목까지 차오른 것처럼 하나님께 호소한다. 조롱과 소외 속에서도 그는 하나님을 향한 열심과 구원의 소망을 놓지 않는다. 탄식은 믿음의 반대가 아니라, 하나님 외에는 다른 피난처가 없다는 고백의 거친 형태다.\n\n### 네 본문을 함께 읽기\n네 본문은 자기 의와 자기 보존의 욕망을 서로 다른 장면에서 드러낸다. 압살롬의 정치적 자기확장, 공동체의 불평등, 예루살렘의 구조적 부패, 시편 기자의 무너진 자리 모두를 하나님 앞에서 숨길 수 없다. 그 앞에서 필요한 첫 행동은 남을 재판하는 말이 아니라 자기 모습을 밝히 보는 일이다.\n\n## 오늘의 적용\n오늘 누군가의 잘못을 지적해야 할 때, 그 행동이 책임 있는 돌봄인지 우월감을 확인하는 판정인지 먼저 살피자. 내 안에도 같은 방향의 욕망과 말이 있는지 하나님 앞에 구체적으로 인정하자. 그 뒤에야 필요한 말은 짧고 정확하게, 상대를 꺾기보다 회복을 향하도록 건네자.\n\n## 짧은 기도\n하나님, 남의 허물을 빠르게 보는 눈보다 제 안의 죄를 먼저 보게 하소서. 정죄하는 마음을 내려놓고 진실하게 회개하게 하시며, 필요한 말을 하더라도 교만이 아니라 사랑과 회복을 향해 말하게 하소서. 아멘.","v":[{"ref":"누가복음 6:42","en":"Luke 6:42","krv":"너는 네 눈 속에 있는 들보를 보지 못하면서 어찌하여 형제에게 말하기를 형제여 나로 네 눈 속에 있는 티를 빼게 하라 할 수 있느냐 외식하는 자여 먼저 네 눈 속에서 들보를 빼어라 그 후에야 네가 밝히 보고 형제의 눈 속에 있는 티를 빼리라","bsb":"You hypocrite! First take the beam out of your own eye, and then you will see clearly to remove the speck from your brother’s eye."},{"ref":"로마서 2:1","en":"Romans 2:1","krv":"그러므로 남을 판단하는 사람아 무론 누구든지 네가 핑계치 못할 것은 남을 판단하는 것으로 네가 너를 정죄함이니 판단하는 네가 같은 일을 행함이니라","bsb":"You, therefore, have no excuse, you who pass judgment on another. For on whatever grounds you judge the other, you are condemning yourself, because you who pass judgment do the same things."}],"src":[{"name":"Daily Divine","title":"오늘 원문 /today","url":"https://daily-divine.newjeans1029.chatgpt.site/today"}],"sha":"4cccc6fb14b99b8c8e7c98a4f6b56a5292350c15547c6c3e464ec728fd711215"},{"date":"2026-09-20","title":"도우시는 하나님 앞에서 염려를 내려놓다","subtitle":"창세기 49:25 · 누가복음 12:25–26","tagline":"도우시는 하나님을 신뢰할 때, 내 힘으로 더하려는 염려를 내려놓을 수 있다.","body":"## 로중 묵상\n### 첫째 말씀 — 창세기 49:25\n야곱은 요셉을 축복하며 도움의 근원을 아버지의 하나님께 둔다. “그가 너를 도우실 것이요”라는 말은 요셉이 모든 상황을 혼자 감당해야 한다는 생각을 끊는다. 전능하신 분의 복은 하늘 위의 복과 땅 아래 샘의 복, 생명을 기르는 복으로 펼쳐진다. 하나님은 막연히 힘을 보태시는 분이 아니라, 삶이 다시 살아갈 수 있도록 위와 아래에서 공급하시는 분이다.\n\n이 축복은 어려움이 없으리라는 약속이 아니다. 오히려 긴 가족사와 낯선 땅을 지나온 요셉에게, 지금까지의 길과 앞으로의 길이 하나님의 돌보심 안에 있다는 사실을 확인한다. 도움을 받는 사람은 자기 약함을 숨기지 않아도 된다. 내가 모든 것을 마련해야 한다는 부담을 내려놓을 때, 이미 주어진 은혜와 아직 오지 않은 공급을 함께 바라볼 수 있다.\n\n### 둘째 말씀 — 누가복음 12:25–26\n예수님은 염려가 실제로 무엇을 더할 수 있는지 물으신다. 한 자, 혹은 한 시간을 더하는 작은 일조차 자기 힘으로 할 수 없다면, 아직 오지 않은 모든 일을 미리 통제하려는 염려는 얼마나 무거운가. 예수님의 질문은 걱정을 꾸짖는 데서 끝나지 않고, 염려가 내 능력의 크기를 넘어선다는 사실을 정직하게 인정하게 한다.\n\n### 두 말씀이 만나는 지점\n창세기의 축복은 하나님이 도우시는 분이라고 말하고, 복음의 질문은 내가 염려로 더할 수 있는 것이 매우 작다고 말한다. 둘을 함께 읽으면 믿음은 무책임한 낙관이 아니라 의존의 방향을 바로잡는 일임을 알게 된다. 오늘 필요한 수고는 하되, 결과까지 내 손으로 만들어 내야 한다고 여기지 않는 것. 도움을 구할 줄 알고, 할 수 없는 일을 하나님께 맡기는 것이 믿음의 실제 모습이다.\n\n### 오늘 붙잡을 한 줄\n도우시는 하나님을 신뢰할 때, 내 힘으로 더하려는 염려를 내려놓을 수 있다.\n\n## 맥체인 성경읽기365\n### 사무엘하 16장\n다윗이 예루살렘을 떠나자 사람들은 저마다 다른 방식으로 그의 길에 들어온다. 시바는 속임수로 이익을 얻고, 시므이는 저주를 퍼붓지만, 다윗은 그 말 속에도 하나님이 허락하신 뜻이 있을 수 있다며 복수하지 않는다. 왕의 자리를 잃은 사람은 모든 일을 즉시 해석하거나 되갚지 않고, 낮아진 자리에서 하나님의 판단을 기다린다.\n\n### 고린도후서 9장\n바울은 연보를 억지로 내게 하지 않고, 마음에 정한 대로 즐겨 내는 나눔을 말한다. 하나님은 씨를 뿌리는 사람에게 양식을 주실 뿐 아니라 의의 열매도 더하게 하신다. 풍성함은 쌓아 두는 양이 아니라 감사와 나눔으로 흘러가는 통로가 될 때 본래 목적을 이룬다.\n\n### 에스겔 23장\n오홀라와 오홀리바의 비유는 하나님을 떠난 욕망이 어떻게 정치적 의존과 영적 배신으로 번지는지 드러낸다. 겉으로는 화려한 동맹과 힘을 좇았지만, 그 선택은 결국 자신을 삼키는 심판을 불러온다. 눈에 보이는 안전을 붙드는 일이 하나님을 신뢰하는 것과 같은지는 다시 물어야 한다.\n\n### 시편 70–71편\n시편 기자는 “속히 나를 도우소서”라고 반복해서 기도한다. 구원은 이미 충분히 강한 사람에게만 주어지는 것이 아니라, 늦기 전에 도와 달라고 외치는 사람에게도 임한다. 젊을 때부터 지금의 늙은 날까지 하나님을 피난처로 삼아 온 기억은 현재의 급한 기도와 이어진다.\n\n### 네 본문을 함께 읽기\n네 본문은 도움을 구하는 사람의 여러 모습을 보여 준다. 다윗은 모욕을 견디고, 고린도 교회는 가진 것을 나누며, 에스겔의 백성은 거짓된 의존을 폭로당하고, 시편 기자는 지체 없이 도와 달라고 부르짖는다. 믿음은 혼자 견디는 표정이 아니라 누구를 의지할지 분명히 하는 선택이다.\n\n## 오늘의 적용\n오늘 염려가 반복해서 떠오르는 일을 하나 적어 보자. 그 일에서 내가 실제로 책임질 수 있는 한 걸음과, 결과를 통제하려는 마음을 구분한다. 할 수 있는 연락이나 준비는 성실히 하되, 아직 일어나지 않은 장면을 머릿속에서 끝없이 재판하지 않는다. 짧게라도 “주님, 저를 도우소서”라고 기도하며 도움을 받을 자리를 남겨 두자.\n\n## 짧은 기도\n하나님, 하늘과 땅의 복으로 우리를 돌보시는 주님을 믿게 하소서. 염려로 제 삶에 무언가를 더하려는 마음을 내려놓고, 오늘 맡겨진 일을 성실히 하되 결과는 주님의 손에 맡기게 하소서. 도움이 필요할 때 숨기지 않고 주님께 부르짖게 하시며, 받은 도움을 이웃에게 흘려보내게 하소서. 아멘.","v":[{"ref":"창세기 49:25","en":"Genesis 49:25","krv":"네 아비의 하나님께로 말미암나니 그가 너를 도우실 것이요 전능자로 말미암나니 그가 네게 복을 주실 것이라 위로 하늘의 복과 아래로 원천의 복과 젖먹이는 복과 태의 복이리로다","bsb":"By the God of your father who helps you, and by the Almighty who blesses you, with blessings of the heavens above."},{"ref":"누가복음 12:25-26","en":"Luke 12:25-26","krv":"또 너희 중에 누가 염려함으로 그 키를 한 자나 더할 수 있느냐 그런즉 지극히 작은 것이라도 능치 못하거든 어찌 그 다른 것을 염려하느냐","bsb":"Who of you by worrying can add a single hour to his life? So if you cannot do such a small thing, why do you worry about the rest?"}],"src":[{"name":"Daily Divine / DIVINE_SOURCE","title":"daily-2026.json · 2026-09-20 row","url":"https://daily-divine.newjeans1029.chatgpt.site/today/2026-09-20"}],"sha":"3c9552c27b2a8f26395f2a81845a77cd1a2605ba95ba8402f71212d60f8eff81"},{"date":"2026-09-21","title":"한 마음으로, 주님 편에 서는 하루","subtitle":"예레미야 32:39 · 사도행전 4:19","tagline":"마음이 갈라질 때, 하나님 앞에서 누구의 말을 먼저 들을지 다시 정한다.","body":"## 로중 묵상\n### 첫째 말씀 — 예레미야 32:39\n\n마음이 하루에도 몇 번씩 다른 쪽으로 끌려갈 때가 있지. 하나님은 그런 우리에게 “한 마음과 한 길”을 주겠다고 하셔. 모두가 같은 생각을 하게 만든다는 뜻이라기보다, 무엇을 기준으로 살아갈지 다시 붙들게 하신다는 약속에 가까워.\n\n“나를 경외함”도 겁에 질려 움츠러드는 태도는 아니야. 내 삶의 중심이 어디에 있는지 돌아보고, 다시 하나님 쪽으로 몸을 돌리는 일이야. 혼자 애써 마음을 하나로 만들기 전에 하나님이 먼저 길을 내어 주신다는 점이 이 말씀의 위로야.\n\n### 둘째 말씀 — 사도행전 4:19\n\n베드로와 요한은 예수님의 이름을 말하지 말라는 요구 앞에 서 있어. 두 사람은 목소리를 높여 모든 권력과 싸우겠다고 선언하지 않아. 대신 하나님 앞에서 사람의 말을 듣는 것과 하나님의 말씀을 듣는 것 중 무엇이 옳은지 판단해 달라고 말하지.\n\n믿음의 용기는 목소리의 크기에서 시작되지 않아. 누구 앞에서 옳고 그름을 가릴지 정하는 데서 시작돼. 그렇다고 사람의 말을 가볍게 여기라는 뜻은 아니야. 다른 사람의 말에 귀를 기울이되, 압박이 하나님의 뜻을 덮으려 할 때는 순서를 분명히 하는 거야.\n\n### 두 말씀이 만나는 곳\n\n예레미야의 약속은 흩어진 마음에 한 길을 주시는 하나님을 보여 주고, 사도행전의 장면은 그 길 위에서 누구의 말을 먼저 들을지 묻게 해. 한 마음은 고집 센 마음이 아니야. 하나님을 향한 중심이 분명해서 여러 목소리 속에서도 옳은 말을 분별하려는 마음이야.\n\n오늘 우리에게 필요한 것도 모두를 설득하는 힘보다 방향을 잃지 않는 조용한 충실함일지 몰라. 마음이 또 갈라지는 순간이 오면, 먼저 하나님 앞에 그 일을 가져가 보자. 그다음에 사람의 말을 듣고, 내가 해야 할 한 걸음을 고르면 돼.\n\n### 오늘 붙잡을 한 줄\n\n하나님이 주신 한 마음으로, 사람의 압박보다 주님의 뜻을 먼저 듣는다.\n\n## 맥체인 성경읽기365\n\n### 사무엘하 17장\n\n후새의 조언이 받아들여지면서 압살롬은 다윗을 바로 쫓지 않아. 다윗은 도망치는 중에도 사람들의 도움을 받고, 한밤중에 강을 건너며 다음 날을 준비해. 하나님의 섭리는 거대한 기적처럼만 오지 않아. 누구의 조언을 듣게 되는지, 누가 필요한 것을 건네는지 속에서도 드러나.\n\n### 고린도후서 10장\n\n바울은 사람의 기준으로 자신을 재지 않고, 다른 사람의 수고 위에 자랑을 세우지도 않아. 주께서 맡기신 자리 안에서 일하고, 칭찬이 필요하다면 주님께 받기를 바라지. 마음의 방향이 하나님께 맞춰지면 비교와 과장이 조금씩 힘을 잃어.\n\n### 에스겔 24장\n\n에스겔은 끓는 가마의 비유로 예루살렘의 굳은 죄를 드러내. 깨끗이 씻어 내야 할 것이 오래 남아 있는 모습은 겉모양만 고치는 일로는 마음의 부패가 사라지지 않는다는 사실을 보여 줘. 하나님 앞에서는 감추는 기술보다 정직한 인정이 먼저야.\n\n### 시편 72편\n\n시편 72편은 왕의 통치를 약한 사람과 가난한 사람을 살리는 일로 묘사해. 참된 권위는 자기 이름을 크게 만드는 데 있지 않고, 도움을 청하는 사람이 외면당하지 않게 하는 데 있어. 하나님이 주시는 한 길도 결국 이웃을 향한 정의와 자비로 확인돼.\n\n### 네 본문을 함께 읽기\n\n네 본문을 이어 읽으면 하나님을 향한 방향이 마음속 생각에만 머물지 않는다는 게 보여. 다윗에게는 피할 길이 열리고, 바울에게는 자랑의 기준이 정리돼. 예루살렘의 죄는 숨김없이 드러나고, 왕의 복은 약한 사람에게 흘러가야 해.\n\n하나님 앞에서 한 마음을 갖는다는 건 오늘 내가 듣고, 말하고, 돕는 방식이 달라지는 일이야.\n\n## 오늘의 적용\n\n오늘 여러 사람의 말이 한꺼번에 들어오는 자리에서 하나님 앞에 가져갈 질문 하나를 정해 보자. 누군가의 기대를 실망시키지 않으려는 마음과 정말 책임 있게 응답하려는 마음을 가만히 나눠 보자. 할 수 있는 말은 부드럽고 분명하게 하고, 하나님의 뜻과 어긋나는 요구에는 조용히 선을 긋자.\n\n## 짧은 기도\n\n하나님, 흩어진 제 마음에 한 마음과 한 길을 주소서. 사람의 눈치를 보느라 주님의 뜻을 뒤로 미루지 않게 하시고, 주님 앞에서 먼저 듣고 판단하게 하소서. 오늘 제 말과 선택이 약한 사람을 외면하지 않게 하시며, 받은 은혜를 이웃에게 흘려보내게 하소서. 아멘.","v":[{"ref":"예레미야 32:39","en":"Jeremiah 32:39","krv":"내가 그들에게 한 마음과 한 도를 주어 자기들과 자기 후손의 복을 위하여 항상 나를 경외하게 하고","bsb":"I will give them one heart and one way, so that they will always fear Me for their own good and for the good of their children after them."},{"ref":"사도행전 4:19","en":"Acts 4:19","krv":"베드로와 요한이 대답하여 가로되 하나님 앞에서 너희 말 듣는 것이 하나님 말씀 듣는 것보다 옳은가 판단하라","bsb":"Judge for yourselves whether it is right in God’s sight to listen to you rather than God."}],"src":[{"name":"Daily Divine / DIVINE_SOURCE","title":"daily-2026.json · 2026-09-21 row","url":"https://daily-divine.newjeans1029.chatgpt.site/today/2026-09-21"}],"sha":"3ac219691f739f9b08ffb94d9eab77c68c8095f03b1fc7dc04deaec488b29886"},{"date":"2026-09-22","title":"내 시대가 주의 손에 있다","subtitle":"시편 31:15 · 시편 54:4","tagline":"하나님의 도움은 위협을 지우는 말이 아니라, 그 안에서 우리를 붙드시는 손을 바라보게 한다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 시편 31:15\n\n“내 시대가 주의 손에 있사오니 내 원수와 핍박하는 자의 손에서 나를 건지소서.” 시편 기자는 자기 삶의 시간을 ‘내가 관리해야 할 일정’으로 붙들지 않는다. 그 시간은 이미 하나님의 손 안에 있다고 고백한다. 이 고백은 위험이 사라졌다는 말이 아니다. 원수와 핍박하는 자의 손을 바로 앞에 두고도, 더 큰 손이 자신을 붙들고 계심을 바라보는 말이다.\n\n### 둘째 말씀 — 시편 54:4\n\n“하나님은 나의 돕는 자시라 주께서 내 생명을 붙드는 자와 함께 하시나이다.” 여기서 도움은 멀리서 건네는 조언처럼 들리지 않는다. 생명이 무너지지 않도록 받치시는 하나님의 행동이다. 시편 기자는 자신이 버텨 낼 힘을 먼저 말하지 않고, 자신을 붙드시는 분을 먼저 부른다.\n\n### 두 말씀이 만나는 지점\n\n한 말씀은 우리의 시간이 하나님의 손에 있다고 말하고, 다른 말씀은 우리의 생명이 하나님의 붙드심 안에 있다고 말한다. 시간과 생명, 둘 다 우리가 완전히 통제할 수 없는 것들이다. 그래서 이 두 고백은 막연한 낙관이 아니라, 흔들리는 자리에서 시선을 옮기는 믿음이 된다.\n\n### 오늘 붙잡을 한 줄\n\n내 시대와 내 생명은 주의 손 안에 있다.\n\n## 오늘의 적용\n\n오늘 해야 할 일을 성실히 감당하되, 결과까지 내 손으로 붙들어 두려는 마음을 잠시 내려놓자. 불안이 커질수록 ‘무엇을 더 통제할까’보다 ‘누가 나를 붙들고 계신가’를 먼저 기억해도 좋다.\n\n## 짧은 기도\n\n하나님, 제 시간과 생명을 제가 지켜야 한다는 두려움에서 건져 주소서. 눈앞의 위협을 가볍게 여기지 않으면서도, 저를 붙드시는 주의 손을 더 분명히 바라보게 하소서. 아멘.","v":[{"ref":"시편 31:15","en":"Psalm 31:15","krv":"내 시대가 주의 손에 있사오니 내 원수와 핍박하는 자의 손에서 나를 건지소서","bsb":"My times are in Your hands."},{"ref":"시편 54:4","en":"Psalm 54:4","krv":"하나님은 나의 돕는 자시라 주께서 내 생명을 붙드는 자와 함께 하시나이다","bsb":"Surely God is my helper; the Lord is the sustainer of my soul."}],"src":[{"name":"Daily Divine / DIVINE_SOURCE","title":"daily-2026.json · 2026-09-22 row","url":"https://daily-divine.newjeans1029.chatgpt.site/today/2026-09-22"}],"sha":"e8e94f01d23b4fda174531cd47c17cf6f9b38db38cc7091b07acdf595d09d713"},{"date":"2026-09-23","title":"기도를 배운다는 것","subtitle":"누가복음 11:1 · 마태복음 6:6","tagline":"기도는 잘하는 사람의 문장이 아니라, 아버지께 가는 길을 배우는 일이다.","body":"## 로중 묵상\n\n### 첫째 말씀 — 누가복음 11:1\n\n예수님이 기도를 마치시자 제자 하나가 다가와 “우리에게도 기도를 가르쳐 달라”고 청한다. 제자는 기도할 말의 목록보다, 예수님이 아버지께 향하시는 그 길을 보고 있었던 듯하다. 기도는 혼자 익혀 낸 기술이 아니라, 주님에게서 배우는 일이 된다.\n\n### 둘째 말씀 — 마태복음 6:6\n\n예수님은 사람들에게 보이기 좋은 자리보다 문을 닫은 골방을 말씀하신다. 여기서 골방은 세상과 완전히 끊어진 특별한 장소라기보다, 하나님 앞에서 꾸밈을 내려놓는 자리다. 아무도 박수치지 않아도 아버지께서는 보고 계신다고 하신다.\n\n### 두 말씀이 만나는 지점\n\n누가복음의 제자는 “가르쳐 달라”고 말하고, 마태복음의 예수님은 “아버지께 가라”고 이끄신다. 기도를 잘한다는 것은 문장을 근사하게 만드는 일이 아니라, 내 말을 숨기지 않고 하나님께 가져가는 법을 조금씩 익히는 데 더 가깝다.\n\n### 오늘 붙잡을 한 줄\n\n기도는 잘하는 사람의 문장이 아니라, 아버지께 가는 길을 배우는 일이다.\n\n## 오늘의 적용\n\n오늘 기도할 때 해결책부터 길게 늘어놓지 못해도 괜찮다. 마음에 가장 먼저 떠오르는 한 가지를 하나님께 그대로 말씀드려 보자. 짧더라도 그분 앞에 머무는 시간이 기도의 시작이 될 수 있다.\n\n## 짧은 기도\n\n아버지 하나님, 제 기도를 그럴듯한 말로 꾸미려 하기보다 주님께 솔직히 가져가게 하소서. 예수님께 배우며, 오늘도 은밀한 자리에서 주님을 찾게 하소서. 아멘.","v":[{"ref":"누가복음 11:1","en":"Luke 11:1","krv":"예수께서 한 곳에서 기도하시고 마치시매 제자 중 하나가 여짜오되 주여 요한이 자기 제자들에게 기도를 가르친 것과 같이 우리에게도 가르쳐 주옵소서","bsb":"Lord, teach us to pray."},{"ref":"마태복음 6:6","en":"Matthew 6:6","krv":"너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라","bsb":"But when you pray, go into your inner room, shut your door, and pray to your Father, who is unseen. And your Father, who sees what is done in secret, will reward you."}],"src":[{"name":"Daily Divine DIVINE_SOURCE","title":"daily-2026.json — 2026-09-23 verified row","url":"https://daily-divine.newjeans1029.chatgpt.site/"}],"sha":"bf7b201711c6ea1277193822a692a129c9da506d60bad25a5569761ca34da40f"},{"date":"2026-09-24","title":"이해를 건네는 곁","subtitle":"사도행전 8:30 · 요한일서 5:20","tagline":"이해는 혼자 해내는 일이 아니라, 곁에 오시는 분과 함께 걷는 길이야.","body":"## 로중 묵상\n\n### 첫째 말씀 — 사도행전 8:30\n\n빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느뇨\n\n이 장면에서는 질문보다 빌립의 걸음이 먼저 보여. 그는 멀리서 답을 던지지 않고, 읽고 있는 사람 곁으로 달려가. 이해하지 못하는 순간을 혼자 견디라고 두지 않는 태도에서 대화가 시작돼.\n\n### 둘째 말씀 — 요한일서 5:20\n\n또 아는 것은 하나님의 아들이 이르러 우리에게 지각을 주사 우리로 참된 자를 알게 하신 것과 또한 우리가 참된 자 곧 그의 아들 예수 그리스도 안에 있는 것이니 그는 참 하나님이시요 영생이시라\n\n여기서 지각은 정보를 많이 외우는 힘만은 아니야. 참된 분을 알아보고, 그리스도 안에 머물게 하는 선물로 말해. 모른다고 인정하는 자리는 믿음의 반대편이 아니라, 배움을 받을 수 있는 자리일 수 있어.\n\n### 두 말씀이 만나는 지점\n\n한 장면에서는 빌립이 다가가고, 다른 말씀에서는 아들이 지각을 주셔. 이해가 나 혼자 쥐어짜내야 하는 성취라면 질문은 부끄러울 텐데, 이 두 구절은 묻고 배울 관계가 이미 주어졌다고 보여줘.\n\n### 오늘 붙잡을 한 줄\n\n모른다고 말할 수 있을 때, 이해는 함께 걷는 일로 시작돼.\n\n## 오늘의 적용\n\n오늘 잘 모르는 문제 하나를 숨기지 말고, 믿을 만한 사람에게 물어보자. 누군가의 질문을 들을 때는 서둘러 답을 고치기보다 먼저 옆에 앉아 주자. 진리를 향한 대화는 그 작은 동행에서 깊어질 수 있어.\n\n## 짧은 기도\n\n참되신 하나님, 모르는 것을 감추지 않게 하시고, 묻고 배우는 겸손과 기꺼이 곁에 서는 마음을 주세요. 아멘.","v":[{"ref":"사도행전 8:30","en":"Acts 8:30","krv":"빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느뇨","bsb":"Do you understand what you are reading?"},{"ref":"요한일서 5:20","en":"1 John 5:20","krv":"또 아는 것은 하나님의 아들이 이르러 우리에게 지각을 주사 우리로 참된 자를 알게 하신 것과 또한 우리가 참된 자 곧 그의 아들 예수 그리스도 안에 있는 것이니 그는 참 하나님이시요 영생이시라","bsb":"We know that the Son of God has come and has given us understanding, so that we may know Him who is true."}],"src":[{"name":"Daily Divine DIVINE_SOURCE","title":"daily-2026.json — 2026-09-24 verified row","url":"https://daily-divine.newjeans1029.chatgpt.site/"}],"sha":"ddf926f6d02574657f808fb26d680ebd3fcb6d4f9077c51d83fb70c2572dbc2d"},{"date":"2026-09-25","title":"대대로 우리의 거처","subtitle":"시편 90:1-2 · 요한계시록 1:8","tagline":"변하는 날들 가운데, 하나님은 우리가 돌아갈 거처이시다.","body":"## 로중 묵상\n### 첫째 말씀 — 시편 90:1-2\n“주여 주는 대대에 우리의 거처가 되셨나이다.” 모세의 기도로 전해지는 이 시편은 곧 인간의 짧은 날과 하나님 앞에서의 덧없음을 말해. 그러니 여기서 거처는 오래 살 수 있는 안전한 장소를 약속한다기보다, 세대가 바뀌고 산이 생기기 전부터 계신 하나님께 우리가 돌아간다는 고백에 가까워. 시간에 쫓길수록 내 삶을 단단히 붙들어 줄 무언가를 찾게 되지만, 시인은 땅보다 먼저 계신 분을 바라보게 해.\n\n### 둘째 말씀 — 요한계시록 1:8\n“나는 알파와 오메가라.” 요한이 교회
